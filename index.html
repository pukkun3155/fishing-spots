          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🎣 自分の実績（{effective.fishName}）</div>
            {personalStats.tripCount===0?(
              <div style={{fontSize:12,color:"#6a9bb8",lineHeight:1.6}}>
                自分の実績データはまだ少ないため、最近の周辺釣果と一般的な適性を中心に表示しています。
              </div>
            ):(
              <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8}}>
                釣行{personalStats.overall.total}回中 釣果あり{personalStats.overall.withCatch}回
                （{Math.round(personalStats.overall.withCatch/personalStats.overall.total*100)}%）
                {sampleLabel(personalStats.overall.total)&&<span style={{color:"#f5a623"}}>（{sampleLabel(personalStats.overall.total)}）</span>}<br/>
                総匹数 {personalStats.overall.totalCatch}匹
                1時間あたり {personalStats.overall.catchPerHour!=null?personalStats.overall.catchPerHour.toFixed(2)+"匹":"算出不可"}<br/>
                {personalStats.timeStat&&`時間帯実績：${personalStats.timeStat.count}回中${personalStats.timeStat.withCatch}回釣果あり`}
                {personalStats.spotStat&&<><br/>ポイント実績：{personalStats.spotStat.total}回中{personalStats.spotStat.withCatch}回釣果あり</>}
              </div>
            )}
          </div>

          {/* 8. タックル適合 */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🎣 タックル適合</div>
            <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8}}>
              ロッド：{gearProfile.rods?.[0]?.name||"未登録"}
              {gearProfile.rods?.[0]&&`（${gearProfile.rods[0].lureWeightMinG}〜${gearProfile.rods[0].lureWeightMaxG}g）`}<br/>
              {shownMethod?(<>おすすめ手法：{shownMethod.name}{shownMethod.typicalWeightG?`（目安${shownMethod.typicalWeightG}g）`:""}<br/></>):null}
              判定：{effective.gearFit
                ?<span style={{color:"#2ecc87"}}>○ 適合範囲</span>
                :<span style={{color:"#e84c3d"}}>⚠ 現在のロッド適合範囲外</span>}
            </div>
          </div>

          {/* 9. 持ち物確認 */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🎒 持ち物確認</div>
            {gearTemplate?(
              <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8}}>
                チェック済み {checkedCount}件 / 全{totalCount}件<br/>
                {prepReady?(
                  <span style={{color:"#2ecc87"}}>準備状況は良好です。</span>
                ):(
                  <>
                    <span style={{color:"#e84c3d"}}>⚠ 準備未完了</span>
                    <div style={{marginTop:4}}>未チェック：{uncheckedImportant.map(i=>i.label).join("、")}</div>
                  </>
                )}
              </div>
            ):(
              <div style={{fontSize:12,color:"#6a9bb8"}}>持ち物テンプレートがありません。</div>
            )}
          </div>

          {/* 10. 行動ボタン */}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {effective.matchedSpot?(
              <button onClick={()=>onStartFishingAt(effective.matchedSpot,{targetFish:effective.fishName,
                  rig:shownMethod?shownMethod.name:""})}
                style={{width:"100%",padding:14,borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",
                  background:"#f5a623",border:"none",color:"#1a0a00"}}>
                🎣 このプランで釣り開始
              </button>
            ):(
              <div style={{fontSize:11,color:"#6a9bb8",textAlign:"center"}}>ポイント未指定のため開始できません。「📍 ポイントを変更」から選んでください。</div>
            )}
            <button onClick={()=>setShowSkip(true)}
              style={{width:"100%",padding:10,borderRadius:10,fontSize:13,cursor:"pointer",
                background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8"}}>
              今日は見送る
            </button>
          </div>
        </>
      ):(
        <div style={{fontSize:12,color:"#6a9bb8",lineHeight:1.7}}>
          {reportsError?"最新釣果情報を取得できませんでした。自分の実績が増えると、ここに傾向が表示されます。"
            :"おすすめを判断するデータが不足しています。自分の実績や周辺の釣果情報が増えると、ここに表示されます。"}
        </div>
      )}

      <SkipLogModal show={showSkip} onClose={()=>setShowSkip(false)} snapshot={skipSnapshot}
        onSave={({reason,note})=>{
          onSaveSkipLog({
            date:todayStr, plannedFish:effective?effective.fishName:"",
            plannedSpotId:effective?.matchedSpot?.id||null, reason, note,
            conditionsSnapshot:effectiveConditions||null,
          });
          setShowSkip(false);
        }}/>
    </div>
  );
}

function getPlanFishOptions(targetProfiles,fishMaster){
  const set=new Set(); const list=[];
  (targetProfiles||[]).forEach(p=>{ if(!set.has(p.fishName)){ set.add(p.fishName); list.push(p.fishName); } });
  (fishMaster||[]).forEach(f=>{ if(!set.has(f.name)){ set.add(f.name); list.push(f.name); } });
  return list;
}

function PlanCandidateCard({evaluation,rank,label,comparativeLabels,todayStr,now,spots,fishOptions,
  onUpdate,onDelete,onDuplicate,onAdopt,onFetchOne,onFetchTide,fetchLoading,tideLoading}){
  const [applyForecast,setApplyForecast]=useState(false);
  const c=evaluation.candidate;
  const spot=evaluation.spot;
  const startPassed=isPlanStartTimePassed(c.date,c.startTime,todayStr,now);
  const canFetchWeather=!!(spot&&spot.lat&&spot.lng);
  const canFetchTide=!!(spot&&spot.tideStationId);
  const hasFetchedData=!!(evaluation.weather||evaluation.marine||evaluation.tideEntry);
  const catColor={top:"#2ecc87",good:"#7ab3ff",reference:"#6a9bb8",caution:"#e84c3d",insufficient:"#6a9bb8"}[evaluation.category];

  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${catColor}55`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:700,color:"#fff"}}>{label}</span>
        <span style={{fontSize:12,fontWeight:700,color:catColor}}>{PLAN_CATEGORY_LABEL[evaluation.category]}</span>
      </div>

      {evaluation.isPast&&<div style={{fontSize:11,color:"#e84c3d",marginBottom:6}}>過去の候補（比較対象外）</div>}
      {!evaluation.isPast&&startPassed&&<div style={{fontSize:11,color:"#f5a623",marginBottom:6}}>開始予定時刻を過ぎています</div>}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <Field label="予定日"><Input type="date" min={todayStr} value={c.date} onChange={e=>onUpdate(c.id,{date:e.target.value})}/></Field>
        <Field label="開始時刻"><Input type="time" value={c.startTime} onChange={e=>onUpdate(c.id,{startTime:e.target.value})}/></Field>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <Field label="釣行時間（分）"><Input type="number" value={c.durationMin} onChange={e=>onUpdate(c.id,{durationMin:e.target.value})}/></Field>
        <Field label="ポイント">
          <Sel value={c.spotId} onChange={e=>onUpdate(c.id,{spotId:e.target.value})}>
            <option value="">未選択</option>
            {spots.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </Sel>
        </Field>
      </div>
      <Field label="狙い魚">
        <Sel value={c.targetFish} onChange={e=>onUpdate(c.id,{targetFish:e.target.value})}>
          <option value="">未選択（比較対象外）</option>
          {fishOptions.map(f=><option key={f} value={f}>{f}</option>)}
        </Sel>
      </Field>

      {!evaluation.fishName?(
        <div style={{fontSize:11,color:"#6a9bb8",marginBottom:8}}>狙い魚を選択すると比較できます。</div>
      ):(
        <>
          <div style={{fontSize:11,color:"#6a9bb8",marginBottom:6}}>評価材料 {evaluation.evaluatedCount}/{evaluation.totalCount}項目</div>

          <div style={{marginBottom:8}}>
            {!canFetchWeather?(
              <div style={{fontSize:11,color:"#6a9bb8"}}>予報取得にはポイントの緯度経度が必要です</div>
            ):evaluation.outOfHorizon?(
              <div style={{fontSize:11,color:"#6a9bb8"}}>まだ予報対象期間外です（本人実績・最新釣果・タックルのみで比較します）</div>
            ):(
              <>
                <button onClick={()=>onFetchOne(c)} disabled={fetchLoading}
                  style={{width:"100%",padding:"7px 8px",borderRadius:8,fontSize:11,fontWeight:600,cursor:fetchLoading?"default":"pointer",
                    background:"rgba(122,179,255,0.15)",border:"1px solid rgba(122,179,255,0.4)",color:"#7ab3ff"}}>
                  {fetchLoading?"取得中…":evaluation.weather||evaluation.marine?"再取得":"☁️ この候補の予報を取得"}
                </button>
                {!evaluation.weather&&evaluation.weatherError&&<div style={{fontSize:10,color:"#e84c3d",marginTop:3}}>天気：{evaluation.weatherError}</div>}
                {!evaluation.marine&&evaluation.marineError&&<div style={{fontSize:10,color:"#e84c3d",marginTop:3}}>波：{evaluation.marineError}</div>}
              </>
            )}
          </div>

          {(evaluation.weather||evaluation.marine)&&(
            <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8,marginBottom:8}}>
              {evaluation.weather&&<>風 {evaluation.weather.windSpeedMs!=null?evaluation.weather.windSpeedMs+"m/s":"—"}
                {evaluation.weather.windGustMs!=null&&`（突風${evaluation.weather.windGustMs}m/s）`}<br/></>}
              {evaluation.marine&&<>波 {evaluation.marine.waveHeightM!=null?evaluation.marine.waveHeightM+"m":"—"}<br/></>}
              {evaluation.weather&&evaluation.weather.precipitationMm!=null&&<>雨 {evaluation.weather.precipitationMm}mm<br/></>}
            </div>
          )}

          <div style={{marginBottom:8}}>
            {!canFetchTide?(
              <div style={{fontSize:11,color:"#6a9bb8"}}>🌊 潮汐観測地点が未設定です</div>
            ):(
              <>
                <button onClick={()=>onFetchTide(c)} disabled={tideLoading}
                  style={{width:"100%",padding:"7px 8px",borderRadius:8,fontSize:11,fontWeight:600,cursor:tideLoading?"default":"pointer",
                    background:"rgba(122,179,255,0.15)",border:"1px solid rgba(122,179,255,0.4)",color:"#7ab3ff"}}>
                  {tideLoading?"取得中…":evaluation.tideEntry?"再取得":"🌊 潮汐を取得"}
                </button>
                {evaluation.tideEntry&&(
                  <div style={{fontSize:12,color:"#d0e8f5",marginTop:6,lineHeight:1.8}}>
                    {evaluation.tideEntry.highs.map((h,i)=><div key={"h"+i}>満潮 {h.time}（{h.heightCm}cm）</div>)}
                    {evaluation.tideEntry.lows.map((l,i)=><div key={"l"+i}>干潮 {l.time}（{l.heightCm}cm）</div>)}
                    {evaluation.tideRelation&&evaluation.tideRelation.nextHigh&&<div>満潮まで{formatDurationMin(evaluation.tideRelation.nextHigh.min-evaluation.tideRelation.planMin)}</div>}
                    {evaluation.tideRelation&&evaluation.tideRelation.nextLow&&<div>干潮まで{formatDurationMin(evaluation.tideRelation.nextLow.min-evaluation.tideRelation.planMin)}</div>}
                    {evaluation.tideRelation&&evaluation.tideRelation.direction&&<div>天文潮位上：{evaluation.tideRelation.direction}</div>}
                  </div>
                )}
              </>
            )}
          </div>

          {comparativeLabels&&comparativeLabels.length>0&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
              {comparativeLabels.map((l,i)=>(
                <span key={i} style={{fontSize:10,padding:"3px 8px",borderRadius:12,background:"rgba(46,204,135,0.12)",color:"#2ecc87"}}>{l}</span>
              ))}
            </div>
          )}

          {evaluation.reasons.length>0&&(
            <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.7,marginBottom:4}}>
              {evaluation.reasons.map((r,i)=><div key={i}>・{r}</div>)}
            </div>
          )}
          {evaluation.cautions.length>0&&(
            <div style={{fontSize:12,color:"#f0b8b0",lineHeight:1.7,marginBottom:8}}>
              注意：{evaluation.cautions.map((c2,i)=><div key={i}>・{c2}</div>)}
            </div>
          )}

          <div style={{fontSize:11,color:"#6a9bb8",marginBottom:8}}>採用後にPhase7ブリーフィングで持ち物チェック</div>
        </>
      )}

      {hasFetchedData&&(
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#6a9bb8",marginBottom:8,cursor:"pointer"}}>
          <input type="checkbox" checked={applyForecast} onChange={e=>setApplyForecast(e.target.checked)}/>
          予報値も反映する（未入力の項目のみ。手入力済みの値は上書きしません）
        </label>
      )}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <button onClick={()=>onAdopt(c,{applyForecast})} disabled={!spot||!evaluation.fishName}
          style={{flex:"1 1 auto",padding:"9px 10px",borderRadius:8,fontSize:12,fontWeight:700,
            cursor:(!spot||!evaluation.fishName)?"default":"pointer",opacity:(!spot||!evaluation.fishName)?0.5:1,
            background:"#f5a623",border:"none",color:"#1a0a00"}}>
          ✅ この候補を採用
        </button>
        <button onClick={()=>onDuplicate(c.id)}
          style={{padding:"9px 10px",borderRadius:8,fontSize:12,cursor:"pointer",
            background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8"}}>
          複製
        </button>
        <button onClick={()=>onDelete(c.id)}
          style={{padding:"9px 10px",borderRadius:8,fontSize:12,cursor:"pointer",
            background:"transparent",border:"1px solid rgba(232,76,61,0.4)",color:"rgba(232,76,61,0.8)"}}>
          削除
        </button>
      </div>
    </div>
  );
}

function PlanCompareView({candidates,spots,targetProfiles,fishMaster,gearProfile,trips,catches,reports,reportsUpdatedAt,
  planForecastCache,planFetchStatus,onFetchOneForecast,onFetchAllForecasts,
  tideCache,autoTideStatus,onFetchTide,
  onAddCandidate,onUpdateCandidate,onDeleteCandidate,onDuplicateCandidate,
  onAdopt,onClose}){
  const now=Date.now();
  const todayStr=new Date().toISOString().slice(0,10);

  const evaluations=candidates.map(c=>{
    const spot=spots.find(s=>s.id===c.spotId)||null;
    const forecastForMs=spot?computeForecastForMs(c.date,c.startTime):null;
    const cacheKey=spot?planForecastCacheKey(spot.id,forecastForMs):null;
    const entry=cacheKey?(planForecastCache.entries||{})[cacheKey]:null;
    const forecastEntry=(entry&&entry.forecastFor===forecastForMs)?entry:null;
    const tideEntryRaw=(tideCache&&spot&&tideCache.stationId===spot.tideStationId&&tideCache.date===c.date)?tideCache:null;
    return evaluatePlanCandidate({candidate:c,spot,forecastEntry,tideEntry:tideEntryRaw,
      reports,trips,catches,targetProfiles,gearProfile,now,todayStr});
  });

  const {sorted,nearTie}=rankPlanEvaluations(evaluations);
  const comparativeLabels=getPlanComparativeLabels(sorted.filter(e=>e.weather||e.marine));
  const rankOf=new Map(sorted.map((e,i)=>[e.candidate.id,i]));
  const rankLabel=["🥇 第1候補","🥈 第2候補","🥉 第3候補"];

  const allCaution=sorted.length>0&&sorted.every(e=>e.hasSafetyBlocker);
  const anyFetched=evaluations.some(e=>e.weather||e.marine);
  const latestFetchedAt=Object.values(planForecastCache.entries||{}).reduce((m,e)=>Math.max(m,e.fetchedAt||0),0);
  const forecastAgeMin=latestFetchedAt?formatCacheAgeMinutes(latestFetchedAt,now):null;
  const reportsUpdateDays=reportsUpdatedAt?daysAgo(reportsUpdatedAt,now):null;
  const reportsUpdateInfo=reportsUpdateDays==null?null:(reportsUpdateDays<=0?"今日更新":`${reportsUpdateDays}日前更新`);

  const fishOptions=getPlanFishOptions(targetProfiles,fishMaster);

  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:14,padding:"14px 14px 16px",marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{fontSize:16,fontWeight:700,color:"#fff"}}>📅 候補日時を比較（現時点の比較）</span>
        <button onClick={onClose}
          style={{fontSize:11,padding:"4px 10px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>
          閉じる
        </button>
      </div>
      <div style={{fontSize:10,color:"#6a9bb8",lineHeight:1.7,marginBottom:10}}>
        予報：{forecastAgeMin!=null?`${forecastAgeMin}分前取得`:"未取得"}
        釣果情報：{reportsUpdateInfo||"—"}
        潮汐：気象庁潮位表
      </div>

      {allCaution&&(
        <div style={{background:"rgba(232,76,61,0.1)",border:"1px solid rgba(232,76,61,0.4)",borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:12,color:"#f0b8b0",lineHeight:1.7}}>
          ⚠ 現在の候補はすべて条件に注意が必要です。別日時を追加することもできます。
        </div>
      )}
      {nearTie&&(
        <div style={{fontSize:11,color:"#6a9bb8",marginBottom:12}}>候補間で大きな差はありません（ほぼ同条件）。</div>
      )}

      {candidates.length===0&&(
        <div style={{fontSize:12,color:"#6a9bb8",lineHeight:1.7,marginBottom:12}}>
          候補がまだありません。「＋候補を追加」から日時・ポイント・狙い魚を設定してください。
        </div>
      )}

      {candidates.length>1&&(
        <button onClick={onFetchAllForecasts} disabled={planFetchStatus&&planFetchStatus.loading}
          style={{width:"100%",padding:"10px 8px",borderRadius:9,fontSize:12,fontWeight:600,marginBottom:12,
            cursor:planFetchStatus&&planFetchStatus.loading?"default":"pointer",
            background:"rgba(122,179,255,0.15)",border:"1px solid rgba(122,179,255,0.4)",color:"#7ab3ff"}}>
          {planFetchStatus&&planFetchStatus.loading?"取得中…":`☁️ ${candidates.length}候補の予報を取得`}
        </button>
      )}
      {planFetchStatus&&planFetchStatus.error&&(
        <div style={{fontSize:11,color:"#e84c3d",marginBottom:8}}>⚠️ {planFetchStatus.error}</div>
      )}

      {evaluations.map(e=>{
        const rank=rankOf.get(e.candidate.id);
        const label=e.isPast?"過去の候補":!e.fishName?"（未設定）":(rank!=null?rankLabel[rank]||`${rank+1}位`:"参考");
        return (
          <PlanCandidateCard key={e.candidate.id} evaluation={e} rank={rank} label={label}
            comparativeLabels={comparativeLabels[e.candidate.id]} todayStr={todayStr} now={now}
            spots={spots} fishOptions={fishOptions}
            onUpdate={onUpdateCandidate} onDelete={onDeleteCandidate} onDuplicate={onDuplicateCandidate}
            onAdopt={onAdopt} onFetchOne={onFetchOneForecast} onFetchTide={onFetchTide}
            fetchLoading={!!(planFetchStatus&&planFetchStatus.loading)}
            tideLoading={!!(autoTideStatus&&autoTideStatus.loading)}/>
        );
      })}

      <button onClick={onAddCandidate} disabled={candidates.length>=MAX_PLAN_CANDIDATES}
        style={{width:"100%",padding:"11px 8px",borderRadius:10,fontSize:13,fontWeight:600,
          cursor:candidates.length>=MAX_PLAN_CANDIDATES?"default":"pointer",
          opacity:candidates.length>=MAX_PLAN_CANDIDATES?0.5:1,
          background:"transparent",border:"1px dashed rgba(255,255,255,0.25)",color:"#d0e8f5"}}>
        {candidates.length>=MAX_PLAN_CANDIDATES?`＋候補を追加（最大${MAX_PLAN_CANDIDATES}件）`:"＋候補を追加"}
      </button>
    </div>
  );
}

function MorningCheckCard({todayConditions,spots,targetProfiles,fishMaster,gearProfile,trips,catches,reports,reportsUpdatedAt,
  conditionsCache,tideCache,morningCheck,morningCheckStatus,
  onFetchLatest,onFetchTide,onApplyAutoField,onSaveSkipLog,onAdoptPlan,
  onAdjustTime,onViewCandidates}){
  const [collapsed,setCollapsed]=useState(false);
  const [showDetail,setShowDetail]=useState(false);
  const [showSkip,setShowSkip]=useState(false);
  const [applyForecast,setApplyForecast]=useState(false);

  const now=Date.now();
  const todayStr=new Date().toISOString().slice(0,10);
  const spot=spots.find(s=>s.id===todayConditions.spotId)||null;
  const fishName=todayConditions.targetFish;

  // Phase11の表示条件：採用済みspot/targetFishが必須、かつ予定日が「今日」であること（明日・過去日は非表示＝通常ブリーフィングを使う）
  if(!spot||!fishName) return null;
  if(!todayConditions.plannedStartTime) return null;
  if(todayConditions.date!==todayStr) return null;

  const countdown=formatPlanCountdown(todayConditions.date,todayConditions.plannedStartTime,todayStr,now);
  const forecastForMs=computeForecastForMs(todayConditions.date,todayConditions.plannedStartTime);
  const planKey=computePlanKey(spot.id,todayConditions.date,todayConditions.plannedStartTime,fishName);

  const cacheMatchesPlan=!!(conditionsCache&&conditionsCache.spotId===spot.id&&conditionsCache.forecastFor===forecastForMs);
  const hasLatest=!!(morningCheck&&morningCheck.planKey===planKey&&morningCheck.latestSnapshot);
  const latestSnapshot=hasLatest?morningCheck.latestSnapshot:(cacheMatchesPlan?buildMorningSnapshot(conditionsCache.weather,conditionsCache.marine):null);
  const previousSnapshot=(morningCheck&&morningCheck.planKey===planKey)?morningCheck.previousSnapshot:null;
  const checkedAt=(morningCheck&&morningCheck.planKey===planKey)?morningCheck.checkedAt:null;
  const cacheAgeMin=checkedAt?formatCacheAgeMinutes(checkedAt,now):null;

  const weather=cacheMatchesPlan?conditionsCache.weather:null;
  const marine=cacheMatchesPlan?conditionsCache.marine:null;
  const weatherError=cacheMatchesPlan?conditionsCache.weatherError:null;
  const marineError=cacheMatchesPlan?conditionsCache.marineError:null;

  const diff=(hasLatest&&previousSnapshot)?getMorningCheckDiff(previousSnapshot,latestSnapshot):null;

  const profile=targetProfiles.find(p=>p.fishName===fishName)||null;
  const methods=profile?.recommendedMethods||[];
  const fitMethod=methods.find(m=>gearFits(m.typicalWeightG,gearProfile))||null;
  const gearOk=methods.length===0?true:!!fitMethod;

  const verdict=getMorningCheckVerdict({weather,marine,weatherError,marineError,gearOk,diff});
  const verdictColor={top:"#2ecc87",good:"#7ab3ff",attention:"#f5a623",caution:"#e84c3d",insufficient:"#6a9bb8"}[verdict.level];

  const reportStats=getPlanReportStats(reports,fishName,now);
  const personalStats=getBriefingPersonalStats({trips,catches,fishName,matchedSpot:spot,
    todayConditions:{plannedStartTime:todayConditions.plannedStartTime},now});

  const tideMatchesPlan=!!(tideCache&&spot.tideStationId&&tideCache.stationId===spot.tideStationId&&tideCache.date===todayConditions.date);
  const tideAgeMin=tideMatchesPlan?formatCacheAgeMinutes(tideCache.fetchedAt,now):null;
  const tideRelation=tideMatchesPlan?computeTideRelation(todayConditions.plannedStartTime,tideCache.highs,tideCache.lows):null;

  const gearTemplate=null; // 持ち物はPhase7側のテンプレートを参照（App側から渡さず、簡易表示のみここでは省略）

  // 音声向けの短い一文
  let voiceLine;
  if(verdict.level==="caution"){
    voiceLine=`${verdict.blockers[0]}のため条件注意です。時間変更または見送り候補を確認してください。`;
  }else if(verdict.level==="attention"){
    voiceLine="前回確認より条件が変化しています。内容を確認してから判断してください。";
  }else if(verdict.level==="insufficient"){
    voiceLine="最新の予報がまだ取得できていません。取得してから判断してください。";
  }else{
    voiceLine="現在は注意基準未満です。予定通り行く候補として確認できます。";
  }

  const skipSnapshot={fishName, spotName:spot.name};

  if(collapsed){
    return (
      <button onClick={()=>setCollapsed(false)}
        style={{width:"100%",padding:"9px 10px",borderRadius:10,fontSize:12,cursor:"pointer",marginBottom:14,
          background:"rgba(46,204,135,0.1)",border:"1px solid rgba(46,204,135,0.3)",color:"#2ecc87",textAlign:"left"}}>
        ✓ 予定通り確認済み（{cacheAgeMin!=null?`${cacheAgeMin}分前`:"確認済み"}）・再表示
      </button>
    );
  }

  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${verdictColor}55`,borderRadius:14,padding:"14px 14px 16px",marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:4}}>🌅 朝チェック</div>
      <div style={{fontSize:13,color:"#d0e8f5",marginBottom:2}}>
        今日 {todayConditions.plannedStartTime}
        {todayConditions.plannedDurationMin&&`〜${computePlannedEndTime(todayConditions.plannedStartTime,todayConditions.plannedDurationMin)?.text||""}`}
      </div>
      <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:6}}>{fishName} × {spot.name}</div>

      {countdown&&(
        <div style={{fontSize:12,color:countdown.overdue?"#f5a623":"#6a9bb8",marginBottom:2}}>{countdown.text}</div>
      )}
      {countdown&&countdown.veryEarly&&(
        <div style={{fontSize:11,color:"#6a9bb8",marginBottom:6}}>出発直前の再確認は開始数時間前がおすすめです。</div>
      )}
      <div style={{fontSize:10,color:"#6a9bb8",marginBottom:10}}>
        {checkedAt?`前回確認：${new Date(checkedAt).toLocaleDateString("ja-JP").slice(0,-1)!==new Date(now).toLocaleDateString("ja-JP").slice(0,-1)?"前日確認 → ":""}${new Date(checkedAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}　`:"前回確認：なし　"}
        現在：{new Date(now).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
      </div>

      <div style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${verdictColor}55`,borderRadius:10,padding:"10px 12px",marginBottom:10}}>
        <div style={{fontSize:15,fontWeight:700,color:verdictColor}}>{verdict.label}</div>
        <div style={{fontSize:12,color:"#d0e8f5",marginTop:4,lineHeight:1.6}}>{voiceLine}</div>
      </div>

      {!hasLatest?(
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:"#6a9bb8",marginBottom:6}}>まだ最新条件を確認していません。</div>
          <button onClick={onFetchLatest} disabled={morningCheckStatus&&morningCheckStatus.loading}
            style={{width:"100%",padding:"10px 8px",borderRadius:9,fontSize:13,fontWeight:700,
              cursor:morningCheckStatus&&morningCheckStatus.loading?"default":"pointer",
              background:"#f5a623",border:"none",color:"#1a0a00"}}>
            {morningCheckStatus&&morningCheckStatus.loading?"取得中…":"🔄 最新条件を確認"}
          </button>
          {morningCheckStatus&&morningCheckStatus.error&&<div style={{fontSize:11,color:"#e84c3d",marginTop:4}}>⚠️ {morningCheckStatus.error}</div>}
        </div>
      ):(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:11,color:"#6a9bb8"}}>{cacheAgeMin!=null?`予報：${cacheAgeMin}分前取得`:""}
              {cacheAgeMin!=null&&cacheAgeMin>30&&"（予報を再確認してください）"}</span>
            <button onClick={onFetchLatest} disabled={morningCheckStatus&&morningCheckStatus.loading}
              style={{fontSize:11,padding:"5px 10px",borderRadius:8,border:"1px solid rgba(122,179,255,0.4)",
                background:"rgba(122,179,255,0.15)",color:"#7ab3ff",cursor:"pointer"}}>
              {morningCheckStatus&&morningCheckStatus.loading?"取得中…":"🔄 再確認"}
            </button>
          </div>
          {morningCheckStatus&&morningCheckStatus.error&&<div style={{fontSize:11,color:"#e84c3d",marginBottom:6}}>⚠️ {morningCheckStatus.error}</div>}

          <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8,marginBottom:8}}>
            {latestSnapshot.weather&&<>天気　{latestSnapshot.weather}<br/></>}
            {latestSnapshot.temperatureC!=null&&<>気温　{latestSnapshot.temperatureC}℃<br/></>}
            {(latestSnapshot.windDirection||latestSnapshot.windSpeedMs!=null)&&<>風　{latestSnapshot.windDirection||""} {latestSnapshot.windSpeedMs!=null?latestSnapshot.windSpeedMs+"m/s":""}<br/></>}
            {latestSnapshot.windGustMs!=null&&<>突風　{latestSnapshot.windGustMs}m/s<br/></>}
            {latestSnapshot.waveHeightM!=null&&<>波高　{latestSnapshot.waveHeightM}m<br/></>}
            {latestSnapshot.precipitationMm!=null&&<>降水　{latestSnapshot.precipitationMm}mm<br/></>}
            {!weather&&weatherError&&<div style={{color:"#e84c3d"}}>天気：{weatherError}</div>}
            {!marine&&marineError&&<div style={{color:"#e84c3d"}}>波：{marineError}</div>}
          </div>

          {diff?(
            <div style={{background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"8px 10px",marginBottom:8,fontSize:12,color:"#d0e8f5",lineHeight:1.9}}>
              <div style={{color:"#6a9bb8",marginBottom:4}}>前回との差</div>
              {diff.wind.status&&<div>風速　前回{diff.wind.previous}m/s → 今回{diff.wind.latest}m/s　{diff.wind.status==="worse"?"↑":diff.wind.status==="better"?"↓":"→"}{diff.wind.delta>0?"+":""}{diff.wind.delta}m/s</div>}
              {diff.gust.status&&<div>突風　前回{diff.gust.previous}m/s → 今回{diff.gust.latest}m/s　{diff.gust.status==="worse"?"↑":diff.gust.status==="better"?"↓":"→"}{diff.gust.delta>0?"+":""}{diff.gust.delta}m/s</div>}
              {diff.wave.status&&<div>波高　前回{diff.wave.previous}m → 今回{diff.wave.latest}m　{diff.wave.status==="worse"?"↑":diff.wave.status==="better"?"↓":"→"}{diff.wave.delta>0?"+":""}{diff.wave.delta}m</div>}
              {diff.rain.status&&<div>降水　前回{diff.rain.previous}mm → 今回{diff.rain.latest}mm</div>}
              {diff.temp.delta!=null&&<div>気温　前回{diff.temp.previous}℃ → 今回{diff.temp.latest}℃</div>}
              {diff.windDirection.previous&&diff.windDirection.latest&&diff.windDirection.previous!==diff.windDirection.latest&&
                <div>風向　前回{diff.windDirection.previous} → 今回{diff.windDirection.latest}</div>}
              {diff.thunderAppeared&&<div style={{color:"#e84c3d"}}>⚠ 雷の可能性が追加されています</div>}
            </div>
          ):(
            <div style={{fontSize:11,color:"#6a9bb8",marginBottom:8}}>前回比較データなし</div>
          )}

          {verdict.blockers&&verdict.blockers.length>0&&(
            <div style={{fontSize:12,color:"#e84c3d",lineHeight:1.7,marginBottom:8}}>
              {verdict.blockers.map((b,i)=><div key={i}>⚠ {b}</div>)}
            </div>
          )}

          {(()=>{
            const autoVals=buildAutoFieldValues(weather,marine);
            const conflicts=Object.entries(autoVals).filter(([k,v])=>v!=null&&todayConditions[k]&&todayConditions[k]!==v);
            if(conflicts.length===0) return null;
            return (
              <div style={{marginBottom:8,fontSize:12,color:"#d0e8f5"}}>
                <div style={{color:"#f5a623",marginBottom:4}}>手入力済みの値と異なります（自動上書きしません）：</div>
                {conflicts.map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span>{AUTO_FIELD_LABELS[k]}：自動{v} / 現在{todayConditions[k]}</span>
                    <button onClick={()=>onApplyAutoField(k,v)}
                      style={{fontSize:10,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(245,166,35,0.4)",background:"transparent",color:"#f5a623",cursor:"pointer"}}>
                      自動値を反映
                    </button>
                  </div>
                ))}
              </div>
            );
          })()}
        </>
      )}

      <button onClick={()=>setShowDetail(v=>!v)}
        style={{fontSize:11,color:"#6a9bb8",background:"none",border:"none",cursor:"pointer",padding:0,marginBottom:8}}>
        {showDetail?"詳細を閉じる":"潮汐・釣果・実績・タックル・持ち物を見る"}
      </button>

      {showDetail&&(
        <div style={{marginBottom:8}}>
          <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🌊 潮汐</div>
          {!spot.tideStationId?(
            <div style={{fontSize:11,color:"#6a9bb8",marginBottom:8}}>潮汐観測地点が未設定です</div>
          ):!tideMatchesPlan?(
            <button onClick={()=>onFetchTide({spotId:spot.id,date:todayConditions.date,startTime:todayConditions.plannedStartTime})}
              style={{width:"100%",padding:"8px 8px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",marginBottom:8,
                background:"rgba(122,179,255,0.15)",border:"1px solid rgba(122,179,255,0.4)",color:"#7ab3ff"}}>
              🌊 潮汐を取得
            </button>
          ):(
            <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8,marginBottom:8}}>
              {tideAgeMin!=null&&<div style={{fontSize:10,color:"#6a9bb8"}}>気象庁 天文潮位（{tideAgeMin<60?`${tideAgeMin}分前`:`${Math.floor(tideAgeMin/60)}時間前`}・{spot.tideStationName}）</div>}
              {tideCache.highs.map((h,i)=><div key={"h"+i}>満潮 {h.time}（{h.heightCm}cm）</div>)}
              {tideCache.lows.map((l,i)=><div key={"l"+i}>干潮 {l.time}（{l.heightCm}cm）</div>)}
              {tideRelation&&tideRelation.nextHigh&&<div>満潮まで{formatDurationMin(tideRelation.nextHigh.min-tideRelation.planMin)}</div>}
              {tideRelation&&tideRelation.nextLow&&<div>干潮まで{formatDurationMin(tideRelation.nextLow.min-tideRelation.planMin)}</div>}
              {tideRelation&&tideRelation.direction&&<div>天文潮位上：{tideRelation.direction}</div>}
            </div>
          )}

          <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>📰 最近の周辺釣果（{fishName}）</div>
          <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8,marginBottom:8}}>
            {reportStats.shoreCount===0&&reportStats.boatCount===0?"最近の岸情報は少なめです":(
              <>直近7日以内の岸情報：{reportStats.shoreWithin7}件　30日以内：{reportStats.shoreWithin30}件
                {reportStats.boatCount>0&&<><br/>船情報：{reportStats.boatCount}件（岸釣り実績には含みません）</>}</>
            )}
          </div>

          <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🎣 本人実績</div>
          <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8,marginBottom:8}}>
            {personalStats.tripCount===0?"実績データはまだ少なめです":(
              <>{fishName} × {spot.name}：釣行{personalStats.overall.total}回中 釣果あり{personalStats.overall.withCatch}回
                {sampleLabel(personalStats.overall.total)&&<span style={{color:"#f5a623"}}>（{sampleLabel(personalStats.overall.total)}）</span>}
                {personalStats.timeStat&&<><br/>時間帯実績：{personalStats.timeStat.count}回中{personalStats.timeStat.withCatch}回</>}</>
            )}
          </div>

          <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🎣 タックル適合</div>
          <div style={{fontSize:12,color:"#d0e8f5",marginBottom:8}}>
            {gearOk?<span style={{color:"#2ecc87"}}>○ 適合</span>:<span style={{color:"#e84c3d"}}>⚠ 適合外</span>}
            {fitMethod&&`（${fitMethod.name}）`}
          </div>

          <div style={{fontSize:11,color:"#6a9bb8",marginBottom:8}}>持ち物は採用後にPhase7ブリーフィングでご確認ください。</div>
        </div>
      )}

      {hasLatest&&(
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#6a9bb8",marginBottom:10,cursor:"pointer"}}>
          <input type="checkbox" checked={applyForecast} onChange={e=>setApplyForecast(e.target.checked)}/>
          最新予報値を今日の条件へ反映する（未入力の項目のみ）
        </label>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <button onClick={()=>{ if(applyForecast) onAdoptPlan(); setCollapsed(true); }}
          style={{width:"100%",padding:13,borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",
            background:"#f5a623",border:"none",color:"#1a0a00"}}>
          ✅ 予定通り行く
        </button>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onAdjustTime}
            style={{flex:1,padding:10,borderRadius:10,fontSize:12,cursor:"pointer",
              background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8"}}>
            🕐 時間をずらす
          </button>
          <button onClick={onViewCandidates}
            style={{flex:1,padding:10,borderRadius:10,fontSize:12,cursor:"pointer",
              background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8"}}>
            📅 別候補を見る
          </button>
        </div>
        <button onClick={()=>setShowSkip(true)}
          style={{width:"100%",padding:10,borderRadius:10,fontSize:13,cursor:"pointer",
            background:"transparent",border:"1px solid rgba(232,76,61,0.4)",color:"rgba(232,76,61,0.8)"}}>
          ✖ 今日は見送る
        </button>
      </div>

      <SkipLogModal show={showSkip} onClose={()=>setShowSkip(false)} snapshot={skipSnapshot}
        onSave={({reason,note})=>{
          onSaveSkipLog({
            date:todayConditions.date, plannedFish:fishName, plannedSpotId:spot.id, reason, note,
            conditionsSnapshot:{ plan:{date:todayConditions.date,startTime:todayConditions.plannedStartTime,spotName:spot.name,fishName},
              todayConditions, weather:latestSnapshot, tide:tideMatchesPlan?{stationName:spot.tideStationName,direction:tideRelation?.direction||null}:null },
          });
          setShowSkip(false);
        }}/>
    </div>
  );
}

function TodayFishingView({activeSession,catches,fishMaster,recommendations,reports,reportsError,reportsMalformed,reportsUpdatedAt,todayConditions,onSaveTodayConditions,onResetTodayConditions,onStartFishingAt,trips,spots,targetProfiles,gearProfile,gearTemplates,onSaveSkipLog,conditionsCache,autoFetchStatus,onFetchAutoConditions,onApplyAutoField,tideCache,autoTideStatus,onFetchTide,onSwitchToSpots,onLogEvent,onLogCatch,onUpdateCatch,onEndSession,onOpenHomeMode,
  planCandidates,planForecastCache,planFetchStatus,onFetchOnePlanForecast,onFetchAllPlanForecasts,
  onAddPlanCandidate,onUpdatePlanCandidate,onDeletePlanCandidate,onDuplicatePlanCandidate,onAdoptPlanCandidate,adoptedPlan,
  onFetchPlanTide,morningCheck,morningCheckStatus,onMorningCheckFetch,onApplyMorningForecast,onEnsureCandidateForCurrentPlan}){
  const [showEnd,setShowEnd]=useState(false);
  const [showCatch,setShowCatch]=useState(false);
  const [onsiteCatch,setOnsiteCatch]=useState(null);
  const [showReports,setShowReports]=useState(false);
  const [showConditions,setShowConditions]=useState(false);
  const [showPlanCompare,setShowPlanCompare]=useState(false);
  const [toast,setToast]=useState("");
  const flash=msg=>{ setToast(msg); clearTimeout(flash._t); flash._t=setTimeout(()=>setToast(""),1400); };

  if(!activeSession){
    return (
      <div style={{padding:"16px 14px"}}>
        {!showPlanCompare&&(
          <MorningCheckCard todayConditions={todayConditions} spots={spots} targetProfiles={targetProfiles} fishMaster={fishMaster}
            gearProfile={gearProfile} trips={trips} catches={catches} reports={reports} reportsUpdatedAt={reportsUpdatedAt}
            conditionsCache={conditionsCache} tideCache={tideCache}
            morningCheck={morningCheck} morningCheckStatus={morningCheckStatus}
            onFetchLatest={onMorningCheckFetch} onFetchTide={onFetchPlanTide} onApplyAutoField={onApplyAutoField}
            onSaveSkipLog={onSaveSkipLog} onAdoptPlan={onApplyMorningForecast}
            onAdjustTime={()=>{ onEnsureCandidateForCurrentPlan(); setShowPlanCompare(true); }}
            onViewCandidates={()=>setShowPlanCompare(true)}/>
        )}
        <button onClick={()=>setShowPlanCompare(v=>!v)}
          style={{width:"100%",padding:"11px 8px",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:14,
            background:showPlanCompare?"rgba(255,255,255,0.06)":"rgba(245,166,35,0.15)",
            border:`1px solid ${showPlanCompare?"rgba(255,255,255,0.15)":"rgba(245,166,35,0.4)"}`,
            color:showPlanCompare?"#6a9bb8":"#f5a623"}}>
          {showPlanCompare?"📅 比較を閉じる":"📅 候補日時を比較"}
        </button>

        {showPlanCompare?(
          <PlanCompareView candidates={planCandidates} spots={spots} targetProfiles={targetProfiles} fishMaster={fishMaster}
            gearProfile={gearProfile} trips={trips} catches={catches} reports={reports} reportsUpdatedAt={reportsUpdatedAt}
            planForecastCache={planForecastCache} planFetchStatus={planFetchStatus}
            onFetchOneForecast={onFetchOnePlanForecast} onFetchAllForecasts={onFetchAllPlanForecasts}
            tideCache={tideCache} autoTideStatus={autoTideStatus} onFetchTide={onFetchPlanTide}
            onAddCandidate={onAddPlanCandidate} onUpdateCandidate={onUpdatePlanCandidate}
            onDeleteCandidate={onDeletePlanCandidate} onDuplicateCandidate={onDuplicatePlanCandidate}
            onAdopt={(c,opts)=>{ onAdoptPlanCandidate(c,opts); setShowPlanCompare(false); }}
            onClose={()=>setShowPlanCompare(false)}/>
        ):(
          <BriefingView recommendations={recommendations} trips={trips} catches={catches} reports={reports}
            targetProfiles={targetProfiles} gearProfile={gearProfile} spots={spots} gearTemplates={gearTemplates}
            todayConditions={todayConditions} reportsUpdatedAt={reportsUpdatedAt} reportsError={reportsError}
            reportsMalformed={reportsMalformed} onStartFishingAt={onStartFishingAt}
            onOpenConditions={()=>setShowConditions(true)} onSaveSkipLog={onSaveSkipLog}
            conditionsCache={conditionsCache} autoFetchStatus={autoFetchStatus}
            onFetchAutoConditions={onFetchAutoConditions} onApplyAutoField={onApplyAutoField}
            tideCache={tideCache} autoTideStatus={autoTideStatus} onFetchTide={onFetchTide}
            adoptedPlan={adoptedPlan}/>
        )}

        <TodayConditionsCard conditions={todayConditions} onSave={onSaveTodayConditions} onReset={onResetTodayConditions}
          expanded={showConditions} onToggleExpanded={()=>setShowConditions(v=>!v)}/>

        <button onClick={()=>setShowReports(v=>!v)}
          style={{width:"100%",padding:"10px 8px",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:16,
            background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",color:"#d0e8f5"}}>
          {showReports?"最近の周辺釣果を閉じる":"最近の周辺釣果を見る"}
        </button>
        {showReports&&<div style={{marginBottom:16}}><ReportsListView reports={reports}/></div>}

        <div style={{textAlign:"center",padding:"24px 10px",color:"#6a9bb8",fontSize:13,lineHeight:2,
          borderTop:"1px solid rgba(255,255,255,0.1)"}}>
          <div style={{fontSize:32,marginBottom:8}}>🎣</div>
          進行中の釣行がありません。<br/>
          「📍 ポイント」タブでスポットを選び、<br/>「🎣 ここで釣り開始」から始めましょう。
          <div style={{marginTop:16}}>
            <button onClick={onSwitchToSpots}
              style={{background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:"10px 18px",fontSize:14,fontWeight:700,cursor:"pointer"}}>
              📍 ポイントを選ぶ
            </button>
          </div>
        </div>
      </div>
    );
  }

  const sessionCatches=catches.filter(c=>c.tripId===activeSession.id);
  const keptCatches=sessionCatches.filter(c=>c.kept);
  const elapsed=Math.max(0,Math.round((Date.now()-activeSession.startAt)/60000));
  const actions=[
    ["bite","👆","アタリ","46,204,135"],
    ["catch","🐟","釣れた","245,166,35"],
    ["rig_change","🔧","仕掛け交換","106,155,184"],
    ["trouble","⚠️","トラブル","232,76,61"],
  ];

  const handleAction=type=>{
    if(type==="catch"){ setShowCatch(true); return; }
    onLogEvent(type);
    const found=actions.find(a=>a[0]===type);
    flash(`${found[1]} ${found[2]} を記録しました`);
  };

  const handleSaveCatch=({fishName,count,kept})=>{
    setShowCatch(false);
    const rec=onLogCatch({fishName,count,kept});
    if(kept) setOnsiteCatch(rec);
    else flash("🌊 リリースしました");
  };

  return (
    <div style={{padding:"16px 14px"}}>
      <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>{activeSession.spotName||"（スポット未設定）"}</div>
        <div style={{fontSize:12,color:"#6a9bb8",marginTop:4}}>
          開始 {new Date(activeSession.startAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}（経過 {elapsed}分）
        </div>
        <div style={{display:"flex",gap:14,marginTop:8,fontSize:12,color:"#d0e8f5"}}>
          <span>👆 アタリ {activeSession.biteCount||0}</span>
          <span>🐟 釣果 {activeSession.catchCount||0}</span>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        {actions.map(([type,emoji,label,col])=>(
          <button key={type} onClick={()=>handleAction(type)}
            style={{padding:"18px 8px",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer",
              background:`rgba(${col},0.12)`,border:`1px solid rgba(${col},0.35)`,color:`rgb(${col})`}}>
            <div style={{fontSize:26,marginBottom:4}}>{emoji}</div>{label}
          </button>
        ))}
      </div>

      <button onClick={()=>{
          const note=prompt("メモを入力してください");
          if(note!==null&&note.trim()){onLogEvent("memo",note.trim());flash("📝 メモを記録しました");}
        }}
        style={{width:"100%",padding:"12px 8px",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:10,
          background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",color:"#d0e8f5"}}>
        📝 メモを追加
      </button>

      {keptCatches.length>0&&(
        <button onClick={onOpenHomeMode}
          style={{width:"100%",padding:"12px 8px",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10,
            background:"rgba(245,166,35,0.15)",border:"1px solid rgba(245,166,35,0.4)",color:"#f5a623"}}>
          🏠 帰宅後の処理へ（持ち帰り {keptCatches.length}件）
        </button>
      )}

      <button onClick={()=>setShowEnd(true)}
        style={{width:"100%",padding:14,borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",
          background:"#e84c3d",border:"none",color:"#fff"}}>
        🏁 釣り終了
      </button>

      {sessionCatches.length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#6a9bb8",fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>🐟 釣果一覧</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {sessionCatches.map(c=>(
              <div key={c.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,
                background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"7px 10px"}}>
                <span style={{fontSize:12,color:"#d0e8f5"}}>{c.fishName} × {c.count}（{c.kept?"持ち帰り":"リリース"}）</span>
                {c.kept&&<button onClick={()=>setOnsiteCatch(c)}
                  style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(245,166,35,0.4)",
                    background:"transparent",color:"#f5a623",cursor:"pointer"}}>処理ガイド</button>}
              </div>
            ))}
          </div>
        </div>
      )}

      {activeSession.events?.length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#6a9bb8",fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>ログ</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {[...activeSession.events].reverse().map(ev=>(
              <div key={ev.id} style={{fontSize:12,color:"#6a9bb8",display:"flex",gap:8}}>
                <span style={{opacity:0.6}}>{new Date(ev.ts).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</span>
                <span>{ev.type==="catch"||ev.type==="memo"?"📝 "+ev.note:({bite:"👆 アタリ",rig_change:"🔧 仕掛け交換",trouble:"⚠️ トラブル"})[ev.type]||ev.type}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <Toast text={toast}/>
      <CatchQuickModal show={showCatch} onClose={()=>setShowCatch(false)} onSave={handleSaveCatch} fishMaster={fishMaster}/>
      {onsiteCatch&&<OnsiteHandlingGuide catchItem={onsiteCatch} fishMaster={fishMaster}
        onClose={()=>setOnsiteCatch(null)}
        onDone={()=>{onUpdateCatch(onsiteCatch.id,{handlingStatus:"onsite_done"});setOnsiteCatch(null);}}/>}
      <EndSessionModal show={showEnd} onClose={()=>setShowEnd(false)} onSave={review=>{setShowEnd(false);onEndSession(review);}}/>
    </div>
  );
}

function RateBadge({num,den}){
  const label=sampleLabel(den);
  return (
    <span style={{fontSize:10,color:"#6a9bb8"}}>
      {den}回中{num}回{label&&<span style={{color:"#f5a623",marginLeft:4}}>（{label}）</span>}
    </span>
  );
}

function Bar({value,max,color}){
  const pct=max>0?Math.min(100,Math.round((value/max)*100)):0;
  return (
    <div style={{background:"rgba(255,255,255,0.08)",borderRadius:6,height:8,overflow:"hidden",marginTop:6}}>
      <div style={{width:`${pct}%`,height:"100%",background:color||"#f5a623",borderRadius:6}}/>
    </div>
  );
}

function StatCard({label,value}){
  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
      <div style={{fontSize:17,fontWeight:700,color:"#fff"}}>{value}</div>
      <div style={{fontSize:10,color:"#6a9bb8",marginTop:2}}>{label}</div>
    </div>
  );
}

function RateCard({label,num,den}){
  const pct=den>0?Math.round((num/den)*100):null;
  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,color:"#d0e8f5",fontWeight:600}}>{label}</span>
        <span style={{fontSize:16,fontWeight:700,color:"#f5a623"}}>{pct!=null?`${pct}%`:"—"}</span>
      </div>
      <Bar value={num} max={den||1} color="#f5a623"/>
      <div style={{marginTop:4}}><RateBadge num={num} den={den}/></div>
    </div>
  );
}

function SectionTitle({title}){
  return <div style={{fontSize:13,fontWeight:700,color:"#fff",margin:"16px 0 8px"}}>{title}</div>;
}
function EmptyNote({text}){
  return <div style={{fontSize:12,color:"#6a9bb8",marginBottom:16,lineHeight:1.7}}>{text}</div>;
}

function BasicDashboard({stats}){
  const hours=stats.totalDurationMin>0?(stats.totalDurationMin/60).toFixed(1):null;
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        <StatCard label="総釣行回数" value={`${stats.total}回`}/>
        <StatCard label="総釣行時間" value={hours?`${hours}h`:"未記録"}/>
        <StatCard label="釣果あり" value={`${stats.withCatch}回`}/>
        <StatCard label="ボウズ" value={`${stats.bouzu}回`}/>
        <StatCard label="アタリあり" value={`${stats.withBite}回`}/>
        <StatCard label="総釣果数" value={`${stats.totalCatch}匹`}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <RateCard label="釣果発生率" num={stats.withCatch} den={stats.total}/>
        <RateCard label="アタリ発生率" num={stats.withBite} den={stats.total}/>
        <div style={{fontSize:12,color:"#d0e8f5",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px"}}>
          1時間あたり釣果数：{stats.catchPerHour!=null?`${stats.catchPerHour.toFixed(2)}匹/時`:"時間未記録のため算出不可"}
        </div>
      </div>
    </div>
  );
}

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {fishStats.map(f=>(
        <div key={f.fishName} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px"}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:14,fontWeight:700,color:f.fishName===UNKNOWN_FISH?"#e84c3d":"#fff"}}>
              {f.fishName===UNKNOWN_FISH?"❓ ":"🐟 "}{f.fishName}
            </span>
            <span style={{fontSize:13,color:"#f5a623",fontWeight:700}}>{f.totalCount}匹</span>
          </div>
          <div style={{fontSize:11,color:"#6a9bb8",marginTop:4}}>
            釣れた釣行 {f.tripCount}回・初回 {fmt(f.firstAt)}・最近 {fmt(f.lastAt)}

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {spotStats.map(s=>(

function TimeStatsSection({timeStats}){

function AnalyticsView({trips,catches}){
  const [period,setPeriod]=useState(()=>loadStore(ANALYTICS_KEY,{schemaVersion:1,period:"all"}).period);
  useEffect(()=>{ saveStore(ANALYTICS_KEY,{schemaVersion:1,period}); },[period]);

  if(trips.length===0){
    return (
      <div style={{padding:"48px 20px",textAlign:"center",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
        <div style={{fontSize:38,marginBottom:10}}>📊</div>
        まだ統計を表示できる釣行記録がありません。<br/>
        実際の釣行を記録すると、ここに傾向が表示されます。
      </div>
    );
  }

  const filteredTrips=filterTripsByPeriod(trips,period);
  const filteredTripIds=new Set(filteredTrips.map(t=>t.id));
  const filteredCatches=catches.filter(c=>filteredTripIds.has(c.tripId));
  const periodChips=[["all","全期間"],["30d","直近30日"],["year","今年"]];

  return (
    <div style={{padding:"12px 14px",paddingBottom:80}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:10}}>📊 分析</div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {periodChips.map(([k,l])=>(
          <button key={k} onClick={()=>setPeriod(k)}
            style={{background:period===k?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${period===k?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:period===k?"#f5a623":"#6a9bb8",fontWeight:period===k?700:400,
              borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>
            {l}
          </button>
        ))}
      </div>

      {filteredTrips.length===0?(
        <div style={{textAlign:"center",padding:"32px 16px",color:"#6a9bb8",fontSize:13,lineHeight:1.8}}>
          この期間の釣行記録がありません。
        </div>
      ):(
        <>
          <BasicDashboard stats={getTripStats(filteredTrips)}/>
          <SectionTitle title="🐟 魚種別"/>
          <FishStatsSection fishStats={getFishStats(filteredCatches)}/>
          <SectionTitle title="📍 ポイント別"/>
          <SpotStatsSection spotStats={getSpotStats(filteredTrips)}/>
          <SectionTitle title="🕐 時間帯別"/>
          <TimeStatsSection timeStats={getTimeStats(filteredTrips)}/>
          <SectionTitle title="📅 月別"/>
          <MonthlyStatsSection monthlyStats={getMonthlyStats(filteredTrips,filteredCatches)}/>
          <SectionTitle title="🎯 条件別"/>
          <ConditionStatsSection conditionStats={getConditionStats(filteredTrips)}/>
        </>
      )}
    </div>
  );
}

          style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",borderRadius:10,padding:"12px 16px",fontSize:14,cursor:"pointer"}}>

        </button>

          style={{flex:1,background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>
          💾 保存する
        </button>
      </div>

  );
}

const HANDLING_STATUS_LABEL = {
  pending:"現地処理待ち", released:"リリース済み", onsite_done:"現地処理済み",
  home_processed:"下処理済み", cooked:"調理済み",
};

function CatchEditModal({show,onClose,onSave,initial}){
  const [form,setForm]=useState(EMPTY_CATCH);
  useEffect(()=>{ if(show) setForm(initial||EMPTY_CATCH); },[show,initial]);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const handleSave=()=>{
    if(!form.fishName.trim()){ alert("魚種を入力してください"); return; }
    onSave(form);
  };
  return (
    <Modal show={show} onClose={onClose}>
      <h2 style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>✏️ 釣果を編集</h2>
      <Field label="魚種"><Input value={form.fishName} onChange={e=>set("fishName",e.target.value)}/></Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="数"><Input type="number" min="1" value={form.count} onChange={e=>set("count",parseInt(e.target.value,10)||1)}/></Field>
        <Field label="サイズ（cm・任意）"><Input type="number" step="any" value={form.sizeCm} onChange={e=>set("sizeCm",e.target.value)}/></Field>
      </div>
      <Field label="持ち帰り or リリース">
        <Sel value={form.kept?"kept":"released"} onChange={e=>set("kept",e.target.value==="kept")}>
          <option value="kept">🧊 持ち帰る</option>
          <option value="released">🌊 リリース</option>
        </Sel>
      </Field>
      <Field label="メモ"><Textarea value={form.note} onChange={e=>set("note",e.target.value)}/></Field>
      <div style={{display:"flex",gap:8,marginTop:18}}>
        <button onClick={onClose}
          style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",borderRadius:10,padding:"12px 16px",fontSize:14,cursor:"pointer"}}>
          キャンセル
        </button>
        <button onClick={handleSave}
          style={{flex:1,background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>
          💾 保存する
        </button>
      </div>
    </Modal>
  );
}

  const [editCatchTarget,setEditCatchTarget]=useState(null);
  const [showAddCatch,setShowAddCatch]=useState(false);
  const keptCount=catches.filter(c=>c.kept).length;
  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",
      borderLeft:`3px solid ${trip.isBouzu?"#e84c3d":"#2ecc87"}`,borderRadius:12,padding:"13px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff",flex:1}}>{trip.spotName||"（スポット不明）"}</div>
        <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,whiteSpace:"nowrap",
          background:trip.isBouzu?"rgba(232,76,61,0.15)":"rgba(46,204,135,0.15)",
          color:trip.isBouzu?"#e84c3d":"#2ecc87"}}>
          {trip.isBouzu?"🐟 ボウズ":`🐟 釣果 ${trip.catchCount}`}
        </span>
      </div>
      <div style={{fontSize:11,color:"#6a9bb8",marginTop:6}}>

      </div>
      {trip.targetFish&&<div style={{fontSize:12,color:"#d0e8f5",marginTop:6}}>狙い魚：{trip.targetFish}</div>}
      <div style={{fontSize:11,color:"#6a9bb8",marginTop:4}}>👆 アタリ {trip.biteCount||0}</div>
      {trip.memo&&<div style={{fontSize:12,color:"#6a9bb8",marginTop:7,lineHeight:1.6}}>{trip.memo}</div>}

      {catches.length>0&&(
        <div style={{marginTop:9,display:"flex",flexDirection:"column",gap:5}}>
          {catches.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,
              background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"6px 9px"}}>
              <span style={{fontSize:11,color:"#d0e8f5"}}>
                {c.fishName===UNKNOWN_FISH?"❓ ":"🐟 "}{c.fishName} × {c.count}
                {c.sizeCm?`（${c.sizeCm}cm）`:""} ・ {c.kept?HANDLING_STATUS_LABEL[c.handlingStatus]||"持ち帰り":"リリース"}
              </span>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>setEditCatchTarget(c)}

                <button onClick={()=>onDeleteCatch(c.id)}
                  style={{fontSize:10,padding:"3px 7px",borderRadius:6,border:"1px solid rgba(232,76,61,0.4)",background:"transparent",color:"rgba(232,76,61,0.8)",cursor:"pointer"}}>🗑</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{display:"flex",gap:6,marginTop:9,flexWrap:"wrap"}}>
        <button onClick={()=>onEdit(trip)}

          ✏️ 編集
        </button>
        <button onClick={()=>setShowAddCatch(true)}
          style={{fontSize:11,padding:"5px 10px",borderRadius:6,
            border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>

            🏠 帰宅後
          </button>
        )}
        <button onClick={()=>onDelete(trip.id)}
          style={{fontSize:11,padding:"5px 10px",borderRadius:6,
            border:"1px solid rgba(232,76,61,0.4)",background:"transparent",color:"rgba(232,76,61,0.8)",cursor:"pointer"}}>
          🗑 削除
        </button>
      </div>

      <CatchEditModal show={!!editCatchTarget} onClose={()=>setEditCatchTarget(null)} initial={editCatchTarget}
        onSave={form=>{onEditCatch(editCatchTarget.id,form);setEditCatchTarget(null);}}/>
      <CatchEditModal show={showAddCatch} onClose={()=>setShowAddCatch(false)}
        initial={{...EMPTY_CATCH,tripId:trip.id,caughtAt:Date.now()}}

function RigGuideView({guide}){
  const [step,setStep]=useState(0);
  if(!guide) return null;
  const s=guide.steps[step];
  return (
    <div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}}>
        {guide.chain.map((c,i)=>(
          <span key={i} style={{fontSize:11,background:"rgba(255,255,255,0.08)",borderRadius:4,padding:"3px 8px",color:"#6a9bb8"}}>
            {c}{i<guide.chain.length-1?" →":""}
          </span>
        ))}
      </div>
      <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:16,minHeight:120}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff",marginBottom:8}}>{s.title}</div>
        <div style={{fontSize:13,color:"#6a9bb8",lineHeight:1.7}}>{s.detail}</div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center",justifyContent:"space-between"}}>
        <button disabled={step===0} onClick={()=>setStep(s=>s-1)}
          style={{padding:"9px 16px",borderRadius:9,fontSize:13,cursor:step===0?"default":"pointer",
            background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:step===0?"rgba(106,155,184,0.4)":"#6a9bb8"}}>
          ← 前へ
        </button>
        <span style={{fontSize:12,color:"#6a9bb8"}}>{step+1} / {guide.steps.length}</span>
        <button disabled={step===guide.steps.length-1} onClick={()=>setStep(s=>s+1)}
          style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:step===guide.steps.length-1?"default":"pointer",
            background:step===guide.steps.length-1?"transparent":"#f5a623",
            border:step===guide.steps.length-1?"1px solid rgba(255,255,255,0.15)":"none",
            color:step===guide.steps.length-1?"rgba(106,155,184,0.4)":"#1a0a00"}}>
          次へ →
        </button>
      </div>
    </div>
  );
}

function GearTab({gearTemplates,setGearTemplates,rigGuides}){
  const [sub,setSub]=useState("gear");
  const template=gearTemplates[0]||null;
  const guide=rigGuides[0]||null;

  const updateTemplate=updater=>{
    setGearTemplates(prev=>prev.map((t,i)=>i===0?updater(t):t));
  };
  const onToggleItem=(id,checked)=>updateTemplate(t=>({...t,items:t.items.map(it=>it.id===id?{...it,checked}:it),updatedAt:Date.now()}));
  const onAddItem=label=>updateTemplate(t=>({...t,items:[...t.items,{id:uid(),label,checked:false}],updatedAt:Date.now()}));
  const onRemoveItem=id=>updateTemplate(t=>({...t,items:t.items.filter(it=>it.id!==id),updatedAt:Date.now()}));
  const onResetAll=()=>{ if(confirm("チェックを全部リセットしますか？")) updateTemplate(t=>({...t,items:t.items.map(it=>({...it,checked:false})),updatedAt:Date.now()})); };

  return (
    <div style={{padding:"12px 14px"}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:10}}>🎒 {template?template.name:"持ち物"}</div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["gear","✅ チェックリスト"],["guide","🪝 仕掛けガイド"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSub(k)}
            style={{background:sub===k?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${sub===k?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:sub===k?"#f5a623":"#6a9bb8",fontWeight:sub===k?700:400,
              borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>
            {l}
          </button>
        ))}
      </div>
      {sub==="gear"
        ?<GearChecklistView template={template} onToggleItem={onToggleItem} onAddItem={onAddItem} onRemoveItem={onRemoveItem} onResetAll={onResetAll}/>
        :<RigGuideView guide={guide}/>}
    </div>
  );
}

const HOME_STEP_TITLES = {
  1:"持ち帰った魚の確認", 2:"魚種確認", 3:"下処理", 4:"保存方法", 5:"おすすめ料理", 6:"調理済み", 7:"食後評価",
};

function HomeStepHeader({step,onClose}){

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <div>

        <div style={{fontSize:12,color:"#6a9bb8",marginTop:2}}>{HOME_STEP_TITLES[step]}</div>
      </div>
      <button onClick={onClose}
        style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",
          borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer"}}>
        ✕ 閉じる
      </button>
    </div>
  );
}

function HomeStepNav({step,onBack,onNext,nextLabel}){
  return (
    <div style={{display:"flex",gap:8,marginTop:18}}>
      {step>1&&<button onClick={onBack}
        style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",
          borderRadius:10,padding:"12px 16px",fontSize:14,cursor:"pointer"}}>
