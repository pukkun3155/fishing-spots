function sizeCategory(sizeCm){
  const n=parseFloat(sizeCm);
  if(!n) return null;
  if(n<13) return "small";
  if(n<18) return "medium";
  return "large";
}
const SIZE_RECIPE_PRIORITY = {
  small:["r-shirogisu-karaage","r-shirogisu-tenpura","r-shirogisu-furai","r-shirogisu-shioyaki"],
  medium:["r-shirogisu-tenpura","r-shirogisu-furai","r-shirogisu-shioyaki","r-shirogisu-karaage"],
  large:["r-shirogisu-shioyaki","r-shirogisu-furai","r-shirogisu-tenpura","r-shirogisu-karaage"],
};
function recommendRecipes(recipes,fishName,sizeCm){
  const matched=recipes.filter(r=>r.fish===fishName);
  const cat=sizeCategory(sizeCm);
  const order=cat&&SIZE_RECIPE_PRIORITY[cat];
  if(!order) return matched;
  return [...matched].sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
}

// ── Phase 3: 分析集計関数（UIから分離。Phase4で再利用する前提） ──

function filterTripsByPeriod(trips,period){
  if(period==="all") return trips;
  const now=Date.now();
  let from;
  if(period==="30d") from=now-30*24*60*60*1000;
  else if(period==="year"){ const d=new Date(); d.setMonth(0,1); d.setHours(0,0,0,0); from=d.getTime(); }
  else return trips;
  return trips.filter(t=>{
    const ts=t.startAt||(t.date?new Date(t.date+"T00:00:00").getTime():null);
    return ts==null?true:ts>=from;
  });
}

function sampleLabel(n){
  if(!n||n<=0) return null;
  if(n<=2) return "かなり少ない";
  if(n<=4) return "まだ参考程度";
  return null;
}

function getTripStats(trips){
  const total=trips.length;
  const withCatch=trips.filter(t=>(t.catchCount||0)>0).length;
  const bouzu=trips.filter(t=>(t.catchCount||0)===0).length;
  const withBite=trips.filter(t=>(t.biteCount||0)>0).length;
  const totalCatch=trips.reduce((s,t)=>s+(t.catchCount||0),0);
  const totalDurationMin=trips.reduce((s,t)=>s+(t.durationMin||0),0);
  const catchPerHour=totalDurationMin>0?totalCatch/(totalDurationMin/60):null;
  return { total, withCatch, bouzu, withBite, totalCatch, totalDurationMin, catchPerHour };
}

function getSpotStats(trips){
  const map=new Map();
  trips.forEach(t=>{
    const key=t.spotId||("name:"+(t.spotName||"不明"));
    if(!map.has(key)) map.set(key,{key,label:t.spotName||"（スポット不明）",trips:[]});
    map.get(key).trips.push(t);
  });
  return [...map.values()]
    .map(({key,label,trips})=>({key,label,...getTripStats(trips)}))
    .sort((a,b)=>b.total-a.total);
}

function getFishStats(catches){
  const map=new Map();
  catches.forEach(c=>{
    const key=c.fishName||UNKNOWN_FISH;
    if(!map.has(key)) map.set(key,{fishName:key,totalCount:0,tripIds:new Set(),firstAt:null,lastAt:null});
    const e=map.get(key);
    e.totalCount+=c.count||0;
    e.tripIds.add(c.tripId);
    const t=c.caughtAt||0;
    if(!e.firstAt||t<e.firstAt) e.firstAt=t;
    if(!e.lastAt||t>e.lastAt) e.lastAt=t;
  });
  return [...map.values()]
    .map(e=>({fishName:e.fishName,totalCount:e.totalCount,tripCount:e.tripIds.size,firstAt:e.firstAt,lastAt:e.lastAt}))
    .sort((a,b)=>b.totalCount-a.totalCount);
}

const TIME_BUCKETS=[["early",4,7],["morning",7,10],["midday",10,15],["evening",15,18],["night",18,28]];
const TIME_BUCKET_LABELS={early:"早朝（4-7時）",morning:"朝（7-10時）",midday:"昼（10-15時）",evening:"夕方（15-18時）",night:"夜（18-4時）"};
function timeBucketOf(hour){
  const h=hour<4?hour+24:hour;
  for(const [key,start,end] of TIME_BUCKETS){ if(h>=start&&h<end) return key; }
  return "night";
}
function getTimeStats(trips){
  const buckets={early:[],morning:[],midday:[],evening:[],night:[]};
  trips.forEach(t=>{
    if(!t.startAt) return;
    buckets[timeBucketOf(new Date(t.startAt).getHours())].push(t);
  });
  return Object.entries(buckets).map(([key,list])=>({key,label:TIME_BUCKET_LABELS[key],...getTripStats(list)}));
}

function getMonthlyStats(trips,catches){
  const map=new Map();
  trips.forEach(t=>{
    const ym=(t.date||(t.startAt?new Date(t.startAt).toISOString().slice(0,10):"")).slice(0,7);
    if(!ym) return;
    if(!map.has(ym)) map.set(ym,[]);
    map.get(ym).push(t);
  });
  return [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,list])=>{
    const tripIds=new Set(list.map(t=>t.id));
    const monthCatches=catches.filter(c=>tripIds.has(c.tripId));
    const fishCount=new Map();
    monthCatches.forEach(c=>fishCount.set(c.fishName,(fishCount.get(c.fishName)||0)+(c.count||0)));
    const topFish=[...fishCount.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n])=>n);
    return {ym,...getTripStats(list),topFish};
  });
}

const CONDITION_FIELDS=[["weather","天気"],["tide","潮回り"],["rig","仕掛け"],["bait","エサ"],["targetFish","対象魚"]];
function getConditionStats(trips){
  return CONDITION_FIELDS.map(([field,label])=>{
    const groups=new Map();
    trips.forEach(t=>{
      const v=(t[field]||"").trim();
      if(!v) return;
      if(!groups.has(v)) groups.set(v,[]);
      groups.get(v).push(t);
    });
    if(groups.size===0) return null;
    const values=[...groups.entries()]
      .map(([value,list])=>({value,...getTripStats(list)}))
      .sort((a,b)=>b.total-a.total);
    return {field,label,values};
  }).filter(Boolean);
}

// ── Phase 4: 最新周辺釣果 × 自分の実績 の「今おすすめの狙い」 ──

function daysAgo(dateStr,now){
  if(!dateStr) return null;
  const t=new Date(dateStr+(dateStr.length<=10?"T00:00:00":"")).getTime();
  if(isNaN(t)) return null;
  return Math.floor((now-t)/(24*60*60*1000));
}

function sanitizeReportsPayload(raw){
  if(!raw||typeof raw!=="object"||!Array.isArray(raw.reports)) return null;
  const REQUIRED=["id","reportedAt","fishName","area","fishingType","sourceName","sourceUrl"];
  const clean=raw.reports.filter(r=>r&&typeof r==="object"&&REQUIRED.every(k=>typeof r[k]==="string"&&r[k]));
  return {
    updatedAt: typeof raw.updatedAt==="string"?raw.updatedAt:null,
    reports: clean,
    malformedCount: raw.reports.length-clean.length,
  };
}

function formatUpdatedAt(iso){
  const d=new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function reportsUpdateStatus(updatedAt,now){
  if(!updatedAt) return null;
  const d=daysAgo(updatedAt,now);
  if(d==null) return null;
  const when=formatUpdatedAt(updatedAt);
  if(d<=7) return {level:"ok",text:`釣果情報 最終更新：${when}`};
  if(d<=14) return {level:"warn",text:`釣果情報 最終更新：${when}（情報更新から${d}日経過）`};
  return {level:"alert",text:`⚠️ 最近の釣果情報が古くなっています（最終更新：${when}、${d}日経過）`};
}

function freshnessLabel(days){
  if(days==null) return null;
  if(days<=7) return "新しい情報";
  if(days<=14) return "やや新しい";
  if(days<=30) return "参考情報";
  return "古い情報";
}

function gearFits(methodWeightG,gearProfile){
  if(methodWeightG==null||methodWeightG<=0) return true;
  return (gearProfile.rods||[]).some(r=>methodWeightG>=r.lureWeightMinG&&methodWeightG<=r.lureWeightMaxG);
}

function windSpeedLabel(ms){
  const n=parseFloat(ms);
  if(isNaN(n)) return null;
  if(n<3) return "弱い";
  if(n<5) return "やや風あり";
  if(n<7) return "風が強め";
  return "岸釣りでは注意";
}

function getTodaySafetyNotices(todayConditions){
  if(!todayConditions) return [];
  const notices=[];
  const windLabel=windSpeedLabel(todayConditions.windSpeedMs);
  if(windLabel==="風が強め"||windLabel==="岸釣りでは注意"){

  }

    notices.push("波が高めです。サーフ・磯・テトラ等、足場の悪い場所では十分注意してください。");
  }
  return notices;
}

function conditionMatchForFish({trips,catches,fishName,field,value,excludeFromScoring}){
  if(!value||value==="不明") return null;
  const triedTripIds=new Set(trips.filter(t=>t.targetFish===fishName).map(t=>t.id));
  catches.filter(c=>c.fishName===fishName).forEach(c=>triedTripIds.add(c.tripId));
  const relevant=trips.filter(t=>triedTripIds.has(t.id));
  const matched=relevant.filter(t=>(t[field]||"").includes(value));
  if(matched.length===0) return null;
  const caughtTripIds=new Set(catches.filter(c=>c.fishName===fishName).map(c=>c.tripId));
  const matchedWithCatch=matched.filter(t=>caughtTripIds.has(t.id));
  const rate=matchedWithCatch.length/matched.length;
  const bonus=!excludeFromScoring&&matched.length>=3&&rate>=0.5;
  return {count:matched.length,withCatch:matchedWithCatch.length,bonus};
}

function timeBucketMatchForFish({trips,catches,fishName,bucket}){
  const triedTripIds=new Set(trips.filter(t=>t.targetFish===fishName).map(t=>t.id));
  catches.filter(c=>c.fishName===fishName).forEach(c=>triedTripIds.add(c.tripId));
  const relevant=trips.filter(t=>triedTripIds.has(t.id)&&t.startAt);
  const matched=relevant.filter(t=>timeBucketOf(new Date(t.startAt).getHours())===bucket);
  if(matched.length===0) return null;
  const caughtTripIds=new Set(catches.filter(c=>c.fishName===fishName).map(c=>c.tripId));
  const matchedWithCatch=matched.filter(t=>caughtTripIds.has(t.id));
  return {count:matched.length,withCatch:matchedWithCatch.length};
}

function bestSpotForFish({fishName,trips,catches,spots}){
  const caughtTripIds=catches.filter(c=>c.fishName===fishName).map(c=>c.tripId);
  const spotCount=new Map();
  caughtTripIds.forEach(tid=>{
    const trip=trips.find(t=>t.id===tid);
    if(trip&&trip.spotId) spotCount.set(trip.spotId,(spotCount.get(trip.spotId)||0)+1);
  });
  if(spotCount.size>0){
    const bestId=[...spotCount.entries()].sort((a,b)=>b[1]-a[1])[0][0];
    const spot=(spots||[]).find(s=>s.id===bestId);
    if(spot) return spot;
  }
  const tagged=(spots||[]).find(s=>(s.fish||"").split(/[,、，]/).map(x=>x.trim()).includes(fishName));
  return tagged||null;
}

function getTargetRecommendations({trips,catches,reports,targetProfiles,gearProfile,spots,todayConditions,now,includeIneligible}){
  now=now||Date.now();
  const shoreReports=reports.filter(r=>r.fishingType==="shore");
  const boatReports=reports.filter(r=>r.fishingType==="boat");
  const nowMonth=new Date(now).getMonth();
  let nowBucket=timeBucketOf(new Date(now).getHours());
  if(todayConditions&&todayConditions.plannedStartTime){
    const hh=parseInt(todayConditions.plannedStartTime.split(":")[0],10);
    if(!isNaN(hh)) nowBucket=timeBucketOf(hh);
  }

  const scored=targetProfiles.map(profile=>{
    const fishName=profile.fishName;
    const fishShore=shoreReports.filter(r=>r.fishName===fishName).sort((a,b)=>new Date(b.reportedAt)-new Date(a.reportedAt));
    const fishBoat=boatReports.filter(r=>r.fishName===fishName).sort((a,b)=>new Date(b.reportedAt)-new Date(a.reportedAt));
    const latestShore=fishShore[0]||null;
    const latestBoat=fishBoat[0]||null;
    const shoreDays=latestShore?daysAgo(latestShore.reportedAt,now):null;

    const personalCatches=catches.filter(c=>c.fishName===fishName);
    const personalTripIds=new Set(personalCatches.map(c=>c.tripId));
    const personalTrips=trips.filter(t=>personalTripIds.has(t.id));
    const personalCount=personalCatches.reduce((s,c)=>s+(c.count||0),0);
    const personalTripCount=personalTripIds.size;

    const monthMatch=personalTrips.some(t=>{
      const d=t.date?new Date(t.date+"T00:00:00"):(t.startAt?new Date(t.startAt):null);
      return d&&d.getMonth()===nowMonth;
    });
    const timeMatch=timeBucketMatchForFish({trips,catches,fishName,bucket:nowBucket});

    const methods=profile.recommendedMethods||[];
    const fitMethod=methods.find(m=>gearFits(m.typicalWeightG,gearProfile))||null;

    let score=0; const reasons=[]; const cautions=[];
    if(shoreDays!=null){
      if(shoreDays<=7){score+=3;reasons.push(`直近${shoreDays===0?"当日":shoreDays+"日前"}の岸釣りで釣果情報あり（${latestShore.sourceName}）`);}
      else if(shoreDays<=14){score+=2;reasons.push(`${shoreDays}日前の岸釣り釣果情報あり（${latestShore.sourceName}）`);}
      else if(shoreDays<=30){score+=1;reasons.push(`${shoreDays}日前の岸釣り釣果情報あり（参考情報・${latestShore.sourceName}）`);}
      else{cautions.push(`岸釣り情報はありますが${shoreDays}日前とやや古めです（${latestShore.sourceName}）`);}
    }else if(latestBoat){
      score-=2;
      cautions.push("最近の情報は船釣りのみで、岸からの実績情報は見つかっていません");
    }
    if(personalTripCount>0){
      score+=2;
      reasons.push(`自分の実績あり（釣行${personalTripCount}回・${personalCount}匹）`);
    }
    if(monthMatch){score+=1;reasons.push("今の時期（月）に自分で釣った実績あり");}
    if(timeMatch){
      score+=1;
      reasons.push(`予定時間帯の実績：${timeMatch.count}回中${timeMatch.withCatch}回釣果あり`);
    }
    if(profile.beginnerFriendly){score+=1;reasons.push("初心者向け");}
    if(profile.shoreTargetable){score+=1;reasons.push("岸から狙える");}
    if(methods.length>0){
      if(fitMethod){score+=2;reasons.push(`手持ちタックルで対応可（${fitMethod.name}）`);}
      else cautions.push("推奨される仕掛けが手持ちタックルの適合範囲外です");
    }

    if(todayConditions){
      const specs=[
        ["weather","天気",todayConditions.weather,false],
        ["tide","潮",todayConditions.tideType,false],
        ["tideDirection","潮の動き",todayConditions.tideDirection,false],
        ["wind","風向",todayConditions.windDirection,false],
        ["waves","波",todayConditions.wave,todayConditions.wave==="高め"],
        ["turbidity","濁り",todayConditions.turbidity,false],
      ];
      specs.forEach(([field,label,value,exclude])=>{
        const m=conditionMatchForFish({trips,catches,fishName,field,value,excludeFromScoring:exclude});
        if(!m) return;
        if(m.bonus){
          score+=1;
          reasons.push(`${label}${value}：過去${m.count}回中${m.withCatch}回釣果あり`);
        }else if(exclude){
          reasons.push(`${label}${value}：過去${m.count}回中${m.withCatch}回釣果あり（安全のためおすすめ度には反映していません）`);
        }else{
          const label2=sampleLabel(m.count);
          reasons.push(`${label}${value}：過去${m.count}回中${m.withCatch}回釣果あり${label2?`（${label2}）`:""}`);
        }
      });
    }

    if(latestShore==null&&latestBoat==null&&personalTripCount===0){
      cautions.push("外部情報・自分の実績のどちらもまだありません");
    }else if(latestShore==null&&latestBoat==null&&personalTripCount>0){
      reasons.push("外部の最新情報はまだ無く、自分の実績のみに基づく表示です");
    }else if(personalTripCount===0&&(latestShore||latestBoat)){
      reasons.push("自分の実績はまだ無く、周辺の外部情報のみに基づく表示です");
    }

    const stars=score<=1?1:score<=3?2:score<=5?3:score<=7?4:5;
    const eligible=shoreDays!=null||!!latestBoat||personalTripCount>0;
    const matchedSpot=bestSpotForFish({fishName,trips,catches,spots});

    return { fishName, score, stars, reasons, cautions, eligible, matchedSpot, bestMethod:fitMethod,
      latestShore, latestBoat, shoreDays, shoreFreshness:freshnessLabel(shoreDays),
      personalTripCount, personalCount, gearFit:!fitMethod&&methods.length>0?false:true };
  });

  const sorted=scored.sort((a,b)=>b.score-a.score);
  return includeIneligible?sorted:sorted.filter(s=>s.eligible);
}

const SKIP_LOGS_KEY = "fishing_skip_logs_v1";

function computePlannedEndTime(startTime,durationMin){
  if(!startTime||!durationMin) return null;
  const [h,m]=startTime.split(":").map(Number);
  const dur=parseInt(durationMin,10);
  if(isNaN(h)||isNaN(m)||isNaN(dur)) return null;
  const totalMin=h*60+m+dur;
  const crossesDay=totalMin>=24*60;
  const norm=((totalMin%(24*60))+24*60)%(24*60);
  const endH=Math.floor(norm/60), endM=norm%60;
  return { text:`${String(endH).padStart(2,"0")}:${String(endM).padStart(2,"0")}${crossesDay?"（翌日）":""}`, crossesDay };
}

function getBriefingReportStats(reports,fishName,now){
  const fishReports=reports.filter(r=>r.fishName===fishName);
  const within7=fishReports.filter(r=>(daysAgo(r.reportedAt,now)||999)<=7).length;
  const within30=fishReports.filter(r=>(daysAgo(r.reportedAt,now)||999)<=30).length;
  const shoreCount=fishReports.filter(r=>r.fishingType==="shore").length;
  const boatCount=fishReports.filter(r=>r.fishingType==="boat").length;
  const sorted=[...fishReports].sort((a,b)=>new Date(b.reportedAt)-new Date(a.reportedAt));
  const latest=sorted[0]||null;
  const lastDays=latest?daysAgo(latest.reportedAt,now):null;
  return { total:fishReports.length, within7, within30, shoreCount, boatCount, lastDays };
}

function getBriefingPersonalStats({trips,catches,fishName,matchedSpot,todayConditions,now}){
  const triedTripIds=new Set(trips.filter(t=>t.targetFish===fishName).map(t=>t.id));
  catches.filter(c=>c.fishName===fishName).forEach(c=>triedTripIds.add(c.tripId));
  const relevant=trips.filter(t=>triedTripIds.has(t.id));
  const overall=getTripStats(relevant);

  let bucket=timeBucketOf(new Date(now).getHours());
  if(todayConditions&&todayConditions.plannedStartTime){
    const hh=parseInt(todayConditions.plannedStartTime.split(":")[0],10);
    if(!isNaN(hh)) bucket=timeBucketOf(hh);
  }
  const timeStat=timeBucketMatchForFish({trips,catches,fishName,bucket});

  let spotStat=null;
  if(matchedSpot){
    const spotTrips=relevant.filter(t=>t.spotId===matchedSpot.id);
    if(spotTrips.length>0) spotStat=getTripStats(spotTrips);
  }

  return { overall, bucket, timeStat, spotStat, tripCount:relevant.length };
}

function getOverallVerdict({recommendations,safetyNotices}){
  if(safetyNotices&&safetyNotices.length>0){
    return { level:"D", label:"⚠ 条件に注意", summary:"風または波の条件に注意が必要です。安全を優先して判断してください。" };
  }
  if(!recommendations||recommendations.length===0){
    return { level:"E", label:"？ 判断材料不足", summary:"判断材料が不足しています。今日の条件や釣行記録を追加すると、より具体的なブリーフィングができます。" };
  }
  const top=recommendations[0];
  const hasRealEvidence=top.personalTripCount>=3||(top.shoreDays!=null&&top.shoreDays<=30);
  if(top.stars>=4&&hasRealEvidence){
    return { level:"A", label:"◎ 有力候補あり",
      summary:`${top.fishName}が有力候補です。${top.matchedSpot?top.matchedSpot.name+"での":""}短時間の岸釣りに向いています。` };
  }
  if(top.stars>=3){
    return { level:"B", label:"○ 候補あり", summary:`${top.fishName}が候補に挙がっています。` };
  }
  if(top.personalTripCount===0&&top.shoreDays==null){
    return { level:"C", label:"△ 参考程度", summary:"最新の周辺情報・自分の実績とも少なめのため、参考程度の候補です。" };
  }
  return { level:"C", label:"△ 参考程度", summary:"データが少なめのため参考程度の候補です。" };
}

// ── Phase 8: 天気・風・波の自動取得（Open-Meteo、APIキー不要） ──

const CONDITIONS_CACHE_KEY = "fishing_conditions_cache_v1";
const WEATHER_API_BASE = "https://api.open-meteo.com/v1/forecast";
const MARINE_API_BASE = "https://marine-api.open-meteo.com/v1/marine";
const CACHE_FRESH_MIN = 30;
// Open-Meteo公式仕様：Weather forecast_daysは0-16（既定7）、Marine forecast_daysは0-8（既定5）。
// 両方を組み合わせて使うため、実質の予報対象期間は短い方（Marine）の上限に合わせる。
const WEATHER_MARINE_MAX_FORECAST_DAYS = 8;
const AUTO_FIELD_LABELS = { weather:"天気", temperatureC:"気温", windDirection:"風向", windSpeedMs:"風速", wave:"波" };

function degToCompass8(deg){
  if(deg==null||isNaN(deg)) return null;
  const dirs=["北","北東","東","南東","南","南西","西","北西"];
  const idx=Math.round((((deg%360)+360)%360)/45)%8;
  return dirs[idx];
}

const WEATHER_CODE_LABEL_MAP={0:"晴れ",1:"晴れ",2:"曇り",3:"曇り",45:"曇り",48:"曇り",
  51:"雨",53:"雨",55:"雨",56:"雨",57:"雨",61:"雨",63:"雨",65:"雨",66:"雨",67:"雨",
  71:"雨",73:"雨",75:"雨",77:"雨",80:"雨",81:"雨",82:"雨",85:"雨",86:"雨",95:"雨",96:"雨",99:"雨"};
function weatherCodeToLabel(code){ return code==null?null:(WEATHER_CODE_LABEL_MAP[code]||"不明"); }
function weatherCodeHazard(code){
  if(code==null) return null;
  if([95,96,99].includes(code)) return "thunderstorm";
  if([71,73,75,77,85,86].includes(code)) return "snow";
  if([45,48].includes(code)) return "fog";
  return null;
}

function waveHeightToLabel(m){
  const n=parseFloat(m);
  if(isNaN(n)) return null;
  if(n<0.5) return "穏やか";
  if(n<1.0) return "やや波あり";
  return "高め";
}

function findClosestHourIndex(times,targetMs){
  if(!Array.isArray(times)||times.length===0) return -1;
  let bestIdx=-1,bestDiff=Infinity;
  times.forEach((t,i)=>{
    const tm=new Date(t).getTime();
    if(isNaN(tm)) return;
    const diff=Math.abs(tm-targetMs);
    if(diff<bestDiff){ bestDiff=diff; bestIdx=i; }
  });
  return bestIdx;
}

function computeForecastForMs(dateStr,timeStr){
  const time=timeStr||"06:00";
  const t=new Date(`${dateStr}T${time}:00+09:00`).getTime();
  return isNaN(t)?Date.now():t;
}

function daysBetweenDateStr(fromDateStr,toDateStr){
  const a=new Date(fromDateStr+"T00:00:00+09:00").getTime();
  const b=new Date(toDateStr+"T00:00:00+09:00").getTime();
  return Math.round((b-a)/86400000);
}

function isWithinForecastHorizon(dateStr,todayStr){
  if(!dateStr) return false;
  const diff=daysBetweenDateStr(todayStr,dateStr);
  return diff>=0&&diff<WEATHER_MARINE_MAX_FORECAST_DAYS;
}

async function fetchAutoConditions({lat,lng,forecastForMs}){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  const weatherUrl=`${WEATHER_API_BASE}?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=${WEATHER_MARINE_MAX_FORECAST_DAYS}`;
  const marineUrl=`${MARINE_API_BASE}?latitude=${lat}&longitude=${lng}&hourly=wave_height,wave_direction,wave_period&timezone=Asia%2FTokyo&forecast_days=${WEATHER_MARINE_MAX_FORECAST_DAYS}`;

  let weatherResult,marineResult;
  try{
    [weatherResult,marineResult]=await Promise.allSettled([
      fetch(weatherUrl,{signal:controller.signal}).then(r=>{ if(!r.ok) throw new Error("weather http "+r.status); return r.json(); }),
      fetch(marineUrl,{signal:controller.signal}).then(r=>{ if(!r.ok) throw new Error("marine http "+r.status); return r.json(); }),
    ]);
  }finally{
    clearTimeout(timeout);
  }

  let weather=null,weatherError=null;
  if(weatherResult.status==="fulfilled"){
    const d=weatherResult.value;
    const times=d&&d.hourly&&d.hourly.time;
    const idx=findClosestHourIndex(times,forecastForMs);
    if(idx>=0){
      weather={
        forecastTime:times[idx],
        temperatureC:(d.hourly.temperature_2m||[])[idx]??null,
        precipitationMm:(d.hourly.precipitation||[])[idx]??null,
        weatherCode:(d.hourly.weather_code||[])[idx]??null,
        windDirectionDeg:(d.hourly.wind_direction_10m||[])[idx]??null,
        windSpeedMs:(d.hourly.wind_speed_10m||[])[idx]??null,
        windGustMs:(d.hourly.wind_gusts_10m||[])[idx]??null,
      };
    }else weatherError="該当時刻の予報データがありません";
  }else weatherError=String((weatherResult&&weatherResult.reason)||"取得失敗");

  let marine=null,marineError=null;
  if(marineResult.status==="fulfilled"){
    const d=marineResult.value;
    const times=d&&d.hourly&&d.hourly.time;
    const idx=findClosestHourIndex(times,forecastForMs);
    if(idx>=0){
      marine={
        forecastTime:times[idx],
        waveHeightM:(d.hourly.wave_height||[])[idx]??null,
        waveDirectionDeg:(d.hourly.wave_direction||[])[idx]??null,
        wavePeriodSec:(d.hourly.wave_period||[])[idx]??null,
      };
    }else marineError="該当時刻の予報データがありません";
  }else marineError=String((marineResult&&marineResult.reason)||"取得失敗");

  return { weather, marine, weatherError, marineError };
}

function buildAutoFieldValues(weather,marine){
  const vals={};
  if(weather){
    if(weather.temperatureC!=null) vals.temperatureC=String(Math.round(weather.temperatureC*10)/10);
    const dir=degToCompass8(weather.windDirectionDeg);
    if(dir) vals.windDirection=dir;
    if(weather.windSpeedMs!=null) vals.windSpeedMs=String(Math.round(weather.windSpeedMs*10)/10);
    const wLabel=weatherCodeToLabel(weather.weatherCode);
    if(wLabel) vals.weather=wLabel;
  }
  if(marine&&marine.waveHeightM!=null){
    const wv=waveHeightToLabel(marine.waveHeightM);
    if(wv) vals.wave=wv;
  }
  return vals;
}

function mergeConditionsWithAuto(current,autoVals,opts){
  const overwrite=!!(opts&&opts.overwrite);
  const next={...current};
  const filledFromAuto=[];
  Object.entries(autoVals).forEach(([k,v])=>{
    if(v==null) return;
    const isEmpty=!current[k];
    if(isEmpty||overwrite){
      next[k]=v;
      filledFromAuto.push(k);
    }
  });
  return { next, filledFromAuto };
}

function getExtraSafetyNotices(cache){
  const notices=[];
  if(!cache) return notices;
  if(cache.weather&&cache.weather.windGustMs!=null&&cache.weather.windGustMs>=10){
    notices.push(`突風${Math.round(cache.weather.windGustMs*10)/10}m/s：突風に注意してください。`);
  }
  const hazard=cache.weather?weatherCodeHazard(cache.weather.weatherCode):null;
  if(hazard==="thunderstorm"){
    notices.push("雷の可能性があります。屋外・海辺では特に注意してください。");
  }
  return notices;
}

function formatCacheAgeMinutes(fetchedAt,now){
  if(!fetchedAt) return null;
  return Math.max(0,Math.floor((now-fetchedAt)/60000));
}

// ── Phase 9: 潮汐（気象庁 潮位表 テキストデータ版・公共データ利用規約1.0） ──
const TIDE_CACHE_KEY = "fishing_tide_cache_v1";
const TIDE_FRESH_HOURS = 24;
const TIDE_SOURCE_PAGE_URL = "https://www.data.jma.go.jp/kaiyou/db/tide/suisan/index.php";
// 静岡県東部・駿河湾〜伊豆周辺の気象庁公式観測地点候補（GPSからの自動推定はしない）
const TIDE_STATION_CANDIDATES = [

  {id:"Z5", name:"焼津"},
  {id:"OM", name:"御前崎"},

  {id:"G9", name:"石廊崎"},

  {id:"QK", name:"南伊豆"},
];

function tideTableUrl(stationId,year){
  return `https://www.data.jma.go.jp/kaiyou/data/db/tide/suisan/txt/${year}/${stationId}.txt`;
}

// 気象庁公式フォーマット（readme.html）：1行136カラム固定長。
// 1-72:毎時潮位(3桁×24) 73-78:年月日(2桁×3) 79-80:地点記号 81-108:満潮(時刻4桁+潮位3桁)×4 109-136:干潮×4
function parseTideTxtLine(line){
  if(!line||line.length<136) return null;
  const dateStr=line.slice(72,78);
  const highStr=line.slice(80,108);
  const lowStr=line.slice(108,136);
  const yy=parseInt(dateStr.slice(0,2),10);
  const mm=parseInt(dateStr.slice(2,4),10);
  const dd=parseInt(dateStr.slice(4,6),10);
  if(isNaN(yy)||isNaN(mm)||isNaN(dd)) return null;
  function parseEvents(s){
    const out=[];
    for(let i=0;i<4;i++){
      const chunk=s.slice(i*7,i*7+7);
      const t=chunk.slice(0,4), h=chunk.slice(4,7);
      if(t.trim()===""||t==="9999") continue;
      const th=parseInt(t.slice(0,2),10), tm=parseInt(t.slice(2,4),10);
      const heightCm=parseInt(h,10);
      if(isNaN(th)||isNaN(tm)||isNaN(heightCm)) continue;
      out.push({time:`${String(th).padStart(2,"0")}:${String(tm).padStart(2,"0")}`, heightCm});
    }
    return out;
  }
  const dateOut=`${2000+yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  return { dateStr:dateOut, highs:parseEvents(highStr), lows:parseEvents(lowStr) };
}

function findTideDayLine(text,dateStr){
  const lines=text.split("\n");
  for(const line of lines){
    if(line.length<136) continue;
    const parsed=parseTideTxtLine(line);
    if(parsed&&parsed.dateStr===dateStr) return parsed;
  }
  return null;
}

async function fetchOfficialTide({stationId,dateStr}){
  const year=parseInt(dateStr.slice(0,4),10);
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  try{
    const res=await fetch(tideTableUrl(stationId,year),{signal:controller.signal});
    if(!res.ok) throw new Error("tide http "+res.status);
    const text=await res.text();
    const day=findTideDayLine(text,dateStr);
    if(!day) throw new Error("該当日の潮汐データが見つかりません");
    return { highs:day.highs, lows:day.lows };
  } finally {
    clearTimeout(timeout);
  }
}

function minutesFromTimeStr(t){
  if(!t) return null;
  const parts=t.split(":");
  if(parts.length!==2) return null;
  const h=parseInt(parts[0],10), m=parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}

function formatDurationMin(totalMin){
  if(totalMin==null||isNaN(totalMin)||totalMin<0) return null;
  const h=Math.floor(totalMin/60), m=totalMin%60;
  if(h===0) return `${m}分`;
  if(m===0) return `約${h}時間`;
  return `約${h}時間${m}分`;
}

// 満潮・干潮の公式時刻のみから、予定時刻が上げ/下げどちらの区間にあるかを機械的に判定する。
// 断定はせず「天文潮位上は」と併記して表示すること（実際の潮流・海況とは異なる場合がある）。
function computeTideRelation(planTimeStr,highs,lows){
  const planMin=minutesFromTimeStr(planTimeStr);
  if(planMin==null) return null;
  const events=[
    ...(highs||[]).map(e=>({...e,kind:"high",min:minutesFromTimeStr(e.time)})),
    ...(lows||[]).map(e=>({...e,kind:"low",min:minutesFromTimeStr(e.time)})),
  ].filter(e=>e.min!=null).sort((a,b)=>a.min-b.min);
  if(events.length===0) return null;

  let prev=null, next=null;
  events.forEach(e=>{
    if(e.min<=planMin&&(!prev||e.min>prev.min)) prev=e;
    if(e.min>=planMin&&(!next||e.min<next.min)) next=e;
  });

  let direction=null;
  if(prev&&next&&prev.min!==next.min){
    if(prev.kind==="low"&&next.kind==="high") direction="上げ";
    else if(prev.kind==="high"&&next.kind==="low") direction="下げ";
  }

  const nextHigh=events.find(e=>e.kind==="high"&&e.min>=planMin)||null;
  const nextLow=events.find(e=>e.kind==="low"&&e.min>=planMin)||null;

  return { direction, nextHigh, nextLow, planMin };
}

// 表示専用の参考区分。過去の釣行実績との自動集計はまだ行わない（Phase9は表示・集計の入口まで）。
function classifyTideBucket(planMin,highs,lows){
  if(planMin==null) return null;
  const withMin=(list,kind)=>(list||[]).map(e=>({kind,min:minutesFromTimeStr(e.time)})).filter(e=>e.min!=null);
  const allHigh=withMin(highs,"high");
  const allLow=withMin(lows,"low");
  for(const h of allHigh){ if(Math.abs(planMin-h.min)<=60) return "満潮前後1時間以内"; }
  for(const h of allHigh){
    if(planMin<h.min&&h.min-planMin<=120) return "満潮前2時間以内";
    if(planMin>h.min&&planMin-h.min<=120) return "満潮後2時間以内";
  }
  for(const l of allLow){ if(Math.abs(planMin-l.min)<=60) return "干潮前後1時間以内"; }
  for(const l of allLow){
    if(planMin<l.min&&l.min-planMin<=120) return "干潮前2時間以内";
    if(planMin>l.min&&planMin-l.min<=120) return "干潮後2時間以内";
  }
  return null;
}

// ── Phase 10: 候補日時比較（釣行しやすさの比較。釣果予測ではない） ──

const PLAN_CANDIDATES_KEY = "fishing_plan_candidates_v1";
const PLAN_FORECAST_CACHE_KEY = "fishing_plan_forecast_cache_v1";
const MAX_PLAN_CANDIDATES = 3;
const EMPTY_PLAN_CANDIDATE = { date:"", startTime:"06:00", durationMin:"90", spotId:"", targetFish:"" };

function planForecastCacheKey(spotId,forecastForMs){ return `${spotId}|${forecastForMs}`; }

function isPastPlanDate(dateStr,todayStr){ return !!(dateStr&&dateStr<todayStr); }

function isPlanStartTimePassed(dateStr,startTime,todayStr,now){
  if(dateStr!==todayStr) return false;
  const startMin=minutesFromTimeStr(startTime);
  if(startMin==null) return false;
  const n=new Date(now);
  const nowMin=n.getHours()*60+n.getMinutes();
  return nowMin-startMin>30; // 30分以上過ぎていれば「開始予定時刻を過ぎています」
}

// 安全ブロッカー：これがある候補は他条件に関わらず「⚠ 条件注意」に固定し、第1候補にしない。
function getPlanSafetyBlockers(weather,marine){
  const blockers=[];
  if(weather&&weather.windSpeedMs!=null&&weather.windSpeedMs>=7) blockers.push(`風速${weather.windSpeedMs}m/s`);
  if(marine&&marine.waveHeightM!=null&&marine.waveHeightM>=1.0) blockers.push(`波高${marine.waveHeightM}m`);
  if(weather&&weather.windGustMs!=null&&weather.windGustMs>=10) blockers.push(`突風${weather.windGustMs}m/s`);
  if(weather&&weatherCodeHazard(weather.weatherCode)==="thunderstorm") blockers.push("雷の可能性");
  return blockers;
}

// 「強い降水」の目安として時間雨量5mm以上を採用（気象庁の「やや強い雨」10mm/hの下限より低いが、
// 短時間の岸釣りでは雨具準備の要否に関わるため独自にやや厳しめの目安とした）。安全ブロッカーではなく注意表示のみ。
function getPlanRainCaution(weather){
  if(weather&&weather.precipitationMm!=null&&weather.precipitationMm>=5){
    return `降水${weather.precipitationMm}mm：雨具の準備を。`;
  }
  return null;
}

// 岸釣り情報のみを対象に鮮度集計（船情報は別枠。岸釣り実績として加点しない）。
function getPlanReportStats(reports,fishName,now){
  const shoreReports=(reports||[]).filter(r=>r.fishName===fishName&&r.fishingType==="shore");
  const boatReports=(reports||[]).filter(r=>r.fishName===fishName&&r.fishingType==="boat");
  const shoreWithin7=shoreReports.filter(r=>(daysAgo(r.reportedAt,now)||999)<=7).length;
  const shoreWithin30=shoreReports.filter(r=>(daysAgo(r.reportedAt,now)||999)<=30).length;
  const sortedShore=[...shoreReports].sort((a,b)=>new Date(b.reportedAt)-new Date(a.reportedAt));
  const latestShore=sortedShore[0]||null;
  const shoreLastDays=latestShore?daysAgo(latestShore.reportedAt,now):null;
  return { shoreCount:shoreReports.length, boatCount:boatReports.length, shoreWithin7, shoreWithin30, shoreLastDays };
}

// 候補1件分の評価（純粋関数）。数値スコアは内部比較専用で、画面には「釣れる確率」等として出さない。
function evaluatePlanCandidate({candidate,spot,forecastEntry,tideEntry,reports,trips,catches,targetProfiles,gearProfile,now,todayStr}){
  const fishName=candidate.targetFish||"";
  const weather=forecastEntry?forecastEntry.weather:null;
  const marine=forecastEntry?forecastEntry.marine:null;
  const weatherError=forecastEntry?forecastEntry.weatherError:null;
  const marineError=forecastEntry?forecastEntry.marineError:null;
  const outOfHorizon=!isWithinForecastHorizon(candidate.date,todayStr);
  const isPast=isPastPlanDate(candidate.date,todayStr);

  const safetyBlockers=outOfHorizon?[]:getPlanSafetyBlockers(weather,marine);
  const rainCaution=outOfHorizon?null:getPlanRainCaution(weather);

  const profile=fishName?targetProfiles.find(p=>p.fishName===fishName)||null:null;
  const methods=profile?.recommendedMethods||[];
  const fitMethod=methods.find(m=>gearFits(m.typicalWeightG,gearProfile))||null;
  const gearOk=methods.length===0?true:!!fitMethod;

  const reportStats=fishName?getPlanReportStats(reports,fishName,now):null;
  const personalStats=fishName?getBriefingPersonalStats({trips,catches,fishName,matchedSpot:spot,
    todayConditions:{plannedStartTime:candidate.startTime},now}):null;

  const tideRelation=tideEntry?computeTideRelation(candidate.startTime,tideEntry.highs,tideEntry.lows):null;
  const tideBucket=tideEntry?classifyTideBucket(minutesFromTimeStr(candidate.startTime),tideEntry.highs,tideEntry.lows):null;

  const reasons=[]; const cautions=[];
  let evaluatedCount=0; const totalCount=7;
  // 1) 予報（天気・風）
  if(weather){ evaluatedCount++; }
  // 2) 予報（波）
  if(marine){ evaluatedCount++; }
  // 3) 潮汐
  if(tideEntry){ evaluatedCount++; }
  // 4) 最新の周辺釣果
  if(reportStats&&(reportStats.shoreCount>0||reportStats.boatCount>0)){ evaluatedCount++; }
  // 5) 本人実績
  if(personalStats&&personalStats.tripCount>0){ evaluatedCount++; }
  // 6) タックル適合（対象魚が決まっていれば常に判定可能）
  if(fishName){ evaluatedCount++; }
  // 7) 魚種プロフィール（初心者向け等）
  if(profile){ evaluatedCount++; }

  let score=0;
  if(!outOfHorizon){
    if(weather&&weather.windSpeedMs!=null){
      if(weather.windSpeedMs<3) score+=2;
      else if(weather.windSpeedMs<5) score+=1;
    }
    if(marine&&marine.waveHeightM!=null){
      if(marine.waveHeightM<0.5) score+=2;
      else if(marine.waveHeightM<1.0) score+=1;
    }
    if(rainCaution) cautions.push(rainCaution);
    else if(weather&&weather.precipitationMm!=null&&weather.precipitationMm===0) score+=0.5;
  }

  if(reportStats){
    if(reportStats.shoreWithin7>0){ score+=3; reasons.push(`直近7日以内の岸釣り情報あり（${reportStats.shoreCount}件）`); }
    else if(reportStats.shoreWithin30>0){ score+=2; reasons.push("30日以内の岸釣り情報あり"); }
    else if(reportStats.boatCount>0){ cautions.push("最近の情報は船釣りのみです"); }
  }

  if(personalStats&&personalStats.tripCount>0){
    const n=personalStats.overall.total, m=personalStats.overall.withCatch;
    if(n>=5){ score+=3; reasons.push(`本人実績 ${n}回中${m}回`); }
    else if(n>=3){ score+=1.5; reasons.push(`本人実績 ${n}回中${m}回（まだ参考程度）`); }
    else{ reasons.push(`本人実績 ${n}回中${m}回（かなり少ない・参考程度）`); }
    if(personalStats.timeStat&&personalStats.timeStat.count>0){
      reasons.push(`時間帯実績 ${personalStats.timeStat.count}回中${personalStats.timeStat.withCatch}回`);
      if(personalStats.timeStat.count>=3) score+=1;
    }
  }

  if(fishName){
    if(!gearOk) cautions.push("現在のタックル適合範囲外");
    else if(fitMethod){ score+=1; reasons.push(`タックル適合（${fitMethod.name}）`); }
  }

  if(profile&&profile.beginnerFriendly) reasons.push("初心者向け");

  safetyBlockers.forEach(b=>cautions.push(`⚠ ${b}`));

  const hasSafetyBlocker=safetyBlockers.length>0;
  let category;
  if(!fishName){
    category="insufficient";
  }else if(hasSafetyBlocker){
    category="caution";
  }else if(evaluatedCount<3){
    category="insufficient";
  }else if(score>=6&&gearOk){
    category="top";
  }else if(score>=3){
    category="good";
  }else{
    category="reference";
  }

  return { candidate, spot, fishName, weather, marine, weatherError, marineError, outOfHorizon, isPast,
    tideRelation, tideBucket, tideEntry, reportStats, personalStats, gearOk, fitMethod, profile,
    safetyBlockers, hasSafetyBlocker, score, reasons, cautions, category, evaluatedCount, totalCount };
}

const PLAN_CATEGORY_RANK={ top:4, good:3, reference:2, caution:1, insufficient:0 };
const PLAN_CATEGORY_LABEL={ top:"◎ 第1候補", good:"○ 候補", reference:"△ 参考", caution:"⚠ 条件注意", insufficient:"？ 判断材料不足" };

// ランキングは純粋関数：過去日の候補は比較対象から外すが、削除はしない（呼び出し側で表示は継続）。
function rankPlanEvaluations(evaluations){
  const rankable=evaluations.filter(e=>!e.isPast&&e.fishName);
  const sorted=[...rankable].sort((a,b)=>(PLAN_CATEGORY_RANK[b.category]-PLAN_CATEGORY_RANK[a.category])||(b.score-a.score));
  let nearTie=false;
  if(sorted.length>=2&&sorted[0].category===sorted[1].category&&Math.abs(sorted[0].score-sorted[1].score)<=1){
    nearTie=true;
  }
  return { sorted, nearTie };
}

// 「◯候補中 風が最も弱い」等の比較ラベル。「最も釣れる」という表現は使わない。
function getPlanComparativeLabels(evaluations){
  const labels={};
  evaluations.forEach(e=>{ labels[e.candidate.id]=[]; });
  const n=evaluations.length;
  if(n<2) return labels;
  const withWind=evaluations.filter(e=>e.weather&&e.weather.windSpeedMs!=null);
  if(withWind.length>=2){
    const min=withWind.reduce((a,b)=>a.weather.windSpeedMs<=b.weather.windSpeedMs?a:b);
    labels[min.candidate.id].push(`${n}候補中 風が最も弱い`);
  }
  const withWave=evaluations.filter(e=>e.marine&&e.marine.waveHeightM!=null);
  if(withWave.length>=2){
    const min=withWave.reduce((a,b)=>a.marine.waveHeightM<=b.marine.waveHeightM?a:b);
    labels[min.candidate.id].push(`${n}候補中 波が最も低い`);
  }
  const withRain=evaluations.filter(e=>e.weather&&e.weather.precipitationMm!=null);
  if(withRain.length>=2){
    const min=withRain.reduce((a,b)=>a.weather.precipitationMm<=b.weather.precipitationMm?a:b);
    if(min.weather.precipitationMm===0) labels[min.candidate.id].push(`${n}候補中 降水が最も少ない`);
  }
  return labels;
}

// ── Phase 11: 朝チェック（採用済みプランの出発直前再確認） ──

const MORNING_CHECK_KEY = "fishing_morning_check_v1";
// 過敏に警告しないための変化しきい値。これ未満は「ほぼ同じ」とみなす。
const MORNING_DIFF_THRESHOLD = { wind:0.5, wave:0.1, rain:0.5 };

function computePlanKey(spotId,date,startTime,targetFish){
  return `${spotId||""}|${date||""}|${startTime||""}|${targetFish||""}`;
}

// Phase8のweatherCodeToLabel/degToCompass8を使い、生値とラベルの両方を保持したスナップショットを作る。
function buildMorningSnapshot(weather,marine){
  return {
    weather: weather?weatherCodeToLabel(weather.weatherCode):null,
    temperatureC: weather&&weather.temperatureC!=null?weather.temperatureC:null,
    precipitationMm: weather&&weather.precipitationMm!=null?weather.precipitationMm:null,
    windDirection: weather?degToCompass8(weather.windDirectionDeg):null,
    windSpeedMs: weather&&weather.windSpeedMs!=null?weather.windSpeedMs:null,
    windGustMs: weather&&weather.windGustMs!=null?weather.windGustMs:null,
    waveHeightM: marine&&marine.waveHeightM!=null?marine.waveHeightM:null,
    waveDirection: marine?degToCompass8(marine.waveDirectionDeg):null,
    wavePeriodSec: marine&&marine.wavePeriodSec!=null?marine.wavePeriodSec:null,
    weatherCode: weather&&weather.weatherCode!=null?weather.weatherCode:null,
  };
}

function morningDiffOne(previous,latest,threshold){
  if(previous==null||latest==null) return {previous:previous??null,latest:latest??null,delta:null,status:null};
  const delta=Math.round((latest-previous)*100)/100;
  const status=Math.abs(delta)<threshold?"same":(delta>0?"worse":"better");
  return {previous,latest,delta,status};
}

// 純粋関数：前回と最新の差分を項目ごとに算出する。風向・気温は「変化のみ」で良否判定しない。
function getMorningCheckDiff(previous,latest){
  const p=previous||{}, l=latest||{};
  return {
    wind: morningDiffOne(p.windSpeedMs,l.windSpeedMs,MORNING_DIFF_THRESHOLD.wind),
    gust: morningDiffOne(p.windGustMs,l.windGustMs,MORNING_DIFF_THRESHOLD.wind),
    wave: morningDiffOne(p.waveHeightM,l.waveHeightM,MORNING_DIFF_THRESHOLD.wave),
    rain: morningDiffOne(p.precipitationMm,l.precipitationMm,MORNING_DIFF_THRESHOLD.rain),
    temp: { previous:p.temperatureC??null, latest:l.temperatureC??null,
      delta:(p.temperatureC!=null&&l.temperatureC!=null)?Math.round((l.temperatureC-p.temperatureC)*10)/10:null, status:null },
    windDirection: { previous:p.windDirection??null, latest:l.windDirection??null },
    thunderAppeared: weatherCodeHazard(p.weatherCode)!=="thunderstorm"&&weatherCodeHazard(l.weatherCode)==="thunderstorm",
  };
}

// 純粋関数：総合判定。安全→予報の変化→タックル適合の優先順位で決める（Phase10の安全ブロッカーをそのまま再利用）。
function getMorningCheckVerdict({weather,marine,weatherError,marineError,gearOk,diff}){
  const blockers=getPlanSafetyBlockers(weather,marine);
  if(blockers.length>0) return { level:"caution", label:"⚠ 条件注意", blockers };
  if(!weather&&!marine&&(weatherError||marineError)) return { level:"insufficient", label:"？ 情報不足" };
  const statuses=diff?Object.values(diff).map(d=>d&&d.status).filter(Boolean):[];
  const anyWorse=statuses.includes("worse");
  const anyChanged=statuses.some(s=>s!=="same");
  if(gearOk===false) return { level:"attention", label:"△ 条件変化あり" };
  if(anyWorse) return { level:"attention", label:"△ 条件変化あり" };
  if(anyChanged) return { level:"good", label:"○ 概ね予定通り" };
  return { level:"top", label:"◎ 予定通り候補" };
}

// 純粋関数：開始予定時刻までのカウントダウン文言（当日のみ）。日付跨ぎはcomputePlannedEndTime同様、時刻のみで比較。
function formatPlanCountdown(dateStr,startTime,todayStr,now){
  if(dateStr!==todayStr) return null;
  const startMin=minutesFromTimeStr(startTime);
  if(startMin==null) return null;
  const n=new Date(now);
  const nowMin=n.getHours()*60+n.getMinutes();
  const diff=startMin-nowMin;
  if(diff>=0) return { text:`開始まであと${formatDurationMin(diff)}`, overdue:false, minutes:diff, veryEarly:diff>=720 };
  return { text:`開始予定時刻を${formatDurationMin(-diff)}過ぎています`, overdue:true, minutes:-diff, veryEarly:false };
}

function IOModal({show,onClose,spots,onImport,onClear}){
  const fileRef=useRef();

  const handleExport=()=>{
    if(!spots.length){alert("登録されているポイントがありません");return;}
    const json=JSON.stringify({version:2,exportedAt:new Date().toISOString(),spots},null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="fishing_spots.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const handleImport=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const inc=data.spots||(Array.isArray(data)?data:[]);
        if(!inc.length){alert("データが見つかりませんでした");return;}
        onImport(inc);
      }catch{alert("読み込みに失敗しました");}
      e.target.value="";
    };
    reader.readAsText(file);
  };

  const handleClear=()=>{
    if(!confirm("⚠️ 全データを削除します。バックアップはとりましたか？"))return;
    onClear(); onClose();
  };

  const ioBtn=(emoji,title,sub,onClick,col)=>(
    <button onClick={onClick} style={{width:"100%",padding:13,borderRadius:10,fontSize:14,fontWeight:600,
      cursor:"pointer",marginBottom:8,display:"flex",alignItems:"center",gap:10,
      background:`rgba(${col},0.1)`,border:`1px solid rgba(${col},0.3)`,color:`rgb(${col})`}}>
      <span style={{fontSize:20}}>{emoji}</span>
      <div style={{textAlign:"left"}}>
        <div style={{fontWeight:700}}>{title}</div>
        <div style={{fontSize:11,opacity:0.8,marginTop:1}}>{sub}</div>
      </div>
    </button>
  );

  return (
    <Modal show={show} onClose={onClose}>
      <h2 style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>📂 データの保存・読み込み</h2>
      <div style={{fontSize:11,color:"#f5a623",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>💾 バックアップ</div>
      {ioBtn("📤","JSONファイルに書き出す","fishing_spots.json としてダウンロード",handleExport,"46,204,135")}
      <div style={{fontSize:11,color:"#6a9bb8",lineHeight:1.7,padding:"8px 10px",
        background:"rgba(255,255,255,0.04)",borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",marginBottom:16}}>
        <strong style={{color:"#d0e8f5"}}>データの持ち運び方：</strong><br/>
        ① 書き出しボタンで fishing_spots.json をダウンロード<br/>
        ② iCloud Driveの釣りフォルダに保存<br/>
        ③ 次回アプリを開いたら「読み込み」で復元
      </div>
      <div style={{fontSize:11,color:"#f5a623",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>📥 復元</div>
      {ioBtn("📂","JSONファイルを読み込む","保存済みの fishing_spots.json を選択",()=>fileRef.current.click(),"245,166,35")}
      <input ref={fileRef} type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
      <div style={{fontSize:11,color:"#6a9bb8",lineHeight:1.7,padding:"8px 10px",
        background:"rgba(255,255,255,0.04)",borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",marginBottom:16}}>
        現在のデータに<strong style={{color:"#d0e8f5"}}>追記</strong>されます（重複は自動スキップ）。
      </div>
      <div style={{fontSize:11,color:"#f5a623",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🗑 リセット</div>
      {ioBtn("⚠️","全データを削除する","削除前に必ずバックアップを取ってください",handleClear,"232,76,61")}
      <button onClick={onClose}
        style={{width:"100%",padding:12,borderRadius:10,fontSize:14,cursor:"pointer",
          background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",marginTop:4}}>
        閉じる
      </button>
    </Modal>
  );
}

function SpotCard({spot,onEdit,onDelete,onStartFishing}){
  const tags=[];
  if(spot.area) tags.push(AREA_LABEL[spot.area]||spot.area);
  if(spot.type) tags.push(TYPE_LABEL[spot.type]||spot.type);
  if(spot.parking) tags.push("🅿");
  if(spot.toilet)  tags.push("🚻");
  if(spot.paid)    tags.push("💰有料");
  if(spot.night)   tags.push("🌙夜OK");
  if(spot.beginner)tags.push("🐟初心者向け");
  if(spot.crowded) tags.push("👥混雑注意");
  if(spot.tideStationId) tags.push("🌊"+(spot.tideStationName||spot.tideStationId));
  if(spot.fish) spot.fish.split(/[,、，]/).map(f=>f.trim()).filter(Boolean).forEach(f=>tags.push("🐠"+f));

  const aUrl=appleUrl(spot);
  const gUrl=googleUrl(spot);
  const coordStr=spot.lat&&spot.lng?`${parseFloat(spot.lat).toFixed(4)}, ${parseFloat(spot.lng).toFixed(4)}`:"";

        <Stat label="✅ 釣り可" val={spots.filter(s=>s.status==="ok").length} color="#2ecc87"/>
        <Stat label="❌ NG" val={spots.filter(s=>s.status==="ng").length} color="#e84c3d"/>
        <Stat label="🔍 要確認" val={spots.filter(s=>s.status==="tbc").length} color="#f5a623"/>
        <div style={{flex:1,textAlign:"center",padding:"9px 4px"}}>
          <div style={{fontSize:19,fontWeight:700,color:"#f5c842"}}>{spots.filter(s=>s.star>=4).length}</div>
          <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>⭐ お気に入り</div>
        </div>
      </div>

      {/* Search */}
      <div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,0.1)",background:"#0a2a4a"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="🔍 ポイント名・魚種・メモで検索…"
          style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",
            borderRadius:8,padding:"8px 12px",color:"#d0e8f5",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
      </div>

      {/* Filter */}
      <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",
        borderBottom:"1px solid rgba(255,255,255,0.1)",background:"#0a2a4a"}}>
        {chips.map(([f,label])=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{background:filter===f?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${filter===f?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:filter===f?"#f5a623":"#6a9bb8",fontWeight:filter===f?700:400,
              borderRadius:20,padding:"4px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>
            {label}
          </button>
        ))}
      </div>

      {/* List */}
      <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:"48px 20px",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
            <div style={{fontSize:38,marginBottom:10}}>{spots.length?"🔍":"🎣"}</div>
            {spots.length?"絞り込み結果がありません":
              <span>「＋ 追加」ボタンで最初の釣り場を記録しましょう！<br/>
              データは「📂 保存/読込」でJSONに書き出し、<br/>次回読み込むと復元できます。</span>}
          </div>
        ):filtered.map(s=>(
          <SpotCard key={s.id} spot={s} onEdit={openEdit} onDelete={handleDelete} onStartFishing={onStartFishing}/>
        ))}
      </div>

      <EditModal show={showEdit} onClose={()=>setShowEdit(false)} onSave={handleSave} initial={editTarget}/>
      <IOModal show={showIO} onClose={()=>setShowIO(false)} spots={spots} onImport={handleImport} onClear={()=>setSpots([])}/>
    </div>
  );
}

    </Modal>
  );

function TodayConditionsCard({conditions,onSave,onReset,expanded,onToggleExpanded}){
  const today=new Date().toISOString().slice(0,10);
  const isPast=!!(conditions.date&&conditions.date<today);
  const current=isPast?EMPTY_TODAY_CONDITIONS:conditions;

  const set=(k,v)=>{
    onSave({...current,[k]:v,date:current.date||today,source:"manual",updatedAt:Date.now()});
  };

  const windLabel=windSpeedLabel(current.windSpeedMs);
  const hasAny=!isPast&&(current.weather||current.tideType||current.windSpeedMs||current.plannedStartTime||current.wave||current.turbidity);
  const isTomorrowPlan=current.date&&current.date>today;

  const summaryParts=[];
  if(current.date) summaryParts.push(current.date===today?"今日":current.date);
  if(current.plannedStartTime) summaryParts.push(`開始${current.plannedStartTime}`);
  if(current.weather) summaryParts.push(current.weather);
  if(current.tideType) summaryParts.push(current.tideType);
  if(current.windSpeedMs) summaryParts.push(`風${current.windSpeedMs}m/s${windLabel?`(${windLabel})`:""}`);
  if(current.wave) summaryParts.push(`波${current.wave}`);

  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:14,fontWeight:700,color:"#fff"}}>☀️ {isTomorrowPlan?"釣行予定日の条件":"今日の条件"}</span>
        <button onClick={onToggleExpanded}
          style={{fontSize:11,padding:"4px 10px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>
          {expanded?"閉じる":hasAny?"編集":"入力する"}
        </button>
      </div>
      {isPast&&(
        <div style={{fontSize:11,color:"#f5a623",marginTop:6}}>
          前回入力（{conditions.date}）の条件が残っています。今日の分を入力してください。
        </div>
      )}
      {!expanded&&hasAny&&<div style={{fontSize:12,color:"#d0e8f5",marginTop:6}}>{summaryParts.join("・")}</div>}
      {!expanded&&!hasAny&&<div style={{fontSize:11,color:"#6a9bb8",marginTop:6}}>未入力（未入力でも「今おすすめの狙い」は表示されます）</div>}
      {expanded&&(
        <div style={{marginTop:10}}>
          <Field label="釣行予定日">
            <Input type="date" min={today} value={current.date||today}
              onChange={e=>onSave({...current,date:e.target.value,source:current.source||"manual",updatedAt:Date.now()})}/>
          </Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="釣行予定開始時刻"><Input type="time" value={current.plannedStartTime} onChange={e=>set("plannedStartTime",e.target.value)}/></Field>
            <Field label="釣行予定時間（分）"><Input type="number" value={current.plannedDurationMin} onChange={e=>set("plannedDurationMin",e.target.value)}/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="天気">
              <Sel value={current.weather} onChange={e=>set("weather",e.target.value)}>
                <option value="">選択</option>{WEATHER_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
              </Sel>
            </Field>
            <Field label="気温（℃）"><Input type="number" value={current.temperatureC} onChange={e=>set("temperatureC",e.target.value)}/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="風向">
              <Sel value={current.windDirection} onChange={e=>set("windDirection",e.target.value)}>
                <option value="">選択</option>{WIND_DIR_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
              </Sel>
            </Field>
            <Field label="風速（m/s）"><Input type="number" step="0.1" value={current.windSpeedMs} onChange={e=>set("windSpeedMs",e.target.value)}/></Field>
          </div>
          {windLabel&&<div style={{fontSize:11,color:windLabel==="弱い"?"#6a9bb8":"#f5a623",marginBottom:8,marginTop:-4}}>風の目安：{windLabel}</div>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="潮">
              <Sel value={current.tideType} onChange={e=>set("tideType",e.target.value)}>
                <option value="">選択</option>{TIDE_TYPE_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
              </Sel>
            </Field>
            <Field label="潮の動き">
              <Sel value={current.tideDirection} onChange={e=>set("tideDirection",e.target.value)}>
                <option value="">選択</option>{TIDE_DIRECTION_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
              </Sel>
            </Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="波">
              <Sel value={current.wave} onChange={e=>set("wave",e.target.value)}>
                <option value="">選択</option>{WAVE_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
              </Sel>
            </Field>
            <Field label="濁り">
              <Sel value={current.turbidity} onChange={e=>set("turbidity",e.target.value)}>
                <option value="">選択</option>{TURBIDITY_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
              </Sel>
            </Field>
          </div>
          <button onClick={()=>{ if(confirm("今日の条件をリセットしますか？（過去の釣行記録には影響しません）")) onReset(); }}
            style={{width:"100%",padding:9,borderRadius:9,fontSize:12,cursor:"pointer",marginTop:4,
              background:"transparent",border:"1px solid rgba(232,76,61,0.4)",color:"rgba(232,76,61,0.8)"}}>
            今日の条件をリセット
          </button>
        </div>
      )}
    </div>
  );
}

function SkipLogModal({show,onClose,onSave,snapshot}){
  const [reason,setReason]=useState("");
  const [note,setNote]=useState("");
  useEffect(()=>{ if(show){ setReason(""); setNote(""); } },[show]);
  return (
    <Modal show={show} onClose={onClose}>
      <h2 style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>今日は見送る</h2>
      <div style={{fontSize:12,color:"#6a9bb8",marginBottom:12}}>
        {snapshot.fishName?`予定：${snapshot.fishName}${snapshot.spotName?" × "+snapshot.spotName:""}`:"予定は特に設定されていません"}
      </div>
      <Field label="理由（任意）">
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {SKIP_REASON_OPTIONS.map(r=>(
            <button key={r} onClick={()=>setReason(r===reason?"":r)}
              style={{padding:"7px 12px",borderRadius:20,fontSize:12,cursor:"pointer",
                background:reason===r?"#0d3a5c":"rgba(255,255,255,0.06)",
                border:`1px solid ${reason===r?"#f5a623":"rgba(255,255,255,0.1)"}`,
                color:reason===r?"#f5a623":"#6a9bb8",fontWeight:reason===r?700:400}}>
              {r}
            </button>
          ))}
        </div>
      </Field>
      <Field label="メモ（任意）"><Textarea value={note} onChange={e=>setNote(e.target.value)}/></Field>
      <div style={{display:"flex",gap:8,marginTop:18}}>
        <button onClick={onClose}
          style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",borderRadius:10,padding:"12px 16px",fontSize:14,cursor:"pointer"}}>
          キャンセル
        </button>
        <button onClick={()=>onSave({reason,note})}
          style={{flex:1,background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>
          記録して閉じる
        </button>
      </div>
    </Modal>
  );
}

function BriefingView({recommendations,trips,catches,reports,targetProfiles,gearProfile,spots,gearTemplates,
  todayConditions,reportsUpdatedAt,reportsError,reportsMalformed,onStartFishingAt,onOpenConditions,onSaveSkipLog,
  conditionsCache,autoFetchStatus,onFetchAutoConditions,onApplyAutoField,
  tideCache,autoTideStatus,onFetchTide,adoptedPlan}){
  const [overrideFishName,setOverrideFishName]=useState(null);
  const [overrideSpotId,setOverrideSpotId]=useState(null);
  const [showFishPicker,setShowFishPicker]=useState(false);
  const [showSpotPicker,setShowSpotPicker]=useState(false);
  const [showOthersDetail,setShowOthersDetail]=useState({});
  const [showSkip,setShowSkip]=useState(false);
  const [showAutoDetail,setShowAutoDetail]=useState(false);

  useEffect(()=>{
    if(!adoptedPlan) return;
    if(adoptedPlan.fishName) setOverrideFishName(adoptedPlan.fishName);
    if(adoptedPlan.spotId) setOverrideSpotId(adoptedPlan.spotId);
  },[adoptedPlan&&adoptedPlan.nonce]);

  const now=Date.now();
  const todayStr=new Date().toISOString().slice(0,10);
  const effectiveConditions=isConditionsActive(todayConditions&&todayConditions.date,todayStr)?todayConditions:null;
  const isTomorrowPlan=!!(effectiveConditions&&effectiveConditions.date>todayStr);

  const allCandidates=getTargetRecommendations({trips,catches,reports,targetProfiles,gearProfile,spots,
    todayConditions:effectiveConditions,now,includeIneligible:true});

  const topBase=recommendations[0]||null;
  const effectiveFishName=overrideFishName||(topBase?topBase.fishName:null);
  let effective=effectiveFishName?allCandidates.find(c=>c.fishName===effectiveFishName):null;
  if(effective&&overrideSpotId){
    const overrideSpot=spots.find(s=>s.id===overrideSpotId)||null;
    effective={...effective,matchedSpot:overrideSpot};
  }
  const others=recommendations.filter(r=>r.fishName!==effectiveFishName).slice(0,2);

  const planDateStr=(effectiveConditions&&effectiveConditions.date)||todayStr;
  const planTimeStr=(effectiveConditions&&effectiveConditions.plannedStartTime)||"06:00";
  const forecastForMs=computeForecastForMs(planDateStr,planTimeStr);
  const targetSpotForFetch=effective?effective.matchedSpot:null;
  const canAutoFetch=!!(targetSpotForFetch&&targetSpotForFetch.lat&&targetSpotForFetch.lng);
  const cacheMatchesPlan=!!(conditionsCache&&targetSpotForFetch&&conditionsCache.spotId===targetSpotForFetch.id
    &&conditionsCache.forecastFor===forecastForMs);
  const cacheAgeMin=conditionsCache?formatCacheAgeMinutes(conditionsCache.fetchedAt,now):null;
  const cacheIsFresh=cacheMatchesPlan&&cacheAgeMin!=null&&cacheAgeMin<=CACHE_FRESH_MIN;

  const planStationId=targetSpotForFetch?.tideStationId||null;
  const planStationName=targetSpotForFetch?.tideStationName||null;
  const canFetchTide=!!planStationId;
  const tideCacheMatchesPlan=!!(tideCache&&planStationId&&tideCache.stationId===planStationId&&tideCache.date===planDateStr);
  const tideCacheAgeMin=tideCache?formatCacheAgeMinutes(tideCache.fetchedAt,now):null;
  const tideCacheIsFresh=tideCacheMatchesPlan&&tideCacheAgeMin!=null&&tideCacheAgeMin<=TIDE_FRESH_HOURS*60;
  const tideRelation=tideCacheMatchesPlan?computeTideRelation(planTimeStr,tideCache.highs,tideCache.lows):null;
  const tideBucket=tideCacheMatchesPlan?classifyTideBucket(minutesFromTimeStr(planTimeStr),tideCache.highs,tideCache.lows):null;
  const tideConflict=(tideCacheMatchesPlan&&tideRelation&&tideRelation.direction
    &&effectiveConditions&&effectiveConditions.tideDirection&&effectiveConditions.tideDirection!==tideRelation.direction)
    ?tideRelation.direction:null;

  const extraSafety=cacheMatchesPlan?getExtraSafetyNotices(conditionsCache):[];
  const safetyNotices=[...getTodaySafetyNotices(effectiveConditions),...extraSafety];
  const verdict=getOverallVerdict({recommendations,safetyNotices});

  const reportStats=effective?getBriefingReportStats(reports,effective.fishName,now):null;
  const personalStats=effective?getBriefingPersonalStats({trips,catches,fishName:effective.fishName,matchedSpot:effective.matchedSpot,todayConditions:effectiveConditions,now}):null;
  const plannedEnd=effectiveConditions?computePlannedEndTime(effectiveConditions.plannedStartTime,effectiveConditions.plannedDurationMin):null;
  const updateStatus=reportsUpdateStatus(reportsUpdatedAt,now);

  const gearTemplate=gearTemplates[0]||null;
  const checkedCount=gearTemplate?gearTemplate.items.filter(i=>i.checked).length:0;
  const totalCount=gearTemplate?gearTemplate.items.length:0;
  const uncheckedImportant=gearTemplate?gearTemplate.items.filter(i=>!i.checked&&IMPORTANT_GEAR_LABELS.includes(i.label)).slice(0,5):[];
  const prepReady=uncheckedImportant.length===0;

  const profile=effective?targetProfiles.find(p=>p.fishName===effective.fishName):null;
  const methods=profile?.recommendedMethods||[];
  const shownMethod=effective?(effective.bestMethod||methods[0]||null):null;

  const conditionsSummary=[];
  if(effectiveConditions){
    if(effectiveConditions.weather) conditionsSummary.push(effectiveConditions.weather);
    if(effectiveConditions.temperatureC) conditionsSummary.push(`${effectiveConditions.temperatureC}℃`);
    if(effectiveConditions.windDirection||effectiveConditions.windSpeedMs)
      conditionsSummary.push(`${effectiveConditions.windDirection||""} ${effectiveConditions.windSpeedMs?effectiveConditions.windSpeedMs+"m/s":""}`.trim());
    if(effectiveConditions.tideType||effectiveConditions.tideDirection)
      conditionsSummary.push(`${effectiveConditions.tideType||""}${effectiveConditions.tideDirection?"・"+effectiveConditions.tideDirection:""}`);
    if(effectiveConditions.wave) conditionsSummary.push(`波 ${effectiveConditions.wave}`);
    if(effectiveConditions.turbidity) conditionsSummary.push(effectiveConditions.turbidity);
  }

  const verdictColor={A:"#2ecc87",B:"#7ab3ff",C:"#6a9bb8",D:"#e84c3d",E:"#6a9bb8"}[verdict.level];
  const fishPickerOptions=targetProfiles.map(p=>p.fishName);
  const skipSnapshot={fishName:effective?effective.fishName:"",spotName:effective?.matchedSpot?.name||""};

  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:14,padding:"14px 14px 16px",marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:10}}>
        📋 {isTomorrowPlan?"明日":"今日"}の釣行前ブリーフィング
      </div>

      {/* 1. 総合判断 */}
      <div style={{background:`rgba(255,255,255,0.05)`,border:`1px solid ${verdictColor}55`,borderRadius:10,padding:"10px 12px",marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700,color:verdictColor}}>{verdict.label}</div>
        <div style={{fontSize:12,color:"#d0e8f5",marginTop:4,lineHeight:1.6}}>{verdict.summary}</div>
      </div>

      {effective?(
        <>
          {/* 2. 第1候補 */}
          <div style={{marginBottom:4}}>
            <div style={{fontSize:11,color:"#6a9bb8",marginBottom:4}}>第1候補</div>
            <RecommendationCard rec={effective} onStartFishingAt={null}/>
            <div style={{display:"flex",gap:8,marginTop:-4,marginBottom:12}}>
              <button onClick={()=>setShowFishPicker(v=>!v)}
                style={{fontSize:11,padding:"5px 10px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>
                🐟 狙いを変更
              </button>
              <button onClick={()=>setShowSpotPicker(v=>!v)}
                style={{fontSize:11,padding:"5px 10px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>
                📍 ポイントを変更
              </button>
            </div>
            {showFishPicker&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                {fishPickerOptions.map(f=>(
                  <button key={f} onClick={()=>{setOverrideFishName(f);setOverrideSpotId(null);setShowFishPicker(false);}}
                    style={{fontSize:11,padding:"5px 10px",borderRadius:20,cursor:"pointer",
                      background:f===effectiveFishName?"#0d3a5c":"rgba(255,255,255,0.06)",
                      border:`1px solid ${f===effectiveFishName?"#f5a623":"rgba(255,255,255,0.1)"}`,
                      color:f===effectiveFishName?"#f5a623":"#6a9bb8"}}>
                    {f}
                  </button>
                ))}
              </div>
            )}
            {showSpotPicker&&(
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                {spots.length===0?<div style={{fontSize:11,color:"#6a9bb8"}}>登録済みポイントがありません</div>:
                  spots.map(s=>(
                    <button key={s.id} onClick={()=>{setOverrideSpotId(s.id);setShowSpotPicker(false);}}
                      style={{fontSize:11,padding:"5px 10px",borderRadius:20,cursor:"pointer",
                        background:s.id===overrideSpotId?"#0d3a5c":"rgba(255,255,255,0.06)",
                        border:`1px solid ${s.id===overrideSpotId?"#f5a623":"rgba(255,255,255,0.1)"}`,
                        color:s.id===overrideSpotId?"#f5a623":"#6a9bb8"}}>
                      {s.name}
                    </button>
                  ))}
              </div>
            )}
            {!effective.matchedSpot&&<div style={{fontSize:11,color:"#6a9bb8",marginBottom:12}}>ポイント未指定（登録済みポイントから選べます）</div>}
          </div>

          {/* 3. 第2・第3候補 */}
          {others.length>0&&(
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#6a9bb8",marginBottom:6}}>その他の候補</div>
              {others.map((o,i)=>(
                <div key={o.fishName} style={{background:"rgba(255,255,255,0.05)",borderRadius:10,padding:"9px 12px",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:13,fontWeight:700,color:"#fff"}}>
                      {i+2}位 {o.fishName}{o.matchedSpot?` × ${o.matchedSpot.name}`:""}
                    </span>
                    <span style={{fontSize:12,color:"#f5a623"}}>{"★".repeat(o.stars)}{"☆".repeat(5-o.stars)}</span>
                  </div>
                  <div style={{fontSize:11,color:"#d0e8f5",marginTop:4}}>{(o.reasons.slice(0,2)).join("／")||"—"}</div>
                  {o.cautions&&o.cautions.length>0&&<div style={{fontSize:11,color:"#f0b8b0",marginTop:2}}>注意：{o.cautions[0]}</div>}
                  <button onClick={()=>setShowOthersDetail(v=>({...v,[o.fishName]:!v[o.fishName]}))}
                    style={{fontSize:11,color:"#6a9bb8",background:"none",border:"none",cursor:"pointer",marginTop:6,padding:0}}>
                    {showOthersDetail[o.fishName]?"閉じる":"詳しく見る"}
                  </button>
                  {showOthersDetail[o.fishName]&&<div style={{marginTop:8}}><RecommendationCard rec={o} onStartFishingAt={onStartFishingAt}/></div>}
                </div>
              ))}
            </div>
          )}

          {/* 4. 今日の条件 */}
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <span style={{fontSize:12,color:"#6a9bb8",fontWeight:700}}>☀️ 今日の条件</span>
              <button onClick={onOpenConditions}
                style={{fontSize:11,padding:"4px 10px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>
                変更
              </button>
            </div>
            {conditionsSummary.length>0?(
              <div style={{fontSize:12,color:"#d0e8f5"}}>{conditionsSummary.join("・")}</div>
            ):(
              <div style={{fontSize:11,color:"#6a9bb8"}}>未入力です</div>
            )}
            {effectiveConditions&&effectiveConditions.plannedStartTime&&(
              <div style={{fontSize:12,color:"#d0e8f5",marginTop:4}}>
                開始予定 {effectiveConditions.plannedStartTime}
                {effectiveConditions.plannedDurationMin&&`・釣行時間 ${effectiveConditions.plannedDurationMin}分`}
                {plannedEnd&&`・終了予定 ${plannedEnd.text}`}
              </div>
            )}
            {effectiveConditions&&effectiveConditions.source&&effectiveConditions.source!=="manual"&&(
              <div style={{fontSize:10,color:"#6a9bb8",marginTop:2}}>
                {effectiveConditions.source==="auto"?"自動取得":"自動＋手入力"}
              </div>
            )}

            <div style={{marginTop:8}}>
              {!canAutoFetch?(
                <div style={{fontSize:11,color:"#6a9bb8"}}>自動取得にはポイントの緯度経度が必要です</div>
              ):(
                <>
                  <button onClick={()=>onFetchAutoConditions({spot:targetSpotForFetch,forecastForMs,planDateStr,planTimeStr})}
                    disabled={autoFetchStatus&&autoFetchStatus.loading}
                    style={{width:"100%",padding:"9px 8px",borderRadius:9,fontSize:12,fontWeight:600,
                      cursor:autoFetchStatus&&autoFetchStatus.loading?"default":"pointer",
                      background:"rgba(122,179,255,0.15)",border:"1px solid rgba(122,179,255,0.4)",color:"#7ab3ff"}}>
                    {autoFetchStatus&&autoFetchStatus.loading?"取得中…":cacheMatchesPlan?"再取得":"☁️ 天気・風・波を取得"}
                  </button>
                  {cacheMatchesPlan&&(
                    <div style={{fontSize:10,color:"#6a9bb8",marginTop:4}}>
                      {cacheIsFresh?`✓ 予報取得済み（${cacheAgeMin}分前・${targetSpotForFetch.name}）`:`${cacheAgeMin}分前取得（古いキャッシュ・${targetSpotForFetch.name}）`}
                    </div>
                  )}
                  {autoFetchStatus&&autoFetchStatus.error&&(
                    <div style={{fontSize:11,color:"#e84c3d",marginTop:4}}>⚠️ {autoFetchStatus.error}</div>
                  )}
                  {cacheMatchesPlan&&(conditionsCache.weather||conditionsCache.marine)&&(
                    <div style={{marginTop:6}}>
                      <button onClick={()=>setShowAutoDetail(v=>!v)}
                        style={{fontSize:11,color:"#6a9bb8",background:"none",border:"none",cursor:"pointer",padding:0}}>
                        {showAutoDetail?"閉じる":"自動取得結果を見る"}
                      </button>
                      {showAutoDetail&&(
                        <div style={{background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"8px 10px",marginTop:6,fontSize:11,color:"#d0e8f5",lineHeight:1.8}}>
                          <div style={{color:"#6a9bb8",marginBottom:4}}>
                            予報地点：{targetSpotForFetch.name}（緯度{targetSpotForFetch.lat}・経度{targetSpotForFetch.lng}）<br/>
                            対象時刻：{conditionsCache.weather?conditionsCache.weather.forecastTime:conditionsCache.marine?.forecastTime}
                          </div>
                          {conditionsCache.weather?(
                            <>
                              天気　{weatherCodeToLabel(conditionsCache.weather.weatherCode)||"—"}<br/>
                              気温　{conditionsCache.weather.temperatureC!=null?conditionsCache.weather.temperatureC+"℃":"—"}<br/>
                              風　{degToCompass8(conditionsCache.weather.windDirectionDeg)||""} {conditionsCache.weather.windSpeedMs!=null?conditionsCache.weather.windSpeedMs+"m/s":""}<br/>
                              {conditionsCache.weather.windGustMs!=null&&<>突風　{conditionsCache.weather.windGustMs}m/s<br/></>}
                              降水　{conditionsCache.weather.precipitationMm!=null?conditionsCache.weather.precipitationMm+"mm":"—"}<br/>
                            </>
                          ):conditionsCache.weatherError?(
                            <div style={{color:"#e84c3d"}}>天気：{conditionsCache.weatherError}</div>
                          ):null}
                          {conditionsCache.marine?(
                            <>
                              波高　{conditionsCache.marine.waveHeightM!=null?conditionsCache.marine.waveHeightM+"m":"—"}<br/>
                              波向　{degToCompass8(conditionsCache.marine.waveDirectionDeg)||"—"}<br/>
                              波周期　{conditionsCache.marine.wavePeriodSec!=null?conditionsCache.marine.wavePeriodSec+"秒":"—"}<br/>
                            </>
                          ):conditionsCache.marineError?(
                            <div style={{color:"#e84c3d"}}>波：{conditionsCache.marineError}</div>
                          ):null}
                          {(()=>{
                            const autoVals=buildAutoFieldValues(conditionsCache.weather,conditionsCache.marine);
                            const conflicts=Object.entries(autoVals).filter(([k,v])=>v!=null&&effectiveConditions&&effectiveConditions[k]&&effectiveConditions[k]!==v);
                            if(conflicts.length===0) return null;
                            return (
                              <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid rgba(255,255,255,0.1)"}}>
                                <div style={{color:"#f5a623",marginBottom:4}}>手入力済みの値と異なります（自動上書きしません）：</div>
                                {conflicts.map(([k,v])=>(
                                  <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                                    <span>{AUTO_FIELD_LABELS[k]}：自動{v} / 現在{effectiveConditions[k]}</span>
                                    <button onClick={()=>onApplyAutoField(k,v)}
                                      style={{fontSize:10,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(245,166,35,0.4)",background:"transparent",color:"#f5a623",cursor:"pointer"}}>
                                      自動値を反映
                                    </button>
                                  </div>
                                ))}
                              </div>
                            );
                          })()}
                          <div style={{fontSize:9,color:"rgba(106,155,184,0.7)",marginTop:6}}>Weather data by Open-Meteo.com</div>
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>

          {/* 4.5 潮汐 */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🌊 潮汐</div>
            {!canFetchTide?(
              <div style={{fontSize:11,color:"#6a9bb8",lineHeight:1.6}}>
                このポイントには潮汐観測地点が設定されていません。「📍 ポイントを変更」の編集画面から設定できます。
                <a href={TIDE_SOURCE_PAGE_URL} target="_blank" rel="noopener noreferrer" style={{color:"#7ab3ff",marginLeft:4}}>気象庁で確認</a>
              </div>
            ):(
              <>
                <button onClick={()=>onFetchTide({stationId:planStationId,stationName:planStationName,dateStr:planDateStr,planTimeStr})}
                  disabled={autoTideStatus&&autoTideStatus.loading}
                  style={{width:"100%",padding:"9px 8px",borderRadius:9,fontSize:12,fontWeight:600,
                    cursor:autoTideStatus&&autoTideStatus.loading?"default":"pointer",
                    background:"rgba(122,179,255,0.15)",border:"1px solid rgba(122,179,255,0.4)",color:"#7ab3ff"}}>
                  {autoTideStatus&&autoTideStatus.loading?"取得中…":tideCacheMatchesPlan?"再取得":"🌊 潮汐を取得"}
                </button>
                {tideCacheMatchesPlan&&(
                  <div style={{fontSize:10,color:"#6a9bb8",marginTop:4}}>
                    {tideCacheIsFresh
                      ?`✓ 気象庁潮位表（${Math.floor(tideCacheAgeMin/60)}時間前・${planStationName}）`
                      :`${Math.floor(tideCacheAgeMin/60)}時間前取得（古いキャッシュ・${planStationName}）`}
                  </div>
                )}
                {autoTideStatus&&autoTideStatus.error&&(
                  <div style={{fontSize:11,color:"#e84c3d",marginTop:4}}>⚠️ {autoTideStatus.error}</div>
                )}
                {tideCacheMatchesPlan&&(
                  <div style={{background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"8px 10px",marginTop:6,fontSize:12,color:"#d0e8f5",lineHeight:1.8}}>
                    {tideCache.highs.length===0&&tideCache.lows.length===0?(
                      <div style={{color:"#6a9bb8"}}>この日は満潮・干潮の予測がありません。</div>
                    ):(
                      <>
                        {tideCache.highs.map((h,i)=><div key={"h"+i}>満潮 {h.time}（{h.heightCm}cm）</div>)}
                        {tideCache.lows.map((l,i)=><div key={"l"+i}>干潮 {l.time}（{l.heightCm}cm）</div>)}
                      </>
                    )}
                    {tideRelation&&(tideRelation.nextHigh||tideRelation.nextLow||tideRelation.direction)&&(
                      <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid rgba(255,255,255,0.1)"}}>
                        {tideRelation.nextHigh&&<div>満潮まで{formatDurationMin(tideRelation.nextHigh.min-tideRelation.planMin)}</div>}
                        {tideRelation.nextLow&&<div>干潮まで{formatDurationMin(tideRelation.nextLow.min-tideRelation.planMin)}</div>}
                        {tideRelation.direction&&<div>天文潮位上：{tideRelation.direction}</div>}
                        {tideBucket&&<div style={{color:"#6a9bb8"}}>該当区分：{tideBucket}</div>}
                      </div>
                    )}
                    {tideConflict&&(
                      <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid rgba(255,255,255,0.1)"}}>
                        <div style={{color:"#f5a623",marginBottom:4}}>手入力済みの値と異なります（自動上書きしません）：</div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <span>潮の動き：自動{tideConflict} / 現在{effectiveConditions.tideDirection}</span>
                          <button onClick={()=>onApplyAutoField("tideDirection",tideConflict)}
                            style={{fontSize:10,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(245,166,35,0.4)",background:"transparent",color:"#f5a623",cursor:"pointer"}}>
                            自動値を反映
                          </button>
                        </div>
                      </div>
                    )}
                    <div style={{fontSize:9,color:"rgba(106,155,184,0.7)",marginTop:6}}>
                      潮汐データ：気象庁 天文潮位（<a href={tideCache.sourceUrl} target="_blank" rel="noopener noreferrer" style={{color:"rgba(122,179,255,0.7)"}}>{tideCache.stationName}</a>）
                    </div>
                  </div>
                )}
              </>
            )}
          </div>

          {/* 7. 安全チェック */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>🛟 安全チェック</div>
            {safetyNotices.length===0?(
              <div style={{fontSize:12,color:"#6a9bb8",lineHeight:1.6}}>現在入力されている条件では、強い安全警告はありません。</div>
            ):(
              safetyNotices.map((n,i)=>(
                <div key={i} style={{fontSize:12,color:"#e84c3d",lineHeight:1.6}}>⚠ {n}</div>
              ))
            )}
          </div>

          {/* 5. 最近の周辺釣果 */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,color:"#6a9bb8",fontWeight:700,marginBottom:4}}>📰 最近の周辺釣果（{effective.fishName}）</div>
            {reportsError?(
              <div style={{fontSize:12,color:"#6a9bb8"}}>最新釣果情報を取得できませんでした。</div>
            ):reportStats.total===0?(
              <div style={{fontSize:12,color:"#6a9bb8"}}>現在利用できる情報はありません。</div>
            ):(
              <div style={{fontSize:12,color:"#d0e8f5",lineHeight:1.8}}>
                直近7日：{reportStats.within7}件　30日以内：{reportStats.within30}件<br/>
                岸：{reportStats.shoreCount}件　船：{reportStats.boatCount}件<br/>
                最終確認：{reportStats.lastDays===0?"当日":reportStats.lastDays+"日前"}
              </div>
            )}
            {updateStatus&&<div style={{fontSize:10,color:updateStatus.level==="alert"?"#e84c3d":"#6a9bb8",marginTop:4}}>{updateStatus.text}</div>}
            {reportsMalformed&&<div style={{fontSize:10,color:"#e84c3d",marginTop:2}}>⚠️ 最新釣果情報の形式に問題があります</div>}
          </div>

          {/* 6. 自分の実績 */}
