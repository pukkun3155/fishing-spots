function sizeCategory(sizeCm){
  const n=parseFloat(sizeCm);
  if(!n) return null;
  if(n<13) return "small";
  if(n<18) return "medium";
  return "large";
}
const SIZE_RECIPE_PRIORITY = {
  small:["r-shirogisu-karaage","r-shirogisu-tenpura","r-shirogisu-furai","r-shirogisu-shioyaki"],
  medium:["r-shirogisu-tenpura","r-shirogisu-furai","r-shirogisu-shioyaki","r-shirogisu-karaage"],
  large:["r-shirogisu-shioyaki","r-shirogisu-furai","r-shirogisu-tenpura","r-shirogisu-karaage"],
};
function recommendRecipes(recipes,fishName,sizeCm){
  const matched=recipes.filter(r=>r.fish===fishName);
  const cat=sizeCategory(sizeCm);
  const order=cat&&SIZE_RECIPE_PRIORITY[cat];
  if(!order) return matched;
  return [...matched].sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
}

// ── Phase 3: 分析集計関数（UIから分離。Phase4で再利用する前提） ──

function filterTripsByPeriod(trips,period){
  if(period==="all") return trips;
  const now=Date.now();
  let from;
  if(period==="30d") from=now-30*24*60*60*1000;
  else if(period==="year"){ const d=new Date(); d.setMonth(0,1); d.setHours(0,0,0,0); from=d.getTime(); }
  else return trips;
  return trips.filter(t=>{
    const ts=t.startAt||(t.date?new Date(t.date+"T00:00:00").getTime():null);
    return ts==null?true:ts>=from;
  });
}

function sampleLabel(n){
  if(!n||n<=0) return null;
  if(n<=2) return "かなり少ない";
  if(n<=4) return "まだ参考程度";
  return null;
}

function getTripStats(trips){
  const total=trips.length;
  const withCatch=trips.filter(t=>(t.catchCount||0)>0).length;
  const bouzu=trips.filter(t=>(t.catchCount||0)===0).length;
  const withBite=trips.filter(t=>(t.biteCount||0)>0).length;
  const totalCatch=trips.reduce((s,t)=>s+(t.catchCount||0),0);
  const totalDurationMin=trips.reduce((s,t)=>s+(t.durationMin||0),0);
  const catchPerHour=totalDurationMin>0?totalCatch/(totalDurationMin/60):null;
  return { total, withCatch, bouzu, withBite, totalCatch, totalDurationMin, catchPerHour };
}

function getSpotStats(trips){
  const map=new Map();
  trips.forEach(t=>{
    const key=t.spotId||("name:"+(t.spotName||"不明"));
    if(!map.has(key)) map.set(key,{key,label:t.spotName||"（スポット不明）",trips:[]});
    map.get(key).trips.push(t);
  });
  return [...map.values()]
    .map(({key,label,trips})=>({key,label,...getTripStats(trips)}))
    .sort((a,b)=>b.total-a.total);
}

function getFishStats(catches){
  const map=new Map();
  catches.forEach(c=>{
    const key=c.fishName||UNKNOWN_FISH;
    if(!map.has(key)) map.set(key,{fishName:key,totalCount:0,tripIds:new Set(),firstAt:null,lastAt:null});
    const e=map.get(key);
    e.totalCount+=c.count||0;
    e.tripIds.add(c.tripId);
    const t=c.caughtAt||0;
    if(!e.firstAt||t<e.firstAt) e.firstAt=t;
    if(!e.lastAt||t>e.lastAt) e.lastAt=t;
  });
  return [...map.values()]
    .map(e=>({fishName:e.fishName,totalCount:e.totalCount,tripCount:e.tripIds.size,firstAt:e.firstAt,lastAt:e.lastAt}))
    .sort((a,b)=>b.totalCount-a.totalCount);
}

const TIME_BUCKETS=[["early",4,7],["morning",7,10],["midday",10,15],["evening",15,18],["night",18,28]];
const TIME_BUCKET_LABELS={early:"早朝（4-7時）",morning:"朝（7-10時）",midday:"昼（10-15時）",evening:"夕方（15-18時）",night:"夜（18-4時）"};
function timeBucketOf(hour){
  const h=hour<4?hour+24:hour;
  for(const [key,start,end] of TIME_BUCKETS){ if(h>=start&&h<end) return key; }
  return "night";
}
function getTimeStats(trips){
  const buckets={early:[],morning:[],midday:[],evening:[],night:[]};
  trips.forEach(t=>{
    if(!t.startAt) return;
    buckets[timeBucketOf(new Date(t.startAt).getHours())].push(t);
  });
  return Object.entries(buckets).map(([key,list])=>({key,label:TIME_BUCKET_LABELS[key],...getTripStats(list)}));
}

function getMonthlyStats(trips,catches){
  const map=new Map();
  trips.forEach(t=>{
    const ym=(t.date||(t.startAt?new Date(t.startAt).toISOString().slice(0,10):"")).slice(0,7);
    if(!ym) return;
    if(!map.has(ym)) map.set(ym,[]);
    map.get(ym).push(t);
  });
  return [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([ym,list])=>{
    const tripIds=new Set(list.map(t=>t.id));
    const monthCatches=catches.filter(c=>tripIds.has(c.tripId));
    const fishCount=new Map();
    monthCatches.forEach(c=>fishCount.set(c.fishName,(fishCount.get(c.fishName)||0)+(c.count||0)));
    const topFish=[...fishCount.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n])=>n);
    return {ym,...getTripStats(list),topFish};
  });
}

const CONDITION_FIELDS=[["weather","天気"],["tide","潮回り"],["rig","仕掛け"],["bait","エサ"],["targetFish","対象魚"]];
function getConditionStats(trips){
  return CONDITION_FIELDS.map(([field,label])=>{
    const groups=new Map();
    trips.forEach(t=>{
      const v=(t[field]||"").trim();
      if(!v) return;
      if(!groups.has(v)) groups.set(v,[]);
      groups.get(v).push(t);
    });
    if(groups.size===0) return null;
    const values=[...groups.entries()]
      .map(([value,list])=>({value,...getTripStats(list)}))
      .sort((a,b)=>b.total-a.total);
    return {field,label,values};
  }).filter(Boolean);
}

// ── Phase 4: 最新周辺釣果 × 自分の実績 の「今おすすめの狙い」 ──

function daysAgo(dateStr,now){
  if(!dateStr) return null;
  const t=new Date(dateStr+(dateStr.length<=10?"T00:00:00":"")).getTime();
  if(isNaN(t)) return null;
  return Math.floor((now-t)/(24*60*60*1000));
}

function freshnessLabel(days){
  if(days==null) return null;
  if(days<=7) return "新しい情報";
  if(days<=14) return "やや新しい";
  if(days<=30) return "参考情報";
  return "古い情報";
}

function gearFits(methodWeightG,gearProfile){
  if(methodWeightG==null||methodWeightG<=0) return true;
  return (gearProfile.rods||[]).some(r=>methodWeightG>=r.lureWeightMinG&&methodWeightG<=r.lureWeightMaxG);
}

function getTargetRecommendations({trips,catches,reports,targetProfiles,gearProfile,now}){
  now=now||Date.now();
  const shoreReports=reports.filter(r=>r.fishingType==="shore");
  const boatReports=reports.filter(r=>r.fishingType==="boat");
  const nowMonth=new Date(now).getMonth();
  const nowBucket=timeBucketOf(new Date(now).getHours());

  const scored=targetProfiles.map(profile=>{
    const fishName=profile.fishName;
    const fishShore=shoreReports.filter(r=>r.fishName===fishName).sort((a,b)=>new Date(b.reportedAt)-new Date(a.reportedAt));
    const fishBoat=boatReports.filter(r=>r.fishName===fishName).sort((a,b)=>new Date(b.reportedAt)-new Date(a.reportedAt));
    const latestShore=fishShore[0]||null;
    const latestBoat=fishBoat[0]||null;
    const shoreDays=latestShore?daysAgo(latestShore.reportedAt,now):null;

    const personalCatches=catches.filter(c=>c.fishName===fishName);
    const personalTripIds=new Set(personalCatches.map(c=>c.tripId));
    const personalTrips=trips.filter(t=>personalTripIds.has(t.id));
    const personalCount=personalCatches.reduce((s,c)=>s+(c.count||0),0);
    const personalTripCount=personalTripIds.size;

    const monthMatch=personalTrips.some(t=>{
      const d=t.date?new Date(t.date+"T00:00:00"):(t.startAt?new Date(t.startAt):null);
      return d&&d.getMonth()===nowMonth;
    });
    const timeMatch=personalTrips.some(t=>t.startAt&&timeBucketOf(new Date(t.startAt).getHours())===nowBucket);

    const methods=profile.recommendedMethods||[];
    const fitMethod=methods.find(m=>gearFits(m.typicalWeightG,gearProfile))||null;

    let score=0; const reasons=[];
    if(shoreDays!=null){
      if(shoreDays<=7){score+=3;reasons.push(`直近${shoreDays===0?"当日":shoreDays+"日前"}の岸釣りで釣果情報あり（${latestShore.sourceName}）`);}
      else if(shoreDays<=14){score+=2;reasons.push(`${shoreDays}日前の岸釣り釣果情報あり（${latestShore.sourceName}）`);}
      else if(shoreDays<=30){score+=1;reasons.push(`${shoreDays}日前の岸釣り釣果情報あり（参考情報・${latestShore.sourceName}）`);}
      else{reasons.push(`岸釣り情報はありますが${shoreDays}日前とやや古めです（${latestShore.sourceName}）`);}
    }else if(latestBoat){
      score-=2;
      reasons.push("最近の情報は船釣りのみで、岸からの実績情報は見つかっていません");
    }
    if(personalTripCount>0){
      score+=2;
      reasons.push(`自分の実績あり（釣行${personalTripCount}回・${personalCount}匹）`);
    }
    if(monthMatch){score+=1;reasons.push("今の時期（月）に自分で釣った実績あり");}
    if(timeMatch){score+=1;reasons.push("この時間帯に自分で釣った実績あり");}
    if(profile.beginnerFriendly){score+=1;reasons.push("初心者向け");}
    if(profile.shoreTargetable){score+=1;reasons.push("岸から狙える");}
    if(methods.length>0){
      if(fitMethod){score+=2;reasons.push(`手持ちタックルで対応可（${fitMethod.name}）`);}
      else reasons.push("推奨される仕掛けが手持ちタックルの適合範囲外です");
    }
    if(latestShore==null&&latestBoat==null&&personalTripCount===0){
      reasons.push("外部情報・自分の実績のどちらもまだありません");
    }else if(latestShore==null&&latestBoat==null&&personalTripCount>0){
      reasons.push("外部の最新情報はまだ無く、自分の実績のみに基づく表示です");
    }else if(personalTripCount===0&&(latestShore||latestBoat)){
      reasons.push("自分の実績はまだ無く、周辺の外部情報のみに基づく表示です");
    }

    const stars=score<=1?1:score<=3?2:score<=5?3:score<=7?4:5;
    const eligible=shoreDays!=null||!!latestBoat||personalTripCount>0;

    return { fishName, score, stars, reasons, eligible,
      latestShore, latestBoat, shoreDays, shoreFreshness:freshnessLabel(shoreDays),
      personalTripCount, personalCount, gearFit:!fitMethod&&methods.length>0?false:true };
  });

  return scored.filter(s=>s.eligible).sort((a,b)=>b.score-a.score);
}

function appleUrl(s){
  if(s.lat&&s.lng) return `maps://maps.apple.com/?ll=${s.lat},${s.lng}&q=${encodeURIComponent(s.name)}`;
  if(s.addr) return `maps://maps.apple.com/?q=${encodeURIComponent(s.addr)}`;
  return null;
}
function googleUrl(s){
  if(s.lat&&s.lng) return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  if(s.addr) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.addr)}`;
  return null;
}

function IOModal({show,onClose,spots,onImport,onClear}){
  const fileRef=useRef();

  const handleExport=()=>{
    if(!spots.length){alert("登録されているポイントがありません");return;}
    const json=JSON.stringify({version:2,exportedAt:new Date().toISOString(),spots},null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="fishing_spots.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const handleImport=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const inc=data.spots||(Array.isArray(data)?data:[]);
        if(!inc.length){alert("データが見つかりませんでした");return;}
        onImport(inc);
      }catch{alert("読み込みに失敗しました");}
      e.target.value="";
    };
    reader.readAsText(file);
  };

  const handleClear=()=>{
    if(!confirm("⚠️ 全データを削除します。バックアップはとりましたか？"))return;
    onClear(); onClose();

  return (

      {ioBtn("📤","JSONファイルに書き出す","fishing_spots.json としてダウンロード",handleExport,"46,204,135")}
      <div style={{fontSize:11,color:"#6a9bb8",lineHeight:1.7,padding:"8px 10px",
        background:"rgba(255,255,255,0.04)",borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",marginBottom:16}}>

    const q=search.trim().toLowerCase();
    const mq=!q||(s.name||"").toLowerCase().includes(q)||(s.note||"").toLowerCase().includes(q)||
      (s.fish||"").toLowerCase().includes(q)||(s.addr||"").toLowerCase().includes(q);
    return mf&&mq;
  });

  const openAdd=()=>{setEditTarget(null);setShowEdit(true);};
  const openEdit=s=>{setEditTarget(s);setShowEdit(true);};

  const handleSave=form=>{
    if(editTarget?.id){
      setSpots(prev=>prev.map(s=>s.id===editTarget.id?{...form,id:editTarget.id,updatedAt:Date.now()}:s));
    }else{
      setSpots(prev=>[{...form,id:uid(),updatedAt:Date.now()},...prev]);
    }
    setShowEdit(false);
  };

  const handleDelete=id=>{
    if(!confirm("このポイントを削除しますか？"))return;
    setSpots(prev=>prev.filter(s=>s.id!==id));
  };

  const handleImport=incoming=>{
    setSpots(prev=>{
      const ids=new Set(prev.map(s=>s.id));
      let added=0;
      const newOnes=incoming.filter(s=>{if(!ids.has(s.id)){added++;return true;}return false;});
      alert(`✅ ${added}件のポイントを読み込みました（重複スキップ：${incoming.length-added}件）`);
      return [...newOnes,...prev];
    });
  };

  const chips=[
    ["all","すべて"],["ok","✅ 釣り可"],["ng","❌ NG"],["tbc","🔍 要確認"],["fav","⭐ お気に入り"],
    ["numazu","沼津"],["nishiizu","西伊豆"],["higashiizu","東伊豆"],["minamiizu","南伊豆"],
  ];

  const Stat=({label,val,color})=>(
    <div style={{flex:1,textAlign:"center",padding:"9px 4px",borderRight:"1px solid rgba(255,255,255,0.1)"}}>
      <div style={{fontSize:19,fontWeight:700,color:color||"#fff"}}>{val}</div>
      <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>{label}</div>
    </div>
  );

  return (
    <div style={{background:"#061a2e",minHeight:"100vh",color:"#d0e8f5"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0a2a4a,#0d3a5c)",padding:"14px 16px",
        borderBottom:"1px solid rgba(255,255,255,0.1)",display:"flex",alignItems:"center",
        justifyContent:"space-between",gap:8,position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>🎣</span>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>My 釣りポイント帳</div>
            <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>偵察・お気に入り釣り場を管理</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setShowIO(true)}
            style={{background:"rgba(255,255,255,0.1)",color:"#d0e8f5",
              border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"7px 10px",fontSize:12,cursor:"pointer"}}>
            📂 保存/読込
          </button>
          <button onClick={openAdd}
            style={{background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:8,
              padding:"7px 12px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
            ＋ 追加
          </button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.25)"}}>
        <Stat label="合計" val={spots.length}/>
        <Stat label="✅ 釣り可" val={spots.filter(s=>s.status==="ok").length} color="#2ecc87"/>
        <Stat label="❌ NG" val={spots.filter(s=>s.status==="ng").length} color="#e84c3d"/>
        <Stat label="🔍 要確認" val={spots.filter(s=>s.status==="tbc").length} color="#f5a623"/>
        <div style={{flex:1,textAlign:"center",padding:"9px 4px"}}>
          <div style={{fontSize:19,fontWeight:700,color:"#f5c842"}}>{spots.filter(s=>s.star>=4).length}</div>
          <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>⭐ お気に入り</div>
        </div>
      </div>

      {/* Search */}
      <div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,0.1)",background:"#0a2a4a"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="🔍 ポイント名・魚種・メモで検索…"
          style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",
            borderRadius:8,padding:"8px 12px",color:"#d0e8f5",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
      </div>

      {/* Filter */}
      <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",
        borderBottom:"1px solid rgba(255,255,255,0.1)",background:"#0a2a4a"}}>
        {chips.map(([f,label])=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{background:filter===f?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${filter===f?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:filter===f?"#f5a623":"#6a9bb8",fontWeight:filter===f?700:400,
              borderRadius:20,padding:"4px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>
            {label}
          </button>
        ))}
      </div>

      {/* List */}
      <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:"48px 20px",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
            <div style={{fontSize:38,marginBottom:10}}>{spots.length?"🔍":"🎣"}</div>
            {spots.length?"絞り込み結果がありません":
              <span>「＋ 追加」ボタンで最初の釣り場を記録しましょう！<br/>
              データは「📂 保存/読込」でJSONに書き出し、<br/>次回読み込むと復元できます。</span>}
          </div>
        ):filtered.map(s=>(
          <SpotCard key={s.id} spot={s} onEdit={openEdit} onDelete={handleDelete} onStartFishing={onStartFishing}/>
        ))}
      </div>

      <EditModal show={showEdit} onClose={()=>setShowEdit(false)} onSave={handleSave} initial={editTarget}/>
      <IOModal show={showIO} onClose={()=>setShowIO(false)} spots={spots} onImport={handleImport} onClear={()=>setSpots([])}/>
    </div>
  );
}

  const actions=[
    ["bite","👆","アタリ","46,204,135"],
    ["catch","🐟","釣れた","245,166,35"],
    ["rig_change","🔧","仕掛け交換","106,155,184"],
    ["trouble","⚠️","トラブル","232,76,61"],
  ];

  const handleAction=type=>{
    if(type==="catch"){ setShowCatch(true); return; }
    onLogEvent(type);
    const found=actions.find(a=>a[0]===type);
    flash(`${found[1]} ${found[2]} を記録しました`);
  };

  const handleSaveCatch=({fishName,count,kept})=>{
    setShowCatch(false);
    const rec=onLogCatch({fishName,count,kept});
    if(kept) setOnsiteCatch(rec);
    else flash("🌊 リリースしました");
  };

  return (
    <div style={{padding:"16px 14px"}}>
      <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>{activeSession.spotName||"（スポット未設定）"}</div>
        <div style={{fontSize:12,color:"#6a9bb8",marginTop:4}}>
          開始 {new Date(activeSession.startAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}（経過 {elapsed}分）
        </div>
        <div style={{display:"flex",gap:14,marginTop:8,fontSize:12,color:"#d0e8f5"}}>
          <span>👆 アタリ {activeSession.biteCount||0}</span>
          <span>🐟 釣果 {activeSession.catchCount||0}</span>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        {actions.map(([type,emoji,label,col])=>(
          <button key={type} onClick={()=>handleAction(type)}
            style={{padding:"18px 8px",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer",
              background:`rgba(${col},0.12)`,border:`1px solid rgba(${col},0.35)`,color:`rgb(${col})`}}>
            <div style={{fontSize:26,marginBottom:4}}>{emoji}</div>{label}
          </button>
        ))}
      </div>

      <button onClick={()=>{
          const note=prompt("メモを入力してください");
          if(note!==null&&note.trim()){onLogEvent("memo",note.trim());flash("📝 メモを記録しました");}
        }}
        style={{width:"100%",padding:"12px 8px",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:10,
          background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",color:"#d0e8f5"}}>
        📝 メモを追加
      </button>

      {keptCatches.length>0&&(
        <button onClick={onOpenHomeMode}
          style={{width:"100%",padding:"12px 8px",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10,
            background:"rgba(245,166,35,0.15)",border:"1px solid rgba(245,166,35,0.4)",color:"#f5a623"}}>
          🏠 帰宅後の処理へ（持ち帰り {keptCatches.length}件）
        </button>
      )}

      <button onClick={()=>setShowEnd(true)}
        style={{width:"100%",padding:14,borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",
          background:"#e84c3d",border:"none",color:"#fff"}}>
        🏁 釣り終了
      </button>

      {sessionCatches.length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#6a9bb8",fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>🐟 釣果一覧</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {sessionCatches.map(c=>(
              <div key={c.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,
                background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"7px 10px"}}>
                <span style={{fontSize:12,color:"#d0e8f5"}}>{c.fishName} × {c.count}（{c.kept?"持ち帰り":"リリース"}）</span>
                {c.kept&&<button onClick={()=>setOnsiteCatch(c)}
                  style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:"1px solid rgba(245,166,35,0.4)",
                    background:"transparent",color:"#f5a623",cursor:"pointer"}}>処理ガイド</button>}
              </div>
            ))}
          </div>
        </div>
      )}

      {activeSession.events?.length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#6a9bb8",fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>ログ</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {[...activeSession.events].reverse().map(ev=>(
              <div key={ev.id} style={{fontSize:12,color:"#6a9bb8",display:"flex",gap:8}}>
                <span style={{opacity:0.6}}>{new Date(ev.ts).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</span>
                <span>{ev.type==="catch"||ev.type==="memo"?"📝 "+ev.note:({bite:"👆 アタリ",rig_change:"🔧 仕掛け交換",trouble:"⚠️ トラブル"})[ev.type]||ev.type}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <Toast text={toast}/>
      <CatchQuickModal show={showCatch} onClose={()=>setShowCatch(false)} onSave={handleSaveCatch} fishMaster={fishMaster}/>
      {onsiteCatch&&<OnsiteHandlingGuide catchItem={onsiteCatch} fishMaster={fishMaster}
        onClose={()=>setOnsiteCatch(null)}
        onDone={()=>{onUpdateCatch(onsiteCatch.id,{handlingStatus:"onsite_done"});setOnsiteCatch(null);}}/>}
      <EndSessionModal show={showEnd} onClose={()=>setShowEnd(false)} onSave={review=>{setShowEnd(false);onEndSession(review);}}/>
    </div>
  );
}

function RateBadge({num,den}){
  const label=sampleLabel(den);
  return (
    <span style={{fontSize:10,color:"#6a9bb8"}}>
      {den}回中{num}回{label&&<span style={{color:"#f5a623",marginLeft:4}}>（{label}）</span>}
    </span>
  );
}

function Bar({value,max,color}){
  const pct=max>0?Math.min(100,Math.round((value/max)*100)):0;
  return (
    <div style={{background:"rgba(255,255,255,0.08)",borderRadius:6,height:8,overflow:"hidden",marginTop:6}}>
      <div style={{width:`${pct}%`,height:"100%",background:color||"#f5a623",borderRadius:6}}/>
    </div>
  );
}

function StatCard({label,value}){
  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
      <div style={{fontSize:17,fontWeight:700,color:"#fff"}}>{value}</div>
      <div style={{fontSize:10,color:"#6a9bb8",marginTop:2}}>{label}</div>
    </div>
  );
}

function RateCard({label,num,den}){
  const pct=den>0?Math.round((num/den)*100):null;
  return (
    <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,color:"#d0e8f5",fontWeight:600}}>{label}</span>
        <span style={{fontSize:16,fontWeight:700,color:"#f5a623"}}>{pct!=null?`${pct}%`:"—"}</span>
      </div>
      <Bar value={num} max={den||1} color="#f5a623"/>
      <div style={{marginTop:4}}><RateBadge num={num} den={den}/></div>
    </div>
  );
}

function SectionTitle({title}){
  return <div style={{fontSize:13,fontWeight:700,color:"#fff",margin:"16px 0 8px"}}>{title}</div>;
}
function EmptyNote({text}){
  return <div style={{fontSize:12,color:"#6a9bb8",marginBottom:16,lineHeight:1.7}}>{text}</div>;
}

function BasicDashboard({stats}){
  const hours=stats.totalDurationMin>0?(stats.totalDurationMin/60).toFixed(1):null;
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        <StatCard label="総釣行回数" value={`${stats.total}回`}/>
        <StatCard label="総釣行時間" value={hours?`${hours}h`:"未記録"}/>
        <StatCard label="釣果あり" value={`${stats.withCatch}回`}/>
        <StatCard label="ボウズ" value={`${stats.bouzu}回`}/>
        <StatCard label="アタリあり" value={`${stats.withBite}回`}/>
        <StatCard label="総釣果数" value={`${stats.totalCatch}匹`}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <RateCard label="釣果発生率" num={stats.withCatch} den={stats.total}/>
        <RateCard label="アタリ発生率" num={stats.withBite} den={stats.total}/>
        <div style={{fontSize:12,color:"#d0e8f5",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px"}}>
          1時間あたり釣果数：{stats.catchPerHour!=null?`${stats.catchPerHour.toFixed(2)}匹/時`:"時間未記録のため算出不可"}
        </div>
      </div>
    </div>
  );
}

    <div style={{display:"flex",flexDirection:"column",gap:8}}>

function AnalyticsView({trips,catches}){
  const [period,setPeriod]=useState(()=>loadStore(ANALYTICS_KEY,{schemaVersion:1,period:"all"}).period);
  useEffect(()=>{ saveStore(ANALYTICS_KEY,{schemaVersion:1,period}); },[period]);

  if(trips.length===0){
    return (
      <div style={{padding:"48px 20px",textAlign:"center",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
        <div style={{fontSize:38,marginBottom:10}}>📊</div>
        まだ統計を表示できる釣行記録がありません。<br/>
        実際の釣行を記録すると、ここに傾向が表示されます。
      </div>
    );
  }

  const filteredTrips=filterTripsByPeriod(trips,period);
  const filteredTripIds=new Set(filteredTrips.map(t=>t.id));
  const filteredCatches=catches.filter(c=>filteredTripIds.has(c.tripId));
  const periodChips=[["all","全期間"],["30d","直近30日"],["year","今年"]];

  return (
    <div style={{padding:"12px 14px",paddingBottom:80}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:10}}>📊 分析</div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {periodChips.map(([k,l])=>(
          <button key={k} onClick={()=>setPeriod(k)}
            style={{background:period===k?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${period===k?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:period===k?"#f5a623":"#6a9bb8",fontWeight:period===k?700:400,
              borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>
            {l}
          </button>
        ))}
      </div>

      {filteredTrips.length===0?(
        <div style={{textAlign:"center",padding:"32px 16px",color:"#6a9bb8",fontSize:13,lineHeight:1.8}}>
          この期間の釣行記録がありません。
        </div>
      ):(
        <>
          <BasicDashboard stats={getTripStats(filteredTrips)}/>
          <SectionTitle title="🐟 魚種別"/>
          <FishStatsSection fishStats={getFishStats(filteredCatches)}/>
          <SectionTitle title="📍 ポイント別"/>
          <SpotStatsSection spotStats={getSpotStats(filteredTrips)}/>
          <SectionTitle title="🕐 時間帯別"/>
          <TimeStatsSection timeStats={getTimeStats(filteredTrips)}/>
          <SectionTitle title="📅 月別"/>
          <MonthlyStatsSection monthlyStats={getMonthlyStats(filteredTrips,filteredCatches)}/>
          <SectionTitle title="🎯 条件別"/>
          <ConditionStatsSection conditionStats={getConditionStats(filteredTrips)}/>
        </>
      )}
    </div>
  );
}

  home_processed:"下処理済み", cooked:"調理済み",

function CatchEditModal({show,onClose,onSave,initial}){
  const [form,setForm]=useState(EMPTY_CATCH);
  useEffect(()=>{ if(show) setForm(initial||EMPTY_CATCH); },[show,initial]);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const handleSave=()=>{
    if(!form.fishName.trim()){ alert("魚種を入力してください"); return; }
    onSave(form);
  };
  return (
    <Modal show={show} onClose={onClose}>
      <h2 style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>✏️ 釣果を編集</h2>
      <Field label="魚種"><Input value={form.fishName} onChange={e=>set("fishName",e.target.value)}/></Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="数"><Input type="number" min="1" value={form.count} onChange={e=>set("count",parseInt(e.target.value,10)||1)}/></Field>
        <Field label="サイズ（cm・任意）"><Input type="number" step="any" value={form.sizeCm} onChange={e=>set("sizeCm",e.target.value)}/></Field>
      </div>
      <Field label="持ち帰り or リリース">
        <Sel value={form.kept?"kept":"released"} onChange={e=>set("kept",e.target.value==="kept")}>
          <option value="kept">🧊 持ち帰る</option>
          <option value="released">🌊 リリース</option>
        </Sel>

              <span style={{fontSize:11,color:"#d0e8f5"}}>

                <button onClick={()=>onDeleteCatch(c.id)}
                  style={{fontSize:10,padding:"3px 7px",borderRadius:6,border:"1px solid rgba(232,76,61,0.4)",background:"transparent",color:"rgba(232,76,61,0.8)",cursor:"pointer"}}>🗑</button>
              </div>
            </div>

      <div style={{display:"flex",gap:6,marginTop:9,flexWrap:"wrap"}}>
        <button onClick={()=>onEdit(trip)}

        </button>
        <button onClick={()=>setShowAddCatch(true)}
          style={{fontSize:11,padding:"5px 10px",borderRadius:6,

            🏠 帰宅後
          </button>
        )}
        <button onClick={()=>onDelete(trip.id)}
          style={{fontSize:11,padding:"5px 10px",borderRadius:6,
            border:"1px solid rgba(232,76,61,0.4)",background:"transparent",color:"rgba(232,76,61,0.8)",cursor:"pointer"}}>
          🗑 削除
        </button>
      </div>

      <CatchEditModal show={!!editCatchTarget} onClose={()=>setEditCatchTarget(null)} initial={editCatchTarget}
        onSave={form=>{onEditCatch(editCatchTarget.id,form);setEditCatchTarget(null);}}/>
      <CatchEditModal show={showAddCatch} onClose={()=>setShowAddCatch(false)}
        initial={{...EMPTY_CATCH,tripId:trip.id,caughtAt:Date.now()}}

function RigGuideView({guide}){
  const [step,setStep]=useState(0);
  if(!guide) return null;
  const s=guide.steps[step];
  return (
    <div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}}>
        {guide.chain.map((c,i)=>(
          <span key={i} style={{fontSize:11,background:"rgba(255,255,255,0.08)",borderRadius:4,padding:"3px 8px",color:"#6a9bb8"}}>
            {c}{i<guide.chain.length-1?" →":""}
          </span>
        ))}
      </div>
      <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:16,minHeight:120}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff",marginBottom:8}}>{s.title}</div>
        <div style={{fontSize:13,color:"#6a9bb8",lineHeight:1.7}}>{s.detail}</div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center",justifyContent:"space-between"}}>
        <button disabled={step===0} onClick={()=>setStep(s=>s-1)}
          style={{padding:"9px 16px",borderRadius:9,fontSize:13,cursor:step===0?"default":"pointer",
            background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:step===0?"rgba(106,155,184,0.4)":"#6a9bb8"}}>
          ← 前へ
        </button>
        <span style={{fontSize:12,color:"#6a9bb8"}}>{step+1} / {guide.steps.length}</span>
        <button disabled={step===guide.steps.length-1} onClick={()=>setStep(s=>s+1)}
          style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:step===guide.steps.length-1?"default":"pointer",
            background:step===guide.steps.length-1?"transparent":"#f5a623",
            border:step===guide.steps.length-1?"1px solid rgba(255,255,255,0.15)":"none",
            color:step===guide.steps.length-1?"rgba(106,155,184,0.4)":"#1a0a00"}}>
          次へ →
        </button>
      </div>
    </div>
  );
}

function GearTab({gearTemplates,setGearTemplates,rigGuides}){
  const [sub,setSub]=useState("gear");
  const template=gearTemplates[0]||null;
  const guide=rigGuides[0]||null;

  const updateTemplate=updater=>{
    setGearTemplates(prev=>prev.map((t,i)=>i===0?updater(t):t));
  };
  const onToggleItem=(id,checked)=>updateTemplate(t=>({...t,items:t.items.map(it=>it.id===id?{...it,checked}:it),updatedAt:Date.now()}));
  const onAddItem=label=>updateTemplate(t=>({...t,items:[...t.items,{id:uid(),label,checked:false}],updatedAt:Date.now()}));
  const onRemoveItem=id=>updateTemplate(t=>({...t,items:t.items.filter(it=>it.id!==id),updatedAt:Date.now()}));
  const onResetAll=()=>{ if(confirm("チェックを全部リセットしますか？")) updateTemplate(t=>({...t,items:t.items.map(it=>({...it,checked:false})),updatedAt:Date.now()})); };

  return (
    <div style={{padding:"12px 14px"}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:10}}>🎒 {template?template.name:"持ち物"}</div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["gear","✅ チェックリスト"],["guide","🪝 仕掛けガイド"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSub(k)}
            style={{background:sub===k?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${sub===k?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:sub===k?"#f5a623":"#6a9bb8",fontWeight:sub===k?700:400,
              borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>
            {l}
          </button>
        ))}
      </div>
      {sub==="gear"
        ?<GearChecklistView template={template} onToggleItem={onToggleItem} onAddItem={onAddItem} onRemoveItem={onRemoveItem} onResetAll={onResetAll}/>
        :<RigGuideView guide={guide}/>}
    </div>
  );
}

const HOME_STEP_TITLES = {
  1:"持ち帰った魚の確認", 2:"魚種確認", 3:"下処理", 4:"保存方法", 5:"おすすめ料理", 6:"調理済み", 7:"食後評価",
};

function HomeStepHeader({step,onClose}){
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <div>
        <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>🏠 帰宅後 ・ ステップ {step}/7</div>
        <div style={{fontSize:12,color:"#6a9bb8",marginTop:2}}>{HOME_STEP_TITLES[step]}</div>
      </div>
      <button onClick={onClose}
        style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",
          borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer"}}>
        ✕ 閉じる
      </button>
    </div>
  );
}

function HomeStepNav({step,onBack,onNext,nextLabel}){
  return (
    <div style={{display:"flex",gap:8,marginTop:18}}>
      {step>1&&<button onClick={onBack}
        style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",
          borderRadius:10,padding:"12px 16px",fontSize:14,cursor:"pointer"}}>
        ← 戻る
      </button>}
      <button onClick={onNext}
        style={{flex:1,background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>
        {nextLabel||"次へ →"}
      </button>
    </div>
  );
}

function HomeModeView({tripId,tripLabel,catches,fishMaster,recipes,progress,onUpdateProgress,onUpdateCatch,onSaveMeal,onClose}){
  const step=progress.step||1;
  const goTo=n=>onUpdateProgress({step:n});
  const identifiedCatches=catches.filter(c=>c.fishName!==UNKNOWN_FISH);
  const unknownCatches=catches.filter(c=>c.fishName===UNKNOWN_FISH);

  if(catches.length===0){
    return (
      <div style={{padding:"16px 14px"}}>
        <HomeStepHeader step={step} onClose={onClose}/>
        <div style={{textAlign:"center",padding:"48px 20px",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
          持ち帰った魚がまだ登録されていません。
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:"16px 14px",paddingBottom:80}}>
      <HomeStepHeader step={step} onClose={onClose}/>
      <div style={{fontSize:12,color:"#6a9bb8",marginBottom:14}}>{tripLabel}</div>

      {(step===1||step===2)&&(
        <div>
          <div style={{fontSize:13,color:"#d0e8f5",marginBottom:12,lineHeight:1.7}}>
            持ち帰った魚を確認し、魚種が違っていれば修正してください。
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {catches.map(c=>(
              <div key={c.id} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px"}}>
                <Field label="魚種">
                  <Sel value={c.fishName} onChange={e=>onUpdateCatch(c.id,{fishName:e.target.value})}>
                    {fishMaster.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
                    <option value={UNKNOWN_FISH}>❓ {UNKNOWN_FISH}</option>
                  </Sel>
                </Field>
                <div style={{fontSize:12,color:"#6a9bb8"}}>{c.count}匹{c.sizeCm?`・${c.sizeCm}cm`:""}</div>
                {c.fishName===UNKNOWN_FISH&&<div style={{marginTop:8}}><UnknownFishWarning/></div>}
              </div>
            ))}
          </div>
          <HomeStepNav step={step} onBack={()=>goTo(1)} onNext={()=>goTo(3)}/>
        </div>
      )}

      {step===3&&(
        <div>
          {unknownCatches.length>0&&<div style={{marginBottom:12}}><UnknownFishWarning/></div>}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {identifiedCatches.map(c=>{
              const fish=fishMaster.find(f=>f.name===c.fishName);
              const checked=c.homeProcessingChecked||[];
              const done=c.handlingStatus==="home_processed"||c.handlingStatus==="cooked";
              return (
                <div key={c.id} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px"}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:8}}>{c.fishName}（{c.count}匹）</div>
                  {fish?.homeProcessing?.map((s,i)=>(
                    <label key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#d0e8f5",padding:"5px 0"}}>
                      <input type="checkbox" checked={checked.includes(s)} disabled={done}
                        onChange={e=>{
                          const next=e.target.checked?[...checked,s]:checked.filter(x=>x!==s);
                          onUpdateCatch(c.id,{homeProcessingChecked:next});
                        }}
                        style={{accentColor:"#f5a623",width:16,height:16}}/>
                      {s}
                    </label>
                  ))}
                  {!done&&<button onClick={()=>onUpdateCatch(c.id,{handlingStatus:"home_processed"})}
                    style={{width:"100%",marginTop:8,padding:10,borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",
                      background:"rgba(245,166,35,0.15)",border:"1px solid rgba(245,166,35,0.4)",color:"#f5a623"}}>
                    この魚の下処理完了
                  </button>}
                  {done&&<div style={{fontSize:12,color:"#2ecc87",marginTop:6,fontWeight:700}}>✅ 下処理済み</div>}
                </div>
              );
            })}
          </div>
          <HomeStepNav step={step} onBack={()=>goTo(2)} onNext={()=>goTo(4)}/>
        </div>
      )}

      {step===4&&(
        <div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {identifiedCatches.map(c=>{
              const fish=fishMaster.find(f=>f.name===c.fishName);
              return (
                <div key={c.id} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px"}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:6}}>{c.fishName}</div>
                  <div style={{fontSize:13,color:"#d0e8f5",lineHeight:1.7}}>{fish?.chilling||"—"}</div>
                </div>
              );
            })}
            {unknownCatches.length>0&&<UnknownFishWarning/>}
          </div>
          <HomeStepNav step={step} onBack={()=>goTo(3)} onNext={()=>goTo(5)}/>
        </div>
      )}

      {step===5&&(
        <div>
          {identifiedCatches.length===0?(
            <UnknownFishWarning/>
          ):identifiedCatches.map(c=>{
            const fish=fishMaster.find(f=>f.name===c.fishName);
            const matched=recommendRecipes(recipes,c.fishName,c.sizeCm);
            return (
              <div key={c.id} style={{marginBottom:14}}>
                <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:8}}>{c.fishName} のおすすめ料理</div>
                {matched.length>0?(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {matched.map(r=>(
                      <button key={r.id} onClick={()=>onUpdateProgress({selectedRecipeId:r.id,customDishName:""})}
                        style={{textAlign:"left",padding:"12px 14px",borderRadius:10,cursor:"pointer",
                          background:progress.selectedRecipeId===r.id?"rgba(245,166,35,0.2)":"rgba(255,255,255,0.06)",
                          border:`1px solid ${progress.selectedRecipeId===r.id?"#f5a623":"rgba(255,255,255,0.1)"}`}}>
                        <div style={{fontSize:14,fontWeight:700,color:progress.selectedRecipeId===r.id?"#f5a623":"#fff"}}>{r.name}</div>
                        <div style={{fontSize:11,color:"#6a9bb8",marginTop:2}}>{r.suitableSize}・{r.difficulty}・{r.cookingTime}</div>
                        {progress.selectedRecipeId===r.id&&(
                          <div style={{marginTop:8,fontSize:12,color:"#d0e8f5",lineHeight:1.7}}>
                            <div style={{color:"#6a9bb8",marginBottom:4}}>下準備：{r.preparation}</div>
                            <ol style={{paddingLeft:18}}>{r.steps.map((s,i)=><li key={i}>{s}</li>)}</ol>
                          </div>
                        )}
                      </button>
                    ))}
                  </div>
                ):(
                  <div style={{fontSize:12,color:"#6a9bb8",lineHeight:1.7}}>
                    詳しいレシピは未登録です。参考候補：{fish?.recommendedRecipes?.join("、")||"—"}
                  </div>
                )}
              </div>
            );
          })}
          <Field label="料理名（レシピが無い場合など自由入力）">
            <Input placeholder="例：塩焼き" value={progress.customDishName}
              onChange={e=>onUpdateProgress({customDishName:e.target.value,selectedRecipeId:e.target.value?null:progress.selectedRecipeId})}/>
          </Field>
          <HomeStepNav step={step} onBack={()=>goTo(4)} onNext={()=>goTo(6)}/>
        </div>
      )}

      {step===6&&(
        <div>
          <div style={{fontSize:13,color:"#d0e8f5",lineHeight:1.7,marginBottom:14}}>
            {progress.selectedRecipeId
              ? `「${recipes.find(r=>r.id===progress.selectedRecipeId)?.name||""}」`
              : progress.customDishName?`「${progress.customDishName}」`:"料理"}
            が完成したら押してください。
          </div>
          <button onClick={()=>{
              identifiedCatches.forEach(c=>onUpdateCatch(c.id,{handlingStatus:"cooked"}));
              onUpdateProgress({cookedAt:Date.now(),step:7});
            }}
            style={{width:"100%",padding:16,borderRadius:12,fontSize:16,fontWeight:700,cursor:"pointer",
              background:"#f5a623",border:"none",color:"#1a0a00"}}>
            🍳 調理済みにする
          </button>
          <HomeStepNav step={step} onBack={()=>goTo(5)} onNext={()=>goTo(7)} nextLabel="食後評価へ →"/>
        </div>
      )}

      {step===7&&(
        <HomeStepMealReview
          dishName={progress.selectedRecipeId?recipes.find(r=>r.id===progress.selectedRecipeId)?.name:progress.customDishName}
          fishNames={identifiedCatches.map(c=>c.fishName).join("、")}
          recipeId={progress.selectedRecipeId}
          onBack={()=>goTo(6)}
          onSave={onSaveMeal}/>
      )}
    </div>
  );
}

function HomeStepMealReview({dishName,fishNames,recipeId,onBack,onSave}){
  const [tasteRating,setTasteRating]=useState(0);
  const [easeRating,setEaseRating]=useState(0);
  const [eatAgain,setEatAgain]=useState(true);
  const [wantToCatchAgain,setWantToCatchAgain]=useState(true);
  const [note,setNote]=useState("");

  const handleSave=()=>{
    onSave({recipeId:recipeId||null,fishName:fishNames,dishName:dishName||"",
      tasteRating,easeRating,eatAgain,wantToCatchAgain,note,eatenAt:Date.now()});
  };

  return (
    <div>
      <div style={{fontSize:13,color:"#d0e8f5",marginBottom:12}}>{dishName||"（料理名未設定）"}・{fishNames}</div>
      <Field label="美味しさ"><StarPicker value={tasteRating} onChange={setTasteRating}/></Field>
      <Field label="作りやすさ"><StarPicker value={easeRating} onChange={setEaseRating}/></Field>
      <Field label="また食べたい">
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEatAgain(true)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:eatAgain?"rgba(46,204,135,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${eatAgain?"#2ecc87":"rgba(255,255,255,0.15)"}`,color:eatAgain?"#2ecc87":"#6a9bb8"}}>はい</button>
          <button onClick={()=>setEatAgain(false)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:!eatAgain?"rgba(232,76,61,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${!eatAgain?"#e84c3d":"rgba(255,255,255,0.15)"}`,color:!eatAgain?"#e84c3d":"#6a9bb8"}}>いいえ</button>
        </div>
      </Field>
      <Field label="またこの魚を釣りたい">
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setWantToCatchAgain(true)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:wantToCatchAgain?"rgba(46,204,135,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${wantToCatchAgain?"#2ecc87":"rgba(255,255,255,0.15)"}`,color:wantToCatchAgain?"#2ecc87":"#6a9bb8"}}>はい</button>
          <button onClick={()=>setWantToCatchAgain(false)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:!wantToCatchAgain?"rgba(232,76,61,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${!wantToCatchAgain?"#e84c3d":"rgba(255,255,255,0.15)"}`,color:!wantToCatchAgain?"#e84c3d":"#6a9bb8"}}>いいえ</button>
        </div>
      </Field>
      <Field label="感想"><Textarea value={note} onChange={e=>setNote(e.target.value)}/></Field>
      <HomeStepNav step={7} onBack={onBack} onNext={handleSave} nextLabel="💾 評価を保存して終了"/>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState(()=>loadStore(SESSION_KEY,{schemaVersion:1,session:null}).session?"today":"spots");
  const [activeSession,setActiveSession]=useState(()=>loadStore(SESSION_KEY,{schemaVersion:1,session:null}).session);
  const [trips,setTrips]=useState(()=>loadStore(TRIPS_KEY,{schemaVersion:1,trips:[]}).trips);
  const [gearTemplates,setGearTemplates]=useState(()=>{
    const store=loadStore(GEAR_KEY,null);
    if(store===null){ saveStore(GEAR_KEY,{schemaVersion:1,templates:SEED_GEAR_TEMPLATES}); return SEED_GEAR_TEMPLATES; }
    return store.templates;
  });
  const [rigGuides,setRigGuides]=useState(()=>{
    const store=loadStore(RIGGUIDE_KEY,null);
    if(store===null){ saveStore(RIGGUIDE_KEY,{schemaVersion:1,guides:SEED_RIG_GUIDES}); return SEED_RIG_GUIDES; }
    return store.guides;
  });
  const [catches,setCatches]=useState(()=>loadStore(CATCHES_KEY,{schemaVersion:1,catches:[]}).catches);
  const [fishMaster,setFishMaster]=useState(()=>{
    const store=loadStore(FISHMASTER_KEY,null);
    if(store===null){ saveStore(FISHMASTER_KEY,{schemaVersion:1,fish:SEED_FISH_MASTER}); return SEED_FISH_MASTER; }
    return store.fish;
  });
  const [recipes,setRecipes]=useState(()=>{
    const store=loadStore(RECIPES_KEY,null);
    if(store===null){ saveStore(RECIPES_KEY,{schemaVersion:1,recipes:SEED_RECIPES}); return SEED_RECIPES; }
    return store.recipes;
  });
  const [meals,setMeals]=useState(()=>loadStore(MEALS_KEY,{schemaVersion:1,meals:[]}).meals);
  const [homeProgress,setHomeProgress]=useState(()=>loadStore(HOMEPROGRESS_KEY,{schemaVersion:1,progress:{}}).progress);
  const [homeModeTripId,setHomeModeTripId]=useState(null);
  const [homeModeTripLabel,setHomeModeTripLabel]=useState("");
  const [targetProfiles,setTargetProfiles]=useState(()=>{
    const store=loadStore(TARGET_PROFILES_KEY,null);
    if(store===null){ saveStore(TARGET_PROFILES_KEY,{schemaVersion:1,profiles:SEED_TARGET_PROFILES}); return SEED_TARGET_PROFILES; }
    return store.profiles;
  });
  const [gearProfile,setGearProfile]=useState(()=>{
    const store=loadStore(GEARPROFILE_KEY,null);
    if(store===null){ saveStore(GEARPROFILE_KEY,{schemaVersion:1,...SEED_GEAR_PROFILE}); return SEED_GEAR_PROFILE; }
    return store;
  });
  const [externalReports,setExternalReports]=useState([]);
  const [reportsError,setReportsError]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    fetch(REPORTS_URL).then(res=>{
      if(!res.ok) throw new Error("fetch failed");
      return res.json();
    }).then(data=>{
      if(!cancelled) setExternalReports(Array.isArray(data.reports)?data.reports:[]);
    }).catch(()=>{
      if(!cancelled){ setExternalReports([]); setReportsError(true); }
    });
    return ()=>{ cancelled=true; };
  },[]);

  useEffect(()=>{ saveStore(TARGET_PROFILES_KEY,{schemaVersion:1,profiles:targetProfiles}); },[targetProfiles]);
  useEffect(()=>{ saveStore(GEARPROFILE_KEY,gearProfile); },[gearProfile]);

  useEffect(()=>{ saveStore(SESSION_KEY,{schemaVersion:1,session:activeSession}); },[activeSession]);
  useEffect(()=>{ saveStore(TRIPS_KEY,{schemaVersion:1,trips}); },[trips]);
  useEffect(()=>{ saveStore(GEAR_KEY,{schemaVersion:1,templates:gearTemplates}); },[gearTemplates]);
  useEffect(()=>{ saveStore(RIGGUIDE_KEY,{schemaVersion:1,guides:rigGuides}); },[rigGuides]);
  useEffect(()=>{ saveStore(CATCHES_KEY,{schemaVersion:1,catches}); },[catches]);
  useEffect(()=>{ saveStore(FISHMASTER_KEY,{schemaVersion:1,fish:fishMaster}); },[fishMaster]);
  useEffect(()=>{ saveStore(RECIPES_KEY,{schemaVersion:1,recipes}); },[recipes]);
  useEffect(()=>{ saveStore(MEALS_KEY,{schemaVersion:1,meals}); },[meals]);
  useEffect(()=>{ saveStore(HOMEPROGRESS_KEY,{schemaVersion:1,progress:homeProgress}); },[homeProgress]);

  const handleStartFishing=spot=>{
    if(activeSession&&!confirm("進行中のセッションがあります。終了して新しく開始しますか？"))return;
    setActiveSession({...EMPTY_TRIP,id:uid(),spotId:spot.id,spotName:spot.name,
      startAt:Date.now(),date:new Date().toISOString().slice(0,10)});
    setTab("today");
  };

  const handleLogEvent=(type,note)=>{
    setActiveSession(prev=>{
      if(!prev)return prev;
      const ev={id:uid(),ts:Date.now(),type,note:note||""};
      const next={...prev,events:[...prev.events,ev]};
      if(type==="bite")next.biteCount=(next.biteCount||0)+1;
      return next;
    });
  };

  const handleLogCatch=({fishName,count,kept})=>{
    if(!activeSession) return null;
    const rec={...EMPTY_CATCH,id:uid(),tripId:activeSession.id,caughtAt:Date.now(),
      fishName,count,kept,released:!kept,
      handlingStatus:kept?"pending":"released",
      createdAt:Date.now(),updatedAt:Date.now()};
    setCatches(prev=>[rec,...prev]);
    setActiveSession(prev=>{
      if(!prev)return prev;
      const ev={id:uid(),ts:Date.now(),type:"catch",note:`${fishName} ${count}匹（${kept?"持ち帰り":"リリース"}）`};
      return {...prev,events:[...prev.events,ev],catchCount:(prev.catchCount||0)+count};
    });
    return rec;
  };

  const handleUpdateCatch=(id,patch)=>{
    setCatches(prev=>prev.map(c=>c.id===id?{...c,...patch,updatedAt:Date.now()}:c));
  };
  const handleDeleteCatch=id=>{
    if(!confirm("この釣果を削除しますか？"))return;
    setCatches(prev=>prev.filter(c=>c.id!==id));
  };
  const handleAddCatchToTrip=(tripId,form)=>{
    const rec={...EMPTY_CATCH,...form,id:uid(),tripId,caughtAt:Date.now(),
      released:!form.kept,handlingStatus:form.kept?"pending":"released",
      createdAt:Date.now(),updatedAt:Date.now()};
    setCatches(prev=>[rec,...prev]);
  };

  const handleEndSession=review=>{
    setActiveSession(prev=>{
      if(!prev)return prev;
      const endAt=Date.now();
      const durationMin=prev.startAt?Math.round((endAt-prev.startAt)/60000):null;
      const finished={...prev,...review,endAt,durationMin,
        isBouzu:(prev.catchCount||0)===0,updatedAt:Date.now(),createdAt:prev.createdAt||Date.now()};
      setTrips(t=>[finished,...t]);
      return null;
    });
    setTab("trips");
  };

  const handleUpdateTrip=(id,form)=>{
    setTrips(prev=>prev.map(t=>t.id===id?{...t,...form,updatedAt:Date.now()}:t));
  };
  const handleDeleteTrip=id=>{
    if(!confirm("この釣行記録を削除しますか？"))return;
    setTrips(prev=>prev.filter(t=>t.id!==id));
  };

  const handleOpenHomeMode=(tripId,label)=>{
    setHomeModeTripId(tripId);
    setHomeModeTripLabel(label);
  };
  const handleCloseHomeMode=()=>setHomeModeTripId(null);
  const handleUpdateHomeProgress=patch=>{
    setHomeProgress(prev=>({...prev,[homeModeTripId]:{...DEFAULT_HOME_PROGRESS,...prev[homeModeTripId],...patch}}));
  };
  const handleSaveMeal=mealForm=>{
    const rec={id:uid(),tripId:homeModeTripId,...mealForm,createdAt:Date.now()};
    setMeals(prev=>[rec,...prev]);
    handleCloseHomeMode();
  };

  const recommendations=getTargetRecommendations({
    trips,catches,reports:externalReports,targetProfiles,gearProfile,now:Date.now(),
  });

  return (
    <div style={{background:"#061a2e",minHeight:"100vh",color:"#d0e8f5",paddingBottom:64}}>
      {homeModeTripId?(
        <HomeModeView tripId={homeModeTripId} tripLabel={homeModeTripLabel}
          catches={catches.filter(c=>c.tripId===homeModeTripId&&c.kept)}
          fishMaster={fishMaster} recipes={recipes}
          progress={homeProgress[homeModeTripId]||DEFAULT_HOME_PROGRESS}
          onUpdateProgress={handleUpdateHomeProgress}
          onUpdateCatch={handleUpdateCatch}
          onSaveMeal={handleSaveMeal}
          onClose={handleCloseHomeMode}/>
      ):(
        <>
          {tab==="spots"&&<SpotsTab onStartFishing={handleStartFishing}/>}
          {tab==="today"&&<TodayFishingView activeSession={activeSession} catches={catches} fishMaster={fishMaster}
            recommendations={recommendations} reports={externalReports} reportsError={reportsError}
            onSwitchToSpots={()=>setTab("spots")}
            onLogEvent={handleLogEvent} onLogCatch={handleLogCatch} onUpdateCatch={handleUpdateCatch}
            onEndSession={handleEndSession}
            onOpenHomeMode={()=>activeSession&&handleOpenHomeMode(activeSession.id,`${activeSession.spotName||""} ${activeSession.date||""}`)}/>}
          {tab==="stats"&&<AnalyticsView trips={trips} catches={catches}/>}
          {tab==="trips"&&<TripLogView trips={trips} catches={catches} fishMaster={fishMaster}
            onUpdate={handleUpdateTrip} onDelete={handleDeleteTrip}
            onEditCatch={handleUpdateCatch} onDeleteCatch={handleDeleteCatch} onAddCatch={handleAddCatchToTrip}
            onOpenHomeMode={trip=>handleOpenHomeMode(trip.id,`${trip.spotName||""} ${trip.date||""}`)}/>}
          {tab==="gear"&&<GearTab gearTemplates={gearTemplates} setGearTemplates={setGearTemplates} rigGuides={rigGuides}/>}
        </>
      )}
      <BottomNav tab={tab} onChange={key=>{setHomeModeTripId(null);setTab(key);}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
