      </button>}
      <button onClick={onNext}
        style={{flex:1,background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>
        {nextLabel||"次へ →"}
      </button>
    </div>
  );
}

function HomeModeView({tripId,tripLabel,catches,fishMaster,recipes,progress,onUpdateProgress,onUpdateCatch,onSaveMeal,onClose}){
  const step=progress.step||1;
  const goTo=n=>onUpdateProgress({step:n});
  const identifiedCatches=catches.filter(c=>c.fishName!==UNKNOWN_FISH);
  const unknownCatches=catches.filter(c=>c.fishName===UNKNOWN_FISH);

  if(catches.length===0){
    return (
      <div style={{padding:"16px 14px"}}>
        <HomeStepHeader step={step} onClose={onClose}/>
        <div style={{textAlign:"center",padding:"48px 20px",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
          持ち帰った魚がまだ登録されていません。
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:"16px 14px",paddingBottom:80}}>
      <HomeStepHeader step={step} onClose={onClose}/>
      <div style={{fontSize:12,color:"#6a9bb8",marginBottom:14}}>{tripLabel}</div>

      {(step===1||step===2)&&(
        <div>
          <div style={{fontSize:13,color:"#d0e8f5",marginBottom:12,lineHeight:1.7}}>
            持ち帰った魚を確認し、魚種が違っていれば修正してください。
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {catches.map(c=>(
              <div key={c.id} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px"}}>
                <Field label="魚種">
                  <Sel value={c.fishName} onChange={e=>onUpdateCatch(c.id,{fishName:e.target.value})}>
                    {fishMaster.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
                    <option value={UNKNOWN_FISH}>❓ {UNKNOWN_FISH}</option>
                  </Sel>
                </Field>
                <div style={{fontSize:12,color:"#6a9bb8"}}>{c.count}匹{c.sizeCm?`・${c.sizeCm}cm`:""}</div>
                {c.fishName===UNKNOWN_FISH&&<div style={{marginTop:8}}><UnknownFishWarning/></div>}
              </div>
            ))}
          </div>
          <HomeStepNav step={step} onBack={()=>goTo(1)} onNext={()=>goTo(3)}/>
        </div>
      )}

      {step===3&&(
        <div>
          {unknownCatches.length>0&&<div style={{marginBottom:12}}><UnknownFishWarning/></div>}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {identifiedCatches.map(c=>{
              const fish=fishMaster.find(f=>f.name===c.fishName);
              const checked=c.homeProcessingChecked||[];
              const done=c.handlingStatus==="home_processed"||c.handlingStatus==="cooked";
              return (
                <div key={c.id} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px"}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:8}}>{c.fishName}（{c.count}匹）</div>
                  {fish?.homeProcessing?.map((s,i)=>(
                    <label key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"#d0e8f5",padding:"5px 0"}}>
                      <input type="checkbox" checked={checked.includes(s)} disabled={done}
                        onChange={e=>{
                          const next=e.target.checked?[...checked,s]:checked.filter(x=>x!==s);
                          onUpdateCatch(c.id,{homeProcessingChecked:next});
                        }}
                        style={{accentColor:"#f5a623",width:16,height:16}}/>
                      {s}
                    </label>
                  ))}
                  {!done&&<button onClick={()=>onUpdateCatch(c.id,{handlingStatus:"home_processed"})}
                    style={{width:"100%",marginTop:8,padding:10,borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",
                      background:"rgba(245,166,35,0.15)",border:"1px solid rgba(245,166,35,0.4)",color:"#f5a623"}}>
                    この魚の下処理完了
                  </button>}
                  {done&&<div style={{fontSize:12,color:"#2ecc87",marginTop:6,fontWeight:700}}>✅ 下処理済み</div>}
                </div>
              );
            })}
          </div>
          <HomeStepNav step={step} onBack={()=>goTo(2)} onNext={()=>goTo(4)}/>
        </div>
      )}

      {step===4&&(
        <div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {identifiedCatches.map(c=>{
              const fish=fishMaster.find(f=>f.name===c.fishName);
              return (
                <div key={c.id} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px"}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:6}}>{c.fishName}</div>
                  <div style={{fontSize:13,color:"#d0e8f5",lineHeight:1.7}}>{fish?.chilling||"—"}</div>
                </div>
              );
            })}
            {unknownCatches.length>0&&<UnknownFishWarning/>}
          </div>
          <HomeStepNav step={step} onBack={()=>goTo(3)} onNext={()=>goTo(5)}/>
        </div>
      )}

      {step===5&&(
        <div>
          {identifiedCatches.length===0?(
            <UnknownFishWarning/>
          ):identifiedCatches.map(c=>{
            const fish=fishMaster.find(f=>f.name===c.fishName);
            const matched=recommendRecipes(recipes,c.fishName,c.sizeCm);
            return (
              <div key={c.id} style={{marginBottom:14}}>
                <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:8}}>{c.fishName} のおすすめ料理</div>
                {matched.length>0?(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {matched.map(r=>(
                      <button key={r.id} onClick={()=>onUpdateProgress({selectedRecipeId:r.id,customDishName:""})}
                        style={{textAlign:"left",padding:"12px 14px",borderRadius:10,cursor:"pointer",
                          background:progress.selectedRecipeId===r.id?"rgba(245,166,35,0.2)":"rgba(255,255,255,0.06)",
                          border:`1px solid ${progress.selectedRecipeId===r.id?"#f5a623":"rgba(255,255,255,0.1)"}`}}>
                        <div style={{fontSize:14,fontWeight:700,color:progress.selectedRecipeId===r.id?"#f5a623":"#fff"}}>{r.name}</div>
                        <div style={{fontSize:11,color:"#6a9bb8",marginTop:2}}>{r.suitableSize}・{r.difficulty}・{r.cookingTime}</div>
                        {progress.selectedRecipeId===r.id&&(
                          <div style={{marginTop:8,fontSize:12,color:"#d0e8f5",lineHeight:1.7}}>
                            <div style={{color:"#6a9bb8",marginBottom:4}}>下準備：{r.preparation}</div>
                            <ol style={{paddingLeft:18}}>{r.steps.map((s,i)=><li key={i}>{s}</li>)}</ol>
                          </div>
                        )}
                      </button>
                    ))}
                  </div>
                ):(
                  <div style={{fontSize:12,color:"#6a9bb8",lineHeight:1.7}}>
                    詳しいレシピは未登録です。参考候補：{fish?.recommendedRecipes?.join("、")||"—"}
                  </div>
                )}
              </div>
            );
          })}
          <Field label="料理名（レシピが無い場合など自由入力）">
            <Input placeholder="例：塩焼き" value={progress.customDishName}
              onChange={e=>onUpdateProgress({customDishName:e.target.value,selectedRecipeId:e.target.value?null:progress.selectedRecipeId})}/>
          </Field>
          <HomeStepNav step={step} onBack={()=>goTo(4)} onNext={()=>goTo(6)}/>
        </div>
      )}

      {step===6&&(
        <div>
          <div style={{fontSize:13,color:"#d0e8f5",lineHeight:1.7,marginBottom:14}}>
            {progress.selectedRecipeId
              ? `「${recipes.find(r=>r.id===progress.selectedRecipeId)?.name||""}」`
              : progress.customDishName?`「${progress.customDishName}」`:"料理"}
            が完成したら押してください。
          </div>
          <button onClick={()=>{
              identifiedCatches.forEach(c=>onUpdateCatch(c.id,{handlingStatus:"cooked"}));
              onUpdateProgress({cookedAt:Date.now(),step:7});
            }}
            style={{width:"100%",padding:16,borderRadius:12,fontSize:16,fontWeight:700,cursor:"pointer",
              background:"#f5a623",border:"none",color:"#1a0a00"}}>
            🍳 調理済みにする
          </button>
          <HomeStepNav step={step} onBack={()=>goTo(5)} onNext={()=>goTo(7)} nextLabel="食後評価へ →"/>
        </div>
      )}

      {step===7&&(
        <HomeStepMealReview
          dishName={progress.selectedRecipeId?recipes.find(r=>r.id===progress.selectedRecipeId)?.name:progress.customDishName}
          fishNames={identifiedCatches.map(c=>c.fishName).join("、")}
          recipeId={progress.selectedRecipeId}
          onBack={()=>goTo(6)}
          onSave={onSaveMeal}/>
      )}
    </div>
  );
}

function HomeStepMealReview({dishName,fishNames,recipeId,onBack,onSave}){
  const [tasteRating,setTasteRating]=useState(0);
  const [easeRating,setEaseRating]=useState(0);
  const [eatAgain,setEatAgain]=useState(true);
  const [wantToCatchAgain,setWantToCatchAgain]=useState(true);
  const [note,setNote]=useState("");

  const handleSave=()=>{
    onSave({recipeId:recipeId||null,fishName:fishNames,dishName:dishName||"",
      tasteRating,easeRating,eatAgain,wantToCatchAgain,note,eatenAt:Date.now()});
  };

  return (
    <div>
      <div style={{fontSize:13,color:"#d0e8f5",marginBottom:12}}>{dishName||"（料理名未設定）"}・{fishNames}</div>
      <Field label="美味しさ"><StarPicker value={tasteRating} onChange={setTasteRating}/></Field>
      <Field label="作りやすさ"><StarPicker value={easeRating} onChange={setEaseRating}/></Field>
      <Field label="また食べたい">
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEatAgain(true)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:eatAgain?"rgba(46,204,135,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${eatAgain?"#2ecc87":"rgba(255,255,255,0.15)"}`,color:eatAgain?"#2ecc87":"#6a9bb8"}}>はい</button>
          <button onClick={()=>setEatAgain(false)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:!eatAgain?"rgba(232,76,61,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${!eatAgain?"#e84c3d":"rgba(255,255,255,0.15)"}`,color:!eatAgain?"#e84c3d":"#6a9bb8"}}>いいえ</button>
        </div>
      </Field>
      <Field label="またこの魚を釣りたい">
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setWantToCatchAgain(true)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:wantToCatchAgain?"rgba(46,204,135,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${wantToCatchAgain?"#2ecc87":"rgba(255,255,255,0.15)"}`,color:wantToCatchAgain?"#2ecc87":"#6a9bb8"}}>はい</button>
          <button onClick={()=>setWantToCatchAgain(false)}
            style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,
              background:!wantToCatchAgain?"rgba(232,76,61,0.2)":"rgba(255,255,255,0.06)",
              border:`1px solid ${!wantToCatchAgain?"#e84c3d":"rgba(255,255,255,0.15)"}`,color:!wantToCatchAgain?"#e84c3d":"#6a9bb8"}}>いいえ</button>
        </div>
      </Field>
      <Field label="感想"><Textarea value={note} onChange={e=>setNote(e.target.value)}/></Field>
      <HomeStepNav step={7} onBack={onBack} onNext={handleSave} nextLabel="💾 評価を保存して終了"/>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState(()=>loadStore(SESSION_KEY,{schemaVersion:1,session:null}).session?"today":"spots");
  const [activeSession,setActiveSession]=useState(()=>loadStore(SESSION_KEY,{schemaVersion:1,session:null}).session);
  const [trips,setTrips]=useState(()=>loadStore(TRIPS_KEY,{schemaVersion:1,trips:[]}).trips);
  const [gearTemplates,setGearTemplates]=useState(()=>{
    const store=loadStore(GEAR_KEY,null);
    if(store===null){ saveStore(GEAR_KEY,{schemaVersion:1,templates:SEED_GEAR_TEMPLATES}); return SEED_GEAR_TEMPLATES; }
    return store.templates;
  });
  const [rigGuides,setRigGuides]=useState(()=>{
    const store=loadStore(RIGGUIDE_KEY,null);
    if(store===null){ saveStore(RIGGUIDE_KEY,{schemaVersion:1,guides:SEED_RIG_GUIDES}); return SEED_RIG_GUIDES; }
    return store.guides;
  });
  const [catches,setCatches]=useState(()=>loadStore(CATCHES_KEY,{schemaVersion:1,catches:[]}).catches);
  const [fishMaster,setFishMaster]=useState(()=>{
    const store=loadStore(FISHMASTER_KEY,null);
    if(store===null){ saveStore(FISHMASTER_KEY,{schemaVersion:1,fish:SEED_FISH_MASTER}); return SEED_FISH_MASTER; }
    return store.fish;
  });
  const [recipes,setRecipes]=useState(()=>{
    const store=loadStore(RECIPES_KEY,null);
    if(store===null){ saveStore(RECIPES_KEY,{schemaVersion:1,recipes:SEED_RECIPES}); return SEED_RECIPES; }
    return store.recipes;
  });
  const [meals,setMeals]=useState(()=>loadStore(MEALS_KEY,{schemaVersion:1,meals:[]}).meals);
  const [homeProgress,setHomeProgress]=useState(()=>loadStore(HOMEPROGRESS_KEY,{schemaVersion:1,progress:{}}).progress);
  const [homeModeTripId,setHomeModeTripId]=useState(null);
  const [homeModeTripLabel,setHomeModeTripLabel]=useState("");
  const [targetProfiles,setTargetProfiles]=useState(()=>{
    const store=loadStore(TARGET_PROFILES_KEY,null);
    if(store===null){ saveStore(TARGET_PROFILES_KEY,{schemaVersion:1,profiles:SEED_TARGET_PROFILES}); return SEED_TARGET_PROFILES; }
    return store.profiles;
  });
  const [gearProfile,setGearProfile]=useState(()=>{
    const store=loadStore(GEARPROFILE_KEY,null);
    if(store===null){ saveStore(GEARPROFILE_KEY,{schemaVersion:1,...SEED_GEAR_PROFILE}); return SEED_GEAR_PROFILE; }
    return store;
  });
  const [externalReports,setExternalReports]=useState([]);
  const [reportsError,setReportsError]=useState(false);
  const [reportsMalformed,setReportsMalformed]=useState(false);
  const [reportsUpdatedAt,setReportsUpdatedAt]=useState(null);
  const [todayConditions,setTodayConditions]=useState(()=>loadStore(TODAYCONDITIONS_KEY,EMPTY_TODAY_CONDITIONS));
  const [conditionsCache,setConditionsCache]=useState(()=>loadStore(CONDITIONS_CACHE_KEY,null));
  const [autoFetchStatus,setAutoFetchStatus]=useState({loading:false,error:null});
  const [tideCache,setTideCache]=useState(()=>loadStore(TIDE_CACHE_KEY,null));
  const [autoTideStatus,setAutoTideStatus]=useState({loading:false,error:null});
  const [planCandidates,setPlanCandidates]=useState(()=>loadStore(PLAN_CANDIDATES_KEY,{schemaVersion:1,candidates:[],updatedAt:null}).candidates);
  const [planForecastCache,setPlanForecastCache]=useState(()=>loadStore(PLAN_FORECAST_CACHE_KEY,{schemaVersion:1,entries:{}}));
  const [planFetchStatus,setPlanFetchStatus]=useState({loading:false,error:null});
  const [adoptedPlan,setAdoptedPlan]=useState(null);
  const [morningCheck,setMorningCheck]=useState(()=>loadStore(MORNING_CHECK_KEY,null));
  const [morningCheckStatus,setMorningCheckStatus]=useState({loading:false,error:null});

  useEffect(()=>{
    let cancelled=false;
    fetch(REPORTS_URL).then(res=>{
      if(!res.ok) throw new Error("fetch failed");
      return res.json();
    }).then(data=>{
      if(cancelled) return;
      const sanitized=sanitizeReportsPayload(data);
      if(sanitized===null){ setExternalReports([]); setReportsMalformed(true); return; }
      setExternalReports(sanitized.reports);
      setReportsUpdatedAt(sanitized.updatedAt);
      if(sanitized.malformedCount>0) setReportsMalformed(true);
    }).catch(()=>{
      if(!cancelled){ setExternalReports([]); setReportsError(true); }
    });
    return ()=>{ cancelled=true; };
  },[]);

  useEffect(()=>{ saveStore(TARGET_PROFILES_KEY,{schemaVersion:1,profiles:targetProfiles}); },[targetProfiles]);
  useEffect(()=>{ saveStore(GEARPROFILE_KEY,gearProfile); },[gearProfile]);
  useEffect(()=>{ saveStore(TODAYCONDITIONS_KEY,todayConditions); },[todayConditions]);
  useEffect(()=>{ if(conditionsCache) saveStore(CONDITIONS_CACHE_KEY,conditionsCache); },[conditionsCache]);
  useEffect(()=>{ if(tideCache) saveStore(TIDE_CACHE_KEY,tideCache); },[tideCache]);
  useEffect(()=>{ saveStore(PLAN_CANDIDATES_KEY,{schemaVersion:1,candidates:planCandidates,updatedAt:Date.now()}); },[planCandidates]);
  useEffect(()=>{ saveStore(PLAN_FORECAST_CACHE_KEY,planForecastCache); },[planForecastCache]);
  useEffect(()=>{ if(morningCheck) saveStore(MORNING_CHECK_KEY,morningCheck); },[morningCheck]);

  useEffect(()=>{ saveStore(SESSION_KEY,{schemaVersion:1,session:activeSession}); },[activeSession]);
  useEffect(()=>{ saveStore(TRIPS_KEY,{schemaVersion:1,trips}); },[trips]);
  useEffect(()=>{ saveStore(GEAR_KEY,{schemaVersion:1,templates:gearTemplates}); },[gearTemplates]);
  useEffect(()=>{ saveStore(RIGGUIDE_KEY,{schemaVersion:1,guides:rigGuides}); },[rigGuides]);
  useEffect(()=>{ saveStore(CATCHES_KEY,{schemaVersion:1,catches}); },[catches]);
  useEffect(()=>{ saveStore(FISHMASTER_KEY,{schemaVersion:1,fish:fishMaster}); },[fishMaster]);
  useEffect(()=>{ saveStore(RECIPES_KEY,{schemaVersion:1,recipes}); },[recipes]);
  useEffect(()=>{ saveStore(MEALS_KEY,{schemaVersion:1,meals}); },[meals]);
  useEffect(()=>{ saveStore(HOMEPROGRESS_KEY,{schemaVersion:1,progress:homeProgress}); },[homeProgress]);

  const handleStartFishing=(spot,extra)=>{
    if(activeSession&&!confirm("進行中のセッションがあります。終了して新しく開始しますか？"))return;
    const today=new Date().toISOString().slice(0,10);
    const inherited=todayConditions.date===today?{
      weather:todayConditions.weather||"",
      tide:todayConditions.tideType||"",
      tideDirection:todayConditions.tideDirection||"",
      turbidity:todayConditions.turbidity||"",
      wind:todayConditions.windDirection&&todayConditions.windSpeedMs
        ?`${todayConditions.windDirection} ${todayConditions.windSpeedMs}m/s`:(todayConditions.windDirection||""),
      waves:todayConditions.wave||"",
    }:{};
    setActiveSession({...EMPTY_TRIP,...inherited,...(extra||{}),id:uid(),spotId:spot.id,spotName:spot.name,
      startAt:Date.now(),date:today});
    setTab("today");
  };

  const handleSaveSkipLog=log=>{
    const store=loadStore(SKIP_LOGS_KEY,{schemaVersion:1,logs:[]});
    const rec={id:uid(),createdAt:Date.now(),...log};
    saveStore(SKIP_LOGS_KEY,{schemaVersion:1,logs:[rec,...store.logs]});
  };

  const handleLogEvent=(type,note)=>{
    setActiveSession(prev=>{
      if(!prev)return prev;
      const ev={id:uid(),ts:Date.now(),type,note:note||""};
      const next={...prev,events:[...prev.events,ev]};
      if(type==="bite")next.biteCount=(next.biteCount||0)+1;
      return next;
    });
  };

  const handleLogCatch=({fishName,count,kept})=>{
    if(!activeSession) return null;
    const rec={...EMPTY_CATCH,id:uid(),tripId:activeSession.id,caughtAt:Date.now(),
      fishName,count,kept,released:!kept,
      handlingStatus:kept?"pending":"released",
      createdAt:Date.now(),updatedAt:Date.now()};
    setCatches(prev=>[rec,...prev]);
    setActiveSession(prev=>{
      if(!prev)return prev;
      const ev={id:uid(),ts:Date.now(),type:"catch",note:`${fishName} ${count}匹（${kept?"持ち帰り":"リリース"}）`};
      return {...prev,events:[...prev.events,ev],catchCount:(prev.catchCount||0)+count};
    });
    return rec;
  };

  const handleUpdateCatch=(id,patch)=>{
    setCatches(prev=>prev.map(c=>c.id===id?{...c,...patch,updatedAt:Date.now()}:c));
  };
  const handleDeleteCatch=id=>{
    if(!confirm("この釣果を削除しますか？"))return;
    setCatches(prev=>prev.filter(c=>c.id!==id));
  };
  const handleAddCatchToTrip=(tripId,form)=>{
    const rec={...EMPTY_CATCH,...form,id:uid(),tripId,caughtAt:Date.now(),
      released:!form.kept,handlingStatus:form.kept?"pending":"released",
      createdAt:Date.now(),updatedAt:Date.now()};
    setCatches(prev=>[rec,...prev]);
  };

  const handleEndSession=review=>{
    setActiveSession(prev=>{
      if(!prev)return prev;
      const endAt=Date.now();
      const durationMin=prev.startAt?Math.round((endAt-prev.startAt)/60000):null;
      const finished={...prev,...review,endAt,durationMin,
        isBouzu:(prev.catchCount||0)===0,updatedAt:Date.now(),createdAt:prev.createdAt||Date.now()};
      setTrips(t=>[finished,...t]);
      return null;
    });
    setTab("trips");
  };

  const handleUpdateTrip=(id,form)=>{
    setTrips(prev=>prev.map(t=>t.id===id?{...t,...form,updatedAt:Date.now()}:t));
  };
  const handleDeleteTrip=id=>{
    if(!confirm("この釣行記録を削除しますか？"))return;
    setTrips(prev=>prev.filter(t=>t.id!==id));
  };

  const handleOpenHomeMode=(tripId,label)=>{
    setHomeModeTripId(tripId);
    setHomeModeTripLabel(label);
  };
  const handleCloseHomeMode=()=>setHomeModeTripId(null);
  const handleUpdateHomeProgress=patch=>{
    setHomeProgress(prev=>({...prev,[homeModeTripId]:{...DEFAULT_HOME_PROGRESS,...prev[homeModeTripId],...patch}}));
  };
  const handleSaveMeal=mealForm=>{
    const rec={id:uid(),tripId:homeModeTripId,...mealForm,createdAt:Date.now()};
    setMeals(prev=>[rec,...prev]);
    handleCloseHomeMode();
  };

  const handleSaveTodayConditions=patch=>setTodayConditions(patch);
  const handleResetTodayConditions=()=>setTodayConditions(EMPTY_TODAY_CONDITIONS);

  const handleFetchAutoConditions=async({spot,forecastForMs,planDateStr,planTimeStr})=>{
    if(!spot||!spot.lat||!spot.lng){
      setAutoFetchStatus({loading:false,error:"自動取得にはポイントの緯度経度が必要です"});
      return;
    }
    setAutoFetchStatus({loading:true,error:null});
    try{
      const {weather,marine,weatherError,marineError}=await fetchAutoConditions({lat:spot.lat,lng:spot.lng,forecastForMs});
      if(!weather&&!marine){
        setAutoFetchStatus({loading:false,error:"自動取得できませんでした。手入力のまま利用できます。"});
        return;
      }
      setConditionsCache({schemaVersion:1,fetchedAt:Date.now(),forecastFor:forecastForMs,
        spotId:spot.id,latitude:spot.lat,longitude:spot.lng,weather,marine,weatherError,marineError});

      const autoVals=buildAutoFieldValues(weather,marine);
      setTodayConditions(prev=>{
        const base=isConditionsActive(prev.date,todayStr)?prev:{...EMPTY_TODAY_CONDITIONS,date:planDateStr};
        const anyManualBefore=["weather","temperatureC","windDirection","windSpeedMs","wave","tideDirection"].some(k=>base[k]);
        const {next,filledFromAuto}=mergeConditionsWithAuto(base,autoVals,{overwrite:false});
        if(filledFromAuto.length===0) return {...base,date:base.date||planDateStr,plannedStartTime:base.plannedStartTime||planTimeStr};
        return {...next,date:next.date||planDateStr,plannedStartTime:next.plannedStartTime||planTimeStr,
          source:anyManualBefore?"mixed":"auto",updatedAt:Date.now()};
      });
      setAutoFetchStatus({loading:false,error:null});
    }catch(e){
      setAutoFetchStatus({loading:false,error:"自動取得できませんでした。手入力のまま利用できます。"});
    }
  };

  const handleApplyAutoField=(field,value)=>{
    setTodayConditions(prev=>({...prev,[field]:value,source:"mixed",updatedAt:Date.now()}));
  };

  const handleFetchTide=async({stationId,stationName,dateStr,planTimeStr})=>{
    if(!stationId){
      setAutoTideStatus({loading:false,error:"潮汐取得には観測地点の設定が必要です"});
      return;
    }
    setAutoTideStatus({loading:true,error:null});
    try{
      const {highs,lows}=await fetchOfficialTide({stationId,dateStr});
      setTideCache({schemaVersion:1,fetchedAt:Date.now(),date:dateStr,stationId,stationName,
        sourceName:"気象庁",sourceUrl:TIDE_SOURCE_PAGE_URL,
        highs,lows,forecastFor:dateStr,sourceType:"official"});

      const rel=computeTideRelation(planTimeStr,highs,lows);
      if(rel&&rel.direction){
        setTodayConditions(prev=>{
          const base=isConditionsActive(prev.date,todayStr)?prev:{...EMPTY_TODAY_CONDITIONS,date:dateStr};
          if(base.tideDirection) return base; // 手入力済みの潮の動きは無断上書きしない
          const anyManualBefore=["weather","temperatureC","windDirection","windSpeedMs","wave","tideDirection"].some(k=>base[k]);
          return {...base,date:base.date||dateStr,tideDirection:rel.direction,
            source:anyManualBefore?"mixed":(base.source==="manual"?"auto":(base.source||"auto")),updatedAt:Date.now()};
        });
      }
      setAutoTideStatus({loading:false,error:null});
    }catch(e){
      setAutoTideStatus({loading:false,error:"潮汐情報を取得できませんでした。気象庁の潮位表で確認するか、手入力してください。"});
    }
  };

  const todayStr=new Date().toISOString().slice(0,10);
  const effectiveTodayConditions=isConditionsActive(todayConditions.date,todayStr)?todayConditions:null;
  const currentSpots=loadStore(LS_KEY,[]);

  const handleAddPlanCandidate=()=>{
    setPlanCandidates(prev=>{
      if(prev.length>=MAX_PLAN_CANDIDATES) return prev;
      const tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
      return [...prev,{...EMPTY_PLAN_CANDIDATE,id:uid(),date:tomorrow}];
    });
  };
  const handleUpdatePlanCandidate=(id,patch)=>{
    setPlanCandidates(prev=>prev.map(c=>c.id===id?{...c,...patch}:c));
  };
  const handleDeletePlanCandidate=id=>{
    setPlanCandidates(prev=>prev.filter(c=>c.id!==id));
  };
  const handleDuplicatePlanCandidate=id=>{
    setPlanCandidates(prev=>{
      if(prev.length>=MAX_PLAN_CANDIDATES) return prev;
      const src=prev.find(c=>c.id===id);
      if(!src) return prev;
      return [...prev,{...src,id:uid()}];
    });
  };

  const handleFetchOnePlanForecast=async(candidate)=>{
    const spot=currentSpots.find(s=>s.id===candidate.spotId);
    if(!spot||!spot.lat||!spot.lng){
      setPlanFetchStatus({loading:false,error:"予報取得にはポイントの緯度経度が必要です"});
      return;
    }
    if(!isWithinForecastHorizon(candidate.date,todayStr)){
      setPlanFetchStatus({loading:false,error:"まだ予報対象期間外です"});
      return;
    }
    setPlanFetchStatus({loading:true,error:null});
    try{
      const forecastForMs=computeForecastForMs(candidate.date,candidate.startTime);
      const {weather,marine,weatherError,marineError}=await fetchAutoConditions({lat:spot.lat,lng:spot.lng,forecastForMs});
      const key=planForecastCacheKey(spot.id,forecastForMs);
      setPlanForecastCache(prev=>({schemaVersion:1,entries:{...prev.entries,[key]:{
        fetchedAt:Date.now(),forecastFor:forecastForMs,spotId:spot.id,latitude:spot.lat,longitude:spot.lng,
        weather,marine,weatherError,marineError}}}));
      setPlanFetchStatus({loading:false,error:null});
    }catch(e){
      setPlanFetchStatus({loading:false,error:"予報を取得できませんでした。"});
    }
  };

  const handleFetchAllPlanForecasts=async()=>{
    for(const c of planCandidates){
      if(!c.spotId||isPastPlanDate(c.date,todayStr)) continue;
      await handleFetchOnePlanForecast(c);
    }
  };

  // 比較画面用の潮汐取得。Phase9のhandleFetchTideとは違い、today_conditionsへは一切書き込まない
  // （比較中に候補を見ただけで今日の条件が変わってしまうのを防ぐ。反映は「採用」時のみ）。
  const handleFetchPlanTide=(candidate)=>{
    const spot=currentSpots.find(s=>s.id===candidate.spotId);
    if(!spot||!spot.tideStationId){
      setAutoTideStatus({loading:false,error:"潮汐取得には観測地点の設定が必要です"});
      return;
    }
    setAutoTideStatus({loading:true,error:null});
    fetchOfficialTide({stationId:spot.tideStationId,dateStr:candidate.date}).then(({highs,lows})=>{
      setTideCache({schemaVersion:1,fetchedAt:Date.now(),date:candidate.date,stationId:spot.tideStationId,stationName:spot.tideStationName,
        sourceName:"気象庁",sourceUrl:TIDE_SOURCE_PAGE_URL,highs,lows,forecastFor:candidate.date,sourceType:"official"});
      setAutoTideStatus({loading:false,error:null});
    }).catch(()=>{
      setAutoTideStatus({loading:false,error:"潮汐情報を取得できませんでした。気象庁の潮位表で確認するか、手入力してください。"});
    });
  };

  const handleAdoptPlanCandidate=(candidate,opts)=>{
    const applyForecast=!!(opts&&opts.applyForecast);
    const spot=currentSpots.find(s=>s.id===candidate.spotId);
    setTodayConditions(prev=>{
      let merged={...prev,date:candidate.date,plannedStartTime:candidate.startTime,plannedDurationMin:candidate.durationMin,
        spotId:candidate.spotId||"",targetFish:candidate.targetFish||""};
      if(applyForecast&&spot){
        const forecastForMs=computeForecastForMs(candidate.date,candidate.startTime);
        const key=planForecastCacheKey(spot.id,forecastForMs);
        const entry=planForecastCache.entries[key];
        if(entry&&entry.forecastFor===forecastForMs&&(entry.weather||entry.marine)){
          const autoVals=buildAutoFieldValues(entry.weather,entry.marine);
          const anyManualBefore=["weather","temperatureC","windDirection","windSpeedMs","wave","tideDirection"].some(k=>merged[k]);
          const {next,filledFromAuto}=mergeConditionsWithAuto(merged,autoVals,{overwrite:false});
          if(filledFromAuto.length>0){
            merged={...next,source:anyManualBefore?"mixed":(merged.source==="manual"?"auto":(merged.source||"auto"))};
          }
        }
        if(tideCache&&tideCache.stationId===spot.tideStationId&&tideCache.date===candidate.date&&!merged.tideDirection){
          const rel=computeTideRelation(candidate.startTime,tideCache.highs,tideCache.lows);
          if(rel&&rel.direction){
            const anyManualBefore=["weather","temperatureC","windDirection","windSpeedMs","wave"].some(k=>merged[k]);
            merged={...merged,tideDirection:rel.direction,source:anyManualBefore?"mixed":(merged.source==="manual"?"auto":(merged.source||"auto"))};
          }
        }
      }
      return {...merged,updatedAt:Date.now()};
    });
    setAdoptedPlan({fishName:candidate.targetFish||null,spotId:candidate.spotId||null,nonce:Date.now()});
  };

  // Phase11: 朝チェックの「🔄 最新条件を確認」。Phase8のfetchAutoConditions・Phase9のtide関連ヘルパーを再利用し、
  // 別のfetch実装は作らない。取得前の値を previousSnapshot として退避してから最新値を latestSnapshot に入れる。
  const handleMorningCheckFetch=async()=>{
    const spot=currentSpots.find(s=>s.id===todayConditions.spotId);
    if(!spot||!spot.lat||!spot.lng){
      setMorningCheckStatus({loading:false,error:"予報取得にはポイントの緯度経度が必要です"});
      return;
    }
    const forecastForMs=computeForecastForMs(todayConditions.date,todayConditions.plannedStartTime);
    const planKey=computePlanKey(spot.id,todayConditions.date,todayConditions.plannedStartTime,todayConditions.targetFish);

    let previousSnapshot=null;
    if(conditionsCache&&conditionsCache.spotId===spot.id&&conditionsCache.forecastFor===forecastForMs){
      previousSnapshot=buildMorningSnapshot(conditionsCache.weather,conditionsCache.marine);
    }else if(morningCheck&&morningCheck.planKey===planKey&&morningCheck.latestSnapshot){
      previousSnapshot=morningCheck.latestSnapshot;
    }else{
      const cacheKey=planForecastCacheKey(spot.id,forecastForMs);
      const entry=planForecastCache.entries[cacheKey];
      if(entry&&entry.forecastFor===forecastForMs) previousSnapshot=buildMorningSnapshot(entry.weather,entry.marine);
    }

    setMorningCheckStatus({loading:true,error:null});
    try{
      const {weather,marine,weatherError,marineError}=await fetchAutoConditions({lat:spot.lat,lng:spot.lng,forecastForMs});
      if(!weather&&!marine){
        setMorningCheckStatus({loading:false,error:"最新条件を取得できませんでした。前回の情報のまま判断してください。"});
        return;
      }
      setConditionsCache({schemaVersion:1,fetchedAt:Date.now(),forecastFor:forecastForMs,
        spotId:spot.id,latitude:spot.lat,longitude:spot.lng,weather,marine,weatherError,marineError});
      setMorningCheck({schemaVersion:1,planKey,checkedAt:Date.now(),forecastFor:forecastForMs,
        spotId:spot.id,targetFish:todayConditions.targetFish,
        previousSnapshot,latestSnapshot:buildMorningSnapshot(weather,marine),
        tideSnapshot:(morningCheck&&morningCheck.planKey===planKey)?morningCheck.tideSnapshot:null,
        result:null,note:""});
      setMorningCheckStatus({loading:false,error:null});
    }catch(e){
      setMorningCheckStatus({loading:false,error:"最新条件を取得できませんでした。前回の情報のまま判断してください。"});
    }
  };

  // 「✅ 予定通り行く」で「反映する」を選んだ場合のみ、Phase8と同じ手入力優先ルールでtoday_conditionsへ反映する。
  const handleApplyMorningForecast=()=>{
    const spot=currentSpots.find(s=>s.id===todayConditions.spotId);
    if(!spot) return;
    const forecastForMs=computeForecastForMs(todayConditions.date,todayConditions.plannedStartTime);
    setTodayConditions(prev=>{
      let merged={...prev};
      if(conditionsCache&&conditionsCache.spotId===spot.id&&conditionsCache.forecastFor===forecastForMs&&(conditionsCache.weather||conditionsCache.marine)){
        const autoVals=buildAutoFieldValues(conditionsCache.weather,conditionsCache.marine);
        const anyManualBefore=["weather","temperatureC","windDirection","windSpeedMs","wave","tideDirection"].some(k=>merged[k]);
        const {next,filledFromAuto}=mergeConditionsWithAuto(merged,autoVals,{overwrite:false});
        if(filledFromAuto.length>0) merged={...next,source:anyManualBefore?"mixed":(merged.source==="manual"?"auto":(merged.source||"auto"))};
      }
      if(tideCache&&tideCache.stationId===spot.tideStationId&&tideCache.date===todayConditions.date&&!merged.tideDirection){
        const rel=computeTideRelation(todayConditions.plannedStartTime,tideCache.highs,tideCache.lows);
        if(rel&&rel.direction){
          const anyManualBefore=["weather","temperatureC","windDirection","windSpeedMs","wave"].some(k=>merged[k]);
          merged={...merged,tideDirection:rel.direction,source:anyManualBefore?"mixed":(merged.source==="manual"?"auto":(merged.source||"auto"))};
        }
      }
      return {...merged,updatedAt:Date.now()};
    });
  };

  // 「🕐 時間をずらす」の下準備：現在のプランに対応する候補がなければ現在値で1件追加する（時間そのものは変更しない）。
  // 比較画面を開く操作自体はTodayFishingView側のローカル状態で行う。
  const handleEnsureCandidateForCurrentPlan=()=>{
    setPlanCandidates(prev=>{
      const exists=prev.some(c=>c.spotId===todayConditions.spotId&&c.targetFish===todayConditions.targetFish&&c.date===todayConditions.date);
      if(exists||prev.length>=MAX_PLAN_CANDIDATES) return prev;
      return [...prev,{...EMPTY_PLAN_CANDIDATE,id:uid(),date:todayConditions.date,startTime:todayConditions.plannedStartTime,
        durationMin:todayConditions.plannedDurationMin||EMPTY_PLAN_CANDIDATE.durationMin,
        spotId:todayConditions.spotId,targetFish:todayConditions.targetFish}];
    });
  };

  const recommendations=getTargetRecommendations({
    trips,catches,reports:externalReports,targetProfiles,gearProfile,
    spots:currentSpots,todayConditions:effectiveTodayConditions,now:Date.now(),
  });

  return (
    <div style={{background:"#061a2e",minHeight:"100vh",color:"#d0e8f5",paddingBottom:64}}>
      {homeModeTripId?(
        <HomeModeView tripId={homeModeTripId} tripLabel={homeModeTripLabel}
          catches={catches.filter(c=>c.tripId===homeModeTripId&&c.kept)}
          fishMaster={fishMaster} recipes={recipes}
          progress={homeProgress[homeModeTripId]||DEFAULT_HOME_PROGRESS}
          onUpdateProgress={handleUpdateHomeProgress}
          onUpdateCatch={handleUpdateCatch}
          onSaveMeal={handleSaveMeal}
          onClose={handleCloseHomeMode}/>
      ):(
        <>
          {tab==="spots"&&<SpotsTab onStartFishing={handleStartFishing}/>}
          {tab==="today"&&<TodayFishingView activeSession={activeSession} catches={catches} fishMaster={fishMaster}
            recommendations={recommendations} reports={externalReports} reportsError={reportsError}
            reportsMalformed={reportsMalformed} reportsUpdatedAt={reportsUpdatedAt}
            todayConditions={todayConditions} onSaveTodayConditions={handleSaveTodayConditions}
            onResetTodayConditions={handleResetTodayConditions} onStartFishingAt={handleStartFishing}
            trips={trips} spots={currentSpots} targetProfiles={targetProfiles} gearProfile={gearProfile}
            gearTemplates={gearTemplates} onSaveSkipLog={handleSaveSkipLog}
            conditionsCache={conditionsCache} autoFetchStatus={autoFetchStatus}
            onFetchAutoConditions={handleFetchAutoConditions} onApplyAutoField={handleApplyAutoField}
            tideCache={tideCache} autoTideStatus={autoTideStatus} onFetchTide={handleFetchTide}
            planCandidates={planCandidates} planForecastCache={planForecastCache} planFetchStatus={planFetchStatus}
            onFetchOnePlanForecast={handleFetchOnePlanForecast} onFetchAllPlanForecasts={handleFetchAllPlanForecasts}
            onAddPlanCandidate={handleAddPlanCandidate} onUpdatePlanCandidate={handleUpdatePlanCandidate}
            onDeletePlanCandidate={handleDeletePlanCandidate} onDuplicatePlanCandidate={handleDuplicatePlanCandidate}
            onAdoptPlanCandidate={handleAdoptPlanCandidate} adoptedPlan={adoptedPlan}
            onFetchPlanTide={handleFetchPlanTide}
            morningCheck={morningCheck} morningCheckStatus={morningCheckStatus}
            onMorningCheckFetch={handleMorningCheckFetch} onApplyMorningForecast={handleApplyMorningForecast}
            onEnsureCandidateForCurrentPlan={handleEnsureCandidateForCurrentPlan}
            onSwitchToSpots={()=>setTab("spots")}
            onLogEvent={handleLogEvent} onLogCatch={handleLogCatch} onUpdateCatch={handleUpdateCatch}
            onEndSession={handleEndSession}
            onOpenHomeMode={()=>activeSession&&handleOpenHomeMode(activeSession.id,`${activeSession.spotName||""} ${activeSession.date||""}`)}/>}
          {tab==="stats"&&<AnalyticsView trips={trips} catches={catches}/>}
          {tab==="trips"&&<TripLogView trips={trips} catches={catches} fishMaster={fishMaster}
            onUpdate={handleUpdateTrip} onDelete={handleDeleteTrip}
            onEditCatch={handleUpdateCatch} onDeleteCatch={handleDeleteCatch} onAddCatch={handleAddCatchToTrip}
            onOpenHomeMode={trip=>handleOpenHomeMode(trip.id,`${trip.spotName||""} ${trip.date||""}`)}/>}
          {tab==="gear"&&<GearTab gearTemplates={gearTemplates} setGearTemplates={setGearTemplates} rigGuides={rigGuides}/>}
        </>
      )}
      <BottomNav tab={tab} onChange={key=>{setHomeModeTripId(null);setTab(key);}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
