<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My 釣りポイント帳</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Sans','Helvetica Neue',Arial,sans-serif;background:#061a2e;color:#d0e8f5;font-size:14px;min-height:100vh}
input,select,textarea,button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const AREA_LABEL = { numazu:"沼津", nishiizu:"西伊豆", higashiizu:"東伊豆", minamiizu:"南伊豆", nakaizu:"中伊豆", kanagawa:"神奈川", other:"その他" };
const TYPE_LABEL = { harbor:"漁港・堤防", beach:"砂浜・サーフ", iso:"磯", pier:"桟橋・護岸", tetra:"テトラ帯" };
const STATUS_LABEL = { ok:"釣り可", ng:"禁止・NG", tbc:"要確認" };
const STATUS_COLOR = { ok:"#2ecc87", ng:"#e84c3d", tbc:"#f5a623" };
const STATUS_BG    = { ok:"rgba(46,204,135,0.15)", ng:"rgba(232,76,61,0.15)", tbc:"rgba(245,166,35,0.15)" };
const LS_KEY = "fishing_spots_v4";
const TRIPS_KEY = "fishing_trips_v1";
const GEAR_KEY = "fishing_gear_templates_v1";
const RIGGUIDE_KEY = "fishing_rig_guides_v1";
const SESSION_KEY = "fishing_active_session_v1";

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function stars(n){ return "★".repeat(n)+"☆".repeat(5-n); }

function loadStore(key,fallback){
  try{ const raw=localStorage.getItem(key); return raw===null?fallback:JSON.parse(raw); }
  catch{ return fallback; }
}
function saveStore(key,value){ try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){} }

const EMPTY_TRIP = {
  id:"", spotId:"", spotName:"", date:"",
  startAt:null, endAt:null, durationMin:null,
  targetFish:"", rig:"", bait:"",
  biteCount:0, catchCount:0, catchNote:"",
  events:[],
  good:"", hard:"", bringNextTime:"", improveNextTime:"",
  castDistance:"", tide:"", tideDirection:"", weather:"", temp:"", wind:"", waves:"", turbidity:"", crowding:"",
  troubleNote:"", memo:"",
  isBouzu:false,
  createdAt:null, updatedAt:null,
};

const SEED_GEAR_TEMPLATES = [
  { id:"gear-shirogisu", name:"シロギス・ちょい投げ", createdAt:Date.now(), updatedAt:Date.now(), items:[
    "竿","リール","仕掛け","予備仕掛け","オモリ","予備オモリ","エサ","スナップ／サルカン類","ハサミ","タオル",
    "ウェットティッシュ","ゴミ袋","手洗い用の水","クーラーボックス","保冷剤または氷","飲み物",
  ].map(label=>({id:uid(),label,checked:false})) },
];

const SEED_RIG_GUIDES = [
  { id:"rig-shirogisu", name:"シロギス・ちょい投げ",
    chain:["リール","道糸","(リーダー)","スナップ付きサルカン","天秤・オモリ","針仕掛け","エサ"],
    steps:[
      {n:1,title:"① リールを竿に取り付ける",detail:"リールシートにしっかり固定し、ガタつきがないか確認します。"},
      {n:2,title:"② 道糸をガイドに通す",detail:"竿先まで全てのガイドに順番に通します。飛ばしてしまうと投げた瞬間に絡まります。"},
      {n:3,title:"③ 接続部分を結ぶ",detail:"道糸の先にスナップ付きサルカンを結束します。"},
      {n:4,title:"④ 結束強度を確認",detail:"軽く引っ張って結び目がすっぽ抜けないか確認します。"},
      {n:5,title:"⑤ 仕掛けを装着",detail:"天秤・オモリとキス針仕掛けをスナップに接続します。"},
      {n:6,title:"⑥ エサを付ける",detail:"針にエサ（イソメ等）を付けます。"},
      {n:7,title:"⑦ 投げる前の安全確認",detail:"周囲に人がいないか確認してから投げましょう。"},
    ]},
];

const EMPTY = {
  name:"", area:"", type:"", status:"tbc", star:0,
  addr:"", lat:"", lng:"", fish:"", note:"",
  date: new Date().toISOString().slice(0,10),
  parking:false, toilet:false, paid:false, night:false, beginner:false, crowded:false,
};

function appleUrl(s){
  if(s.lat&&s.lng) return `maps://maps.apple.com/?ll=${s.lat},${s.lng}&q=${encodeURIComponent(s.name)}`;
  if(s.addr) return `maps://maps.apple.com/?q=${encodeURIComponent(s.addr)}`;
  return null;
}
function googleUrl(s){
  if(s.lat&&s.lng) return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
  if(s.addr) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.addr)}`;
  return null;
}

const inp = {
  width:"100%", background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.12)",
  borderRadius:9, padding:"10px 12px", color:"#d0e8f5", fontSize:14, outline:"none", WebkitAppearance:"none",
};

function Field({label,children}){
  return (
    <div style={{marginBottom:13}}>
      <div style={{fontSize:11,color:"#6a9bb8",fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:5}}>{label}</div>
      {children}
    </div>
  );
}
function Input(props){ return <input style={inp} {...props}/>; }
function Sel({children,...p}){ return <select style={inp} {...p}>{children}</select>; }
function Textarea(props){ return <textarea style={{...inp,resize:"vertical",minHeight:80,lineHeight:1.6}} {...props}/>; }

function StarPicker({value,onChange}){
  return (
    <div style={{display:"flex",gap:4}}>
      {[1,2,3,4,5].map(n=>(
        <button key={n} onClick={()=>onChange(n===value?0:n)}
          style={{fontSize:24,background:"none",border:"none",cursor:"pointer",padding:2,lineHeight:1,color:"#f5a623"}}>
          {n<=value?"★":"☆"}
        </button>
      ))}
    </div>
  );
}

function CheckItem({label,checked,onChange}){
  return (
    <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:"#d0e8f5",
      background:"rgba(255,255,255,0.05)",padding:"5px 9px",borderRadius:8,
      border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer"}}>
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}
        style={{accentColor:"#f5a623",width:14,height:14}}/>
      {label}
    </label>
  );
}

function Modal({show,onClose,children}){
  if(!show) return null;
  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.72)",zIndex:300,
        display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:"#0d2d47",border:"1px solid rgba(255,255,255,0.1)",
        borderRadius:"20px 20px 0 0",padding:"20px 18px 40px",width:"100%",
        maxWidth:520,maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{width:40,height:4,background:"rgba(255,255,255,0.2)",borderRadius:2,margin:"0 auto 18px"}}/>
        {children}
      </div>
    </div>
  );
}

function EditModal({show,onClose,onSave,initial}){
  const [form,setForm]=useState(EMPTY);
  const [gpsLoading,setGpsLoading]=useState(false);
  useEffect(()=>{if(show)setForm(initial||EMPTY);},[show,initial]);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const handleGPS=()=>{
    if(!navigator.geolocation){alert("GPSに対応していません");return;}
    setGpsLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos=>{
        set("lat",pos.coords.latitude.toFixed(6));
        set("lng",pos.coords.longitude.toFixed(6));
        setGpsLoading(false);
      },
      ()=>{alert("現在地の取得に失敗しました");setGpsLoading(false);},
      {enableHighAccuracy:true,timeout:10000}
    );
  };

  const handleSave=()=>{
    if(!form.name.trim()){alert("ポイント名を入力してください");return;}
    onSave(form);
  };

  return (
    <Modal show={show} onClose={onClose}>
      <h2 style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>
        {initial?.id?"✏️ ポイントを編集":"🎣 ポイントを追加"}
      </h2>
      <Field label="ポイント名 *">
        <Input placeholder="例：田子漁港（北波止）" value={form.name} onChange={e=>set("name",e.target.value)}/>
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="エリア">
          <Sel value={form.area} onChange={e=>set("area",e.target.value)}>
            <option value="">未設定</option>
            {Object.entries(AREA_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </Sel>
        </Field>
        <Field label="種別">
          <Sel value={form.type} onChange={e=>set("type",e.target.value)}>
            <option value="">未設定</option>
            {Object.entries(TYPE_LABEL).map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </Sel>
        </Field>
      </div>
      <Field label="釣り可否">
        <Sel value={form.status} onChange={e=>set("status",e.target.value)}>
          <option value="tbc">🔍 要確認</option>
          <option value="ok">✅ 釣り可（確認済み）</option>
          <option value="ng">❌ 禁止・NG</option>
        </Sel>
      </Field>
      <Field label="📍 住所・場所">
        <div style={{position:"relative"}}>
          <Input placeholder="例：静岡県賀茂郡西伊豆町田子" value={form.addr}
            onChange={e=>set("addr",e.target.value)} style={{...inp,paddingRight:100}}/>
          <button onClick={handleGPS} disabled={gpsLoading}
            style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",
              background:"rgba(245,166,35,0.2)",border:"1px solid rgba(245,166,35,0.4)",
              color:"#f5a623",borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>
            {gpsLoading?"取得中…":"📡 現在地"}
          </button>
        </div>
        <div style={{fontSize:11,color:"#6a9bb8",marginTop:5,lineHeight:1.6,
          padding:"7px 10px",background:"rgba(255,255,255,0.04)",borderRadius:7,border:"1px solid rgba(255,255,255,0.08)"}}>
          住所入力 または「📡 現在地」で緯度経度を自動記録。カードの地図ボタンで開けます。
        </div>
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="緯度"><Input type="number" step="any" placeholder="35.1234" value={form.lat} onChange={e=>set("lat",e.target.value)}/></Field>
        <Field label="経度"><Input type="number" step="any" placeholder="138.9876" value={form.lng} onChange={e=>set("lng",e.target.value)}/></Field>
      </div>
      <Field label="評価"><StarPicker value={form.star} onChange={v=>set("star",v)}/></Field>
      <Field label="設備・特徴">
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
          {[["parking","🅿 駐車場"],["toilet","🚻 トイレ"],["paid","💰 有料"],
            ["night","🌙 夜釣り可"],["beginner","🐟 初心者向け"],["crowded","👥 混雑注意"]].map(([k,l])=>(
            <CheckItem key={k} label={l} checked={form[k]} onChange={v=>set(k,v)}/>
          ))}
        </div>
      </Field>
      <Field label="狙える魚（カンマ区切り）">
        <Input placeholder="アジ、シロギス、メジナ" value={form.fish} onChange={e=>set("fish",e.target.value)}/>
      </Field>
      <Field label="メモ・偵察記録">
        <Textarea placeholder="駐車の様子、看板の位置、人の多さ、気になった点など…" value={form.note} onChange={e=>set("note",e.target.value)}/>
      </Field>
      <Field label="偵察日"><Input type="date" value={form.date} onChange={e=>set("date",e.target.value)}/></Field>
      <div style={{display:"flex",gap:8,marginTop:18}}>
        <button onClick={onClose}
          style={{background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",borderRadius:10,padding:"12px 16px",fontSize:14,cursor:"pointer"}}>
          キャンセル
        </button>
        <button onClick={handleSave}
          style={{flex:1,background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>
          💾 保存する
        </button>
      </div>
    </Modal>
  );
}

function IOModal({show,onClose,spots,onImport,onClear}){
  const fileRef=useRef();

  const handleExport=()=>{
    if(!spots.length){alert("登録されているポイントがありません");return;}
    const json=JSON.stringify({version:2,exportedAt:new Date().toISOString(),spots},null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="fishing_spots.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const handleImport=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const inc=data.spots||(Array.isArray(data)?data:[]);
        if(!inc.length){alert("データが見つかりませんでした");return;}
        onImport(inc);
      }catch{alert("読み込みに失敗しました");}
      e.target.value="";
    };
    reader.readAsText(file);
  };

  const handleClear=()=>{
    if(!confirm("⚠️ 全データを削除します。バックアップはとりましたか？"))return;
    onClear(); onClose();
  };

  const ioBtn=(emoji,title,sub,onClick,col)=>(
    <button onClick={onClick} style={{width:"100%",padding:13,borderRadius:10,fontSize:14,fontWeight:600,
      cursor:"pointer",marginBottom:8,display:"flex",alignItems:"center",gap:10,
      background:`rgba(${col},0.1)`,border:`1px solid rgba(${col},0.3)`,color:`rgb(${col})`}}>
      <span style={{fontSize:20}}>{emoji}</span>
      <div style={{textAlign:"left"}}>
        <div style={{fontWeight:700}}>{title}</div>
        <div style={{fontSize:11,opacity:0.8,marginTop:1}}>{sub}</div>
      </div>
    </button>
  );

  return (
    <Modal show={show} onClose={onClose}>
      <h2 style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>📂 データの保存・読み込み</h2>
      <div style={{fontSize:11,color:"#f5a623",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>💾 バックアップ</div>
      {ioBtn("📤","JSONファイルに書き出す","fishing_spots.json としてダウンロード",handleExport,"46,204,135")}
      <div style={{fontSize:11,color:"#6a9bb8",lineHeight:1.7,padding:"8px 10px",
        background:"rgba(255,255,255,0.04)",borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",marginBottom:16}}>
        <strong style={{color:"#d0e8f5"}}>データの持ち運び方：</strong><br/>
        ① 書き出しボタンで fishing_spots.json をダウンロード<br/>
        ② iCloud Driveの釣りフォルダに保存<br/>
        ③ 次回アプリを開いたら「読み込み」で復元
      </div>
      <div style={{fontSize:11,color:"#f5a623",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>📥 復元</div>
      {ioBtn("📂","JSONファイルを読み込む","保存済みの fishing_spots.json を選択",()=>fileRef.current.click(),"245,166,35")}
      <input ref={fileRef} type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
      <div style={{fontSize:11,color:"#6a9bb8",lineHeight:1.7,padding:"8px 10px",
        background:"rgba(255,255,255,0.04)",borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",marginBottom:16}}>
        現在のデータに<strong style={{color:"#d0e8f5"}}>追記</strong>されます（重複は自動スキップ）。
      </div>
      <div style={{fontSize:11,color:"#f5a623",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>🗑 リセット</div>
      {ioBtn("⚠️","全データを削除する","削除前に必ずバックアップを取ってください",handleClear,"232,76,61")}
      <button onClick={onClose}
        style={{width:"100%",padding:12,borderRadius:10,fontSize:14,cursor:"pointer",
          background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8",marginTop:4}}>
        閉じる
      </button>
    </Modal>
  );
}

function SpotCard({spot,onEdit,onDelete,onStartFishing}){
  const tags=[];
  if(spot.area) tags.push(AREA_LABEL[spot.area]||spot.area);
  if(spot.type) tags.push(TYPE_LABEL[spot.type]||spot.type);
  if(spot.parking) tags.push("🅿");
  if(spot.toilet)  tags.push("🚻");
  if(spot.paid)    tags.push("💰有料");
  if(spot.night)   tags.push("🌙夜OK");
  if(spot.beginner)tags.push("🐟初心者向け");
  if(spot.crowded) tags.push("👥混雑注意");
  if(spot.fish) spot.fish.split(/[,、，]/).map(f=>f.trim()).filter(Boolean).forEach(f=>tags.push("🐠"+f));

  const aUrl=appleUrl(spot);
  const gUrl=googleUrl(spot);
  const coordStr=spot.lat&&spot.lng?`${parseFloat(spot.lat).toFixed(4)}, ${parseFloat(spot.lng).toFixed(4)}`:"";

  return (
    <div style={{background:"rgba(255,255,255,0.06)",borderRadius:12,padding:"13px 14px",
      borderLeft:`3px solid ${STATUS_COLOR[spot.status]}`,
      border:"1px solid rgba(255,255,255,0.1)",borderLeftWidth:3,borderLeftColor:STATUS_COLOR[spot.status]}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff",flex:1,lineHeight:1.3}}>{spot.name}</div>
        <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,
          background:STATUS_BG[spot.status],color:STATUS_COLOR[spot.status],whiteSpace:"nowrap"}}>
          {STATUS_LABEL[spot.status]}
        </span>
      </div>
      {spot.star>0&&<div style={{fontSize:13,color:"#f5a623",marginTop:5}}>{stars(spot.star)}</div>}
      {tags.length>0&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:7}}>
          {tags.map((t,i)=>(
            <span key={i} style={{fontSize:11,background:"rgba(255,255,255,0.08)",borderRadius:4,padding:"2px 6px",color:"#6a9bb8"}}>{t}</span>
          ))}
        </div>
      )}
      {spot.addr&&(
        <div style={{fontSize:11,color:"#6a9bb8",marginTop:6,display:"flex",alignItems:"center",gap:5}}>
          📍 <span>{spot.addr}</span>
          {coordStr&&<span style={{opacity:0.5,fontSize:10}}>({coordStr})</span>}
        </div>
      )}
      {spot.note&&(
        <div style={{fontSize:12,color:"#6a9bb8",marginTop:7,lineHeight:1.6}}>
          {spot.note.slice(0,100)}{spot.note.length>100?"…":""}
        </div>
      )}
      <div style={{fontSize:10,color:"rgba(106,155,184,0.5)",marginTop:5}}>
        {spot.date?`偵察日：${spot.date}`:"日付未記録"}
      </div>
      {(aUrl||gUrl)&&(
        <div style={{display:"flex",gap:6,marginTop:9,flexWrap:"wrap"}}>
          {aUrl&&<a href={aUrl} target="_blank" rel="noreferrer"
            style={{fontSize:11,padding:"6px 10px",borderRadius:8,fontWeight:600,
              display:"flex",alignItems:"center",gap:4,
              background:"rgba(255,255,255,0.12)",color:"#fff",textDecoration:"none"}}>
            🗺 Apple Maps
          </a>}
          {gUrl&&<a href={gUrl} target="_blank" rel="noreferrer"
            style={{fontSize:11,padding:"6px 10px",borderRadius:8,fontWeight:600,
              display:"flex",alignItems:"center",gap:4,
              background:"rgba(66,133,244,0.25)",color:"#7ab3ff",textDecoration:"none"}}>
            📍 Google Maps
          </a>}
        </div>
      )}
      <button onClick={()=>onStartFishing(spot)}
        style={{width:"100%",marginTop:9,padding:"9px 0",borderRadius:8,fontSize:13,fontWeight:700,
          border:"1px solid rgba(245,166,35,0.4)",background:"rgba(245,166,35,0.15)",color:"#f5a623",cursor:"pointer"}}>
        🎣 ここで釣り開始
      </button>
      <div style={{display:"flex",gap:6,marginTop:6}}>
        <button onClick={()=>onEdit(spot)}
          style={{fontSize:11,padding:"5px 10px",borderRadius:6,
            border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#6a9bb8",cursor:"pointer"}}>
          ✏️ 編集
        </button>
        <button onClick={()=>onDelete(spot.id)}
          style={{fontSize:11,padding:"5px 10px",borderRadius:6,
            border:"1px solid rgba(232,76,61,0.4)",background:"transparent",color:"rgba(232,76,61,0.8)",cursor:"pointer"}}>
          🗑 削除
        </button>
      </div>
    </div>
  );
}

function SpotsTab({onStartFishing}){
  const [spots,setSpots]=useState(()=>{
    try{ const d=localStorage.getItem(LS_KEY); return d?JSON.parse(d):[]; }catch{ return []; }
  });
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [showEdit,setShowEdit]=useState(false);
  const [showIO,setShowIO]=useState(false);
  const [editTarget,setEditTarget]=useState(null);

  useEffect(()=>{
    try{ localStorage.setItem(LS_KEY,JSON.stringify(spots)); }catch(e){}
  },[spots]);

  const filtered=spots.filter(s=>{
    const mf=filter==="all"?true:filter==="fav"?s.star>=4:
      filter==="nishiizu"?s.area==="nishiizu":filter==="higashiizu"?s.area==="higashiizu":
      filter==="minamiizu"?s.area==="minamiizu":filter==="numazu"?s.area==="numazu":s.status===filter;
    const q=search.trim().toLowerCase();
    const mq=!q||(s.name||"").toLowerCase().includes(q)||(s.note||"").toLowerCase().includes(q)||
      (s.fish||"").toLowerCase().includes(q)||(s.addr||"").toLowerCase().includes(q);
    return mf&&mq;
  });

  const openAdd=()=>{setEditTarget(null);setShowEdit(true);};
  const openEdit=s=>{setEditTarget(s);setShowEdit(true);};

  const handleSave=form=>{
    if(editTarget?.id){
      setSpots(prev=>prev.map(s=>s.id===editTarget.id?{...form,id:editTarget.id,updatedAt:Date.now()}:s));
    }else{
      setSpots(prev=>[{...form,id:uid(),updatedAt:Date.now()},...prev]);
    }
    setShowEdit(false);
  };

  const handleDelete=id=>{
    if(!confirm("このポイントを削除しますか？"))return;
    setSpots(prev=>prev.filter(s=>s.id!==id));
  };

  const handleImport=incoming=>{
    setSpots(prev=>{
      const ids=new Set(prev.map(s=>s.id));
      let added=0;
      const newOnes=incoming.filter(s=>{if(!ids.has(s.id)){added++;return true;}return false;});
      alert(`✅ ${added}件のポイントを読み込みました（重複スキップ：${incoming.length-added}件）`);
      return [...newOnes,...prev];
    });
  };

  const chips=[
    ["all","すべて"],["ok","✅ 釣り可"],["ng","❌ NG"],["tbc","🔍 要確認"],["fav","⭐ お気に入り"],
    ["numazu","沼津"],["nishiizu","西伊豆"],["higashiizu","東伊豆"],["minamiizu","南伊豆"],
  ];

  const Stat=({label,val,color})=>(
    <div style={{flex:1,textAlign:"center",padding:"9px 4px",borderRight:"1px solid rgba(255,255,255,0.1)"}}>
      <div style={{fontSize:19,fontWeight:700,color:color||"#fff"}}>{val}</div>
      <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>{label}</div>
    </div>
  );

  return (
    <div style={{background:"#061a2e",minHeight:"100vh",color:"#d0e8f5"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0a2a4a,#0d3a5c)",padding:"14px 16px",
        borderBottom:"1px solid rgba(255,255,255,0.1)",display:"flex",alignItems:"center",
        justifyContent:"space-between",gap:8,position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>🎣</span>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>My 釣りポイント帳</div>
            <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>偵察・お気に入り釣り場を管理</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setShowIO(true)}
            style={{background:"rgba(255,255,255,0.1)",color:"#d0e8f5",
              border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,padding:"7px 10px",fontSize:12,cursor:"pointer"}}>
            📂 保存/読込
          </button>
          <button onClick={openAdd}
            style={{background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:8,
              padding:"7px 12px",fontSize:13,fontWeight:700,cursor:"pointer"}}>
            ＋ 追加
          </button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.25)"}}>
        <Stat label="合計" val={spots.length}/>
        <Stat label="✅ 釣り可" val={spots.filter(s=>s.status==="ok").length} color="#2ecc87"/>
        <Stat label="❌ NG" val={spots.filter(s=>s.status==="ng").length} color="#e84c3d"/>
        <Stat label="🔍 要確認" val={spots.filter(s=>s.status==="tbc").length} color="#f5a623"/>
        <div style={{flex:1,textAlign:"center",padding:"9px 4px"}}>
          <div style={{fontSize:19,fontWeight:700,color:"#f5c842"}}>{spots.filter(s=>s.star>=4).length}</div>
          <div style={{fontSize:10,color:"#6a9bb8",marginTop:1}}>⭐ お気に入り</div>
        </div>
      </div>

      {/* Search */}
      <div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,0.1)",background:"#0a2a4a"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="🔍 ポイント名・魚種・メモで検索…"
          style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",
            borderRadius:8,padding:"8px 12px",color:"#d0e8f5",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
      </div>

      {/* Filter */}
      <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",
        borderBottom:"1px solid rgba(255,255,255,0.1)",background:"#0a2a4a"}}>
        {chips.map(([f,label])=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{background:filter===f?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${filter===f?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:filter===f?"#f5a623":"#6a9bb8",fontWeight:filter===f?700:400,
              borderRadius:20,padding:"4px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>
            {label}
          </button>
        ))}
      </div>

      {/* List */}
      <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:"48px 20px",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
            <div style={{fontSize:38,marginBottom:10}}>{spots.length?"🔍":"🎣"}</div>
            {spots.length?"絞り込み結果がありません":
              <span>「＋ 追加」ボタンで最初の釣り場を記録しましょう！<br/>
              データは「📂 保存/読込」でJSONに書き出し、<br/>次回読み込むと復元できます。</span>}
          </div>
        ):filtered.map(s=>(
          <SpotCard key={s.id} spot={s} onEdit={openEdit} onDelete={handleDelete} onStartFishing={onStartFishing}/>
        ))}
      </div>

      <EditModal show={showEdit} onClose={()=>setShowEdit(false)} onSave={handleSave} initial={editTarget}/>
      <IOModal show={showIO} onClose={()=>setShowIO(false)} spots={spots} onImport={handleImport} onClear={()=>setSpots([])}/>
    </div>
  );
}

    <div style={{position:"fixed",left:"50%",bottom:80,transform:"translateX(-50%)",

function TodayFishingView({activeSession,onSwitchToSpots,onLogEvent,onEndSession}){
  const [showEnd,setShowEnd]=useState(false);
  const [toast,setToast]=useState("");
  const flash=msg=>{ setToast(msg); clearTimeout(flash._t); flash._t=setTimeout(()=>setToast(""),1400); };

  if(!activeSession){
    return (
      <div style={{padding:"48px 20px",textAlign:"center",color:"#6a9bb8",fontSize:13,lineHeight:2}}>
        <div style={{fontSize:38,marginBottom:10}}>🎣</div>
        進行中の釣行がありません。<br/>
        「📍 ポイント」タブでスポットを選び、<br/>「🎣 ここで釣り開始」から始めましょう。
        <div style={{marginTop:16}}>
          <button onClick={onSwitchToSpots}
            style={{background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:10,padding:"10px 18px",fontSize:14,fontWeight:700,cursor:"pointer"}}>
            📍 ポイントを選ぶ
          </button>
        </div>
      </div>
    );
  }

  const elapsed=Math.max(0,Math.round((Date.now()-activeSession.startAt)/60000));
  const actions=[
    ["bite","👆","アタリ","46,204,135"],
    ["catch","🐟","釣れた","245,166,35"],
    ["rig_change","🔧","仕掛け交換","106,155,184"],
    ["trouble","⚠️","トラブル","232,76,61"],
  ];

  return (
    <div style={{padding:"16px 14px"}}>
      <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>{activeSession.spotName||"（スポット未設定）"}</div>
        <div style={{fontSize:12,color:"#6a9bb8",marginTop:4}}>
          開始 {new Date(activeSession.startAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}（経過 {elapsed}分）
        </div>
        <div style={{display:"flex",gap:14,marginTop:8,fontSize:12,color:"#d0e8f5"}}>
          <span>👆 アタリ {activeSession.biteCount||0}</span>
          <span>🐟 釣果 {activeSession.catchCount||0}</span>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        {actions.map(([type,emoji,label,col])=>(
          <button key={type} onClick={()=>{onLogEvent(type);flash(`${emoji} ${label} を記録しました`);}}
            style={{padding:"18px 8px",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer",
              background:`rgba(${col},0.12)`,border:`1px solid rgba(${col},0.35)`,color:`rgb(${col})`}}>
            <div style={{fontSize:26,marginBottom:4}}>{emoji}</div>{label}
          </button>
        ))}
      </div>

      <button onClick={()=>{
          const note=prompt("メモを入力してください");
          if(note!==null&&note.trim()){onLogEvent("memo",note.trim());flash("📝 メモを記録しました");}
        }}
        style={{width:"100%",padding:"12px 8px",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:10,
          background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",color:"#d0e8f5"}}>
        📝 メモを追加
      </button>

      <button onClick={()=>setShowEnd(true)}
        style={{width:"100%",padding:14,borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",
          background:"#e84c3d",border:"none",color:"#fff"}}>
        🏁 釣り終了
      </button>

      {activeSession.events?.length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#6a9bb8",fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>ログ</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {[...activeSession.events].reverse().map(ev=>(
              <div key={ev.id} style={{fontSize:12,color:"#6a9bb8",display:"flex",gap:8}}>
                <span style={{opacity:0.6}}>{new Date(ev.ts).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</span>
                <span>{({bite:"👆 アタリ",catch:"🐟 釣れた",rig_change:"🔧 仕掛け交換",trouble:"⚠️ トラブル",memo:"📝 "+ev.note})[ev.type]||ev.type}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <Toast text={toast}/>
      <EndSessionModal show={showEnd} onClose={()=>setShowEnd(false)} onSave={review=>{setShowEnd(false);onEndSession(review);}}/>
    </div>
  );
}

        </div>
      )}
      <TripEditModal show={!!editTarget} onClose={()=>setEditTarget(null)} initial={editTarget}
        onSave={form=>{onUpdate(editTarget.id,form);setEditTarget(null);}}/>
    </div>
  );
}

function GearChecklistView({template,onToggleItem,onAddItem,onRemoveItem,onResetAll}){
  const [newItem,setNewItem]=useState("");
  if(!template) return null;
  return (
    <div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
        {template.items.map(item=>(
          <div key={item.id} style={{display:"flex",alignItems:"center",gap:8}}>
            <CheckItem label={item.label} checked={item.checked} onChange={v=>onToggleItem(item.id,v)}/>
            <button onClick={()=>onRemoveItem(item.id)}
              style={{background:"none",border:"none",color:"rgba(232,76,61,0.7)",fontSize:14,cursor:"pointer",padding:4}}>
              ✕
            </button>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <Input placeholder="持ち物を追加…" value={newItem} onChange={e=>setNewItem(e.target.value)}/>
        <button onClick={()=>{ if(newItem.trim()){onAddItem(newItem.trim());setNewItem("");} }}
          style={{background:"#f5a623",color:"#1a0a00",border:"none",borderRadius:9,padding:"0 16px",fontSize:14,fontWeight:700,cursor:"pointer"}}>
          追加
        </button>
      </div>
      <button onClick={onResetAll}
        style={{width:"100%",padding:10,borderRadius:9,fontSize:13,cursor:"pointer",
          background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:"#6a9bb8"}}>
        チェックを全部リセット
      </button>
    </div>
  );
}

function RigGuideView({guide}){
  const [step,setStep]=useState(0);
  if(!guide) return null;
  const s=guide.steps[step];
  return (
    <div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}}>
        {guide.chain.map((c,i)=>(
          <span key={i} style={{fontSize:11,background:"rgba(255,255,255,0.08)",borderRadius:4,padding:"3px 8px",color:"#6a9bb8"}}>
            {c}{i<guide.chain.length-1?" →":""}
          </span>
        ))}
      </div>
      <div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:16,minHeight:120}}>
        <div style={{fontSize:15,fontWeight:700,color:"#fff",marginBottom:8}}>{s.title}</div>
        <div style={{fontSize:13,color:"#6a9bb8",lineHeight:1.7}}>{s.detail}</div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center",justifyContent:"space-between"}}>
        <button disabled={step===0} onClick={()=>setStep(s=>s-1)}
          style={{padding:"9px 16px",borderRadius:9,fontSize:13,cursor:step===0?"default":"pointer",
            background:"transparent",border:"1px solid rgba(255,255,255,0.15)",color:step===0?"rgba(106,155,184,0.4)":"#6a9bb8"}}>
          ← 前へ
        </button>
        <span style={{fontSize:12,color:"#6a9bb8"}}>{step+1} / {guide.steps.length}</span>
        <button disabled={step===guide.steps.length-1} onClick={()=>setStep(s=>s+1)}
          style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:step===guide.steps.length-1?"default":"pointer",
            background:step===guide.steps.length-1?"transparent":"#f5a623",
            border:step===guide.steps.length-1?"1px solid rgba(255,255,255,0.15)":"none",
            color:step===guide.steps.length-1?"rgba(106,155,184,0.4)":"#1a0a00"}}>
          次へ →
        </button>
      </div>
    </div>
  );
}

function GearTab({gearTemplates,setGearTemplates,rigGuides}){
  const [sub,setSub]=useState("gear");
  const template=gearTemplates[0]||null;
  const guide=rigGuides[0]||null;

  const updateTemplate=updater=>{
    setGearTemplates(prev=>prev.map((t,i)=>i===0?updater(t):t));
  };
  const onToggleItem=(id,checked)=>updateTemplate(t=>({...t,items:t.items.map(it=>it.id===id?{...it,checked}:it),updatedAt:Date.now()}));
  const onAddItem=label=>updateTemplate(t=>({...t,items:[...t.items,{id:uid(),label,checked:false}],updatedAt:Date.now()}));
  const onRemoveItem=id=>updateTemplate(t=>({...t,items:t.items.filter(it=>it.id!==id),updatedAt:Date.now()}));
  const onResetAll=()=>{ if(confirm("チェックを全部リセットしますか？")) updateTemplate(t=>({...t,items:t.items.map(it=>({...it,checked:false})),updatedAt:Date.now()})); };

  return (
    <div style={{padding:"12px 14px"}}>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:10}}>🎒 {template?template.name:"持ち物"}</div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["gear","✅ チェックリスト"],["guide","🪝 仕掛けガイド"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSub(k)}
            style={{background:sub===k?"#0d3a5c":"rgba(255,255,255,0.06)",
              border:`1px solid ${sub===k?"#f5a623":"rgba(255,255,255,0.1)"}`,
              color:sub===k?"#f5a623":"#6a9bb8",fontWeight:sub===k?700:400,
              borderRadius:20,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>
            {l}
          </button>
        ))}
      </div>
      {sub==="gear"
        ?<GearChecklistView template={template} onToggleItem={onToggleItem} onAddItem={onAddItem} onRemoveItem={onRemoveItem} onResetAll={onResetAll}/>
        :<RigGuideView guide={guide}/>}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState(()=>loadStore(SESSION_KEY,{schemaVersion:1,session:null}).session?"today":"spots");
  const [activeSession,setActiveSession]=useState(()=>loadStore(SESSION_KEY,{schemaVersion:1,session:null}).session);
  const [trips,setTrips]=useState(()=>loadStore(TRIPS_KEY,{schemaVersion:1,trips:[]}).trips);
  const [gearTemplates,setGearTemplates]=useState(()=>{
    const store=loadStore(GEAR_KEY,null);
    if(store===null){ saveStore(GEAR_KEY,{schemaVersion:1,templates:SEED_GEAR_TEMPLATES}); return SEED_GEAR_TEMPLATES; }
    return store.templates;
  });
  const [rigGuides,setRigGuides]=useState(()=>{
    const store=loadStore(RIGGUIDE_KEY,null);
    if(store===null){ saveStore(RIGGUIDE_KEY,{schemaVersion:1,guides:SEED_RIG_GUIDES}); return SEED_RIG_GUIDES; }
    return store.guides;
  });

  useEffect(()=>{ saveStore(SESSION_KEY,{schemaVersion:1,session:activeSession}); },[activeSession]);
  useEffect(()=>{ saveStore(TRIPS_KEY,{schemaVersion:1,trips}); },[trips]);
  useEffect(()=>{ saveStore(GEAR_KEY,{schemaVersion:1,templates:gearTemplates}); },[gearTemplates]);
  useEffect(()=>{ saveStore(RIGGUIDE_KEY,{schemaVersion:1,guides:rigGuides}); },[rigGuides]);

  const handleStartFishing=spot=>{
    if(activeSession&&!confirm("進行中のセッションがあります。終了して新しく開始しますか？"))return;
    setActiveSession({...EMPTY_TRIP,id:uid(),spotId:spot.id,spotName:spot.name,
      startAt:Date.now(),date:new Date().toISOString().slice(0,10)});
    setTab("today");
  };

  const handleLogEvent=(type,note)=>{
    setActiveSession(prev=>{
      if(!prev)return prev;
      const ev={id:uid(),ts:Date.now(),type,note:note||""};
      const next={...prev,events:[...prev.events,ev]};
      if(type==="bite")next.biteCount=(next.biteCount||0)+1;
      if(type==="catch")next.catchCount=(next.catchCount||0)+1;
      return next;
    });
  };

  const handleEndSession=review=>{
    setActiveSession(prev=>{
      if(!prev)return prev;
      const endAt=Date.now();
      const durationMin=prev.startAt?Math.round((endAt-prev.startAt)/60000):null;
      const finished={...prev,...review,endAt,durationMin,
        isBouzu:(prev.catchCount||0)===0,updatedAt:Date.now(),createdAt:prev.createdAt||Date.now()};
      setTrips(t=>[finished,...t]);
      return null;
    });
    setTab("trips");
  };

  const handleUpdateTrip=(id,form)=>{
    setTrips(prev=>prev.map(t=>t.id===id?{...t,...form,updatedAt:Date.now()}:t));
  };
  const handleDeleteTrip=id=>{
    if(!confirm("この釣行記録を削除しますか？"))return;
    setTrips(prev=>prev.filter(t=>t.id!==id));
  };

  return (
    <div style={{background:"#061a2e",minHeight:"100vh",color:"#d0e8f5",paddingBottom:64}}>
      {tab==="spots"&&<SpotsTab onStartFishing={handleStartFishing}/>}
      {tab==="today"&&<TodayFishingView activeSession={activeSession} onSwitchToSpots={()=>setTab("spots")}
        onLogEvent={handleLogEvent} onEndSession={handleEndSession}/>}
      {tab==="stats"&&<AnalyticsPlaceholderView tripsCount={trips.length}/>}
      {tab==="trips"&&<TripLogView trips={trips} onUpdate={handleUpdateTrip} onDelete={handleDeleteTrip}/>}
      {tab==="gear"&&<GearTab gearTemplates={gearTemplates} setGearTemplates={setGearTemplates} rigGuides={rigGuides}/>}
      <BottomNav tab={tab} onChange={setTab}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
